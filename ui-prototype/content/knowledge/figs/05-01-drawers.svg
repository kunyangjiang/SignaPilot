<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 300" role="img" aria-label="同一本书两个抽屉的示意图，本课自绘。左边一个书柜，标东汉《汉书·艺文志》，一个抽屉拉开，标儒家，里面一卷书标《太玄》；中间一个书柜标唐初《隋书·经籍志》，同样在儒家；右边一个书柜标清乾隆《四库全书总目》，《太玄》出现在另一个抽屉里，标术数类，排第一。底部：书没变，抽屉变了">
