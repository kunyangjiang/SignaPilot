<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 360" role="img" aria-label="《教程》两个比喻的示意图，本课自绘。上半：左右两列火车，都挂着 20:45 日内瓦到巴黎的牌子。左边标昨天，右边标今天，两列车的机车形状和车窗排法都不一样，下面写机车、车厢、乘务员全换了，还是同一趟快车。下半：一角棋盘，一个虚线画的马的轮廓标丢了的马，箭头指向棋盘格里的一枚硬币，写大家同意它是马，它就是马。底部：身份来自位置，不来自材料">
  <!-- signs -->
  <g class="gl" filter="url(#wob2)"><rect x="44" y="14" width="150" height="24" rx="4"/><rect x="296" y="14" width="150" height="24" rx="4"/></g>
  <g style="font-size:12px" text-anchor="middle"><text x="119" y="31">20:45 日内瓦 → 巴黎</text><text x="371" y="31">20:45 日内瓦 → 巴黎</text></g>
  <g class="sm" style="font-size:11.5px" text-anchor="middle"><text x="119" y="56">昨天</text><text x="371" y="56">今天</text></g>
  <!-- yesterday train -->
  <g class="l" filter="url(#wob2)">
    <path d="M24 110V78H56L66 66H80V110Z"/><circle cx="38" cy="114" r="6"/><circle cx="66" cy="114" r="6"/>
    <rect x="86" y="72" width="58" height="38" rx="3"/><rect x="150" y="72" width="58" height="38" rx="3"/>
    <circle cx="98" cy="114" r="5"/><circle cx="132" cy="114" r="5"/><circle cx="162" cy="114" r="5"/><circle cx="196" cy="114" r="5"/>
  </g>
  <g class="l thin"><rect x="92" y="80" width="12" height="12"/><rect x="109" y="80" width="12" height="12"/><rect x="126" y="80" width="12" height="12"/><rect x="156" y="80" width="12" height="12"/><rect x="173" y="80" width="12" height="12"/><rect x="190" y="80" width="12" height="12"/></g>
  <!-- today train -->
  <g class="l" filter="url(#wob2)">
    <path d="M276 110V84Q276 70 296 70H330V110Z"/><circle cx="290" cy="114" r="6"/><circle cx="318" cy="114" r="6"/>
    <rect x="336" y="66" width="68" height="44" rx="8"/><rect x="410" y="66" width="60" height="44" rx="8"/>
    <circle cx="350" cy="114" r="5"/><circle cx="390" cy="114" r="5"/><circle cx="422" cy="114" r="5"/><circle cx="458" cy="114" r="5"/>
  </g>
  <g class="l thin"><path d="M344 78h52v14h-52zM418 78h44v14h-44z"/></g>
  <path class="l thin" d="M16 122H226M266 122H474"/>
  <text x="245" y="146" text-anchor="middle" class="sm" style="font-size:12px">机车、车厢、乘务员全换了</text>
  <text x="245" y="166" text-anchor="middle" class="gt" style="font-size:13px">还是“同一趟快车”</text>
  <!-- chess corner -->
  <g class="l thin">
    <rect x="140" y="196" width="160" height="80"/>
    <path d="M180 196V276M220 196V276M260 196V276M140 236H300"/>
  </g>
  <path class="wash" d="M140 196h40v40h-40zM220 196h40v40h-40zM180 236h40v40h-40zM260 236h40v40h-40z" style="opacity:.55"/>
  <circle class="l" cx="240" cy="256" r="13" filter="url(#wob2)"/>
  <text x="240" y="261" text-anchor="middle" style="font-size:12px">1</text>
  <!-- lost knight outline -->
  <path class="l thin" stroke-dasharray="3 3" d="M70 274H104V264Q104 246 96 236Q106 230 104 218Q96 206 82 208L72 218L76 226Q66 240 74 264H70Z"/>
  <text x="87" y="294" text-anchor="middle" class="sm" style="font-size:11.5px">丢了的马</text>
  <path class="gl" d="M110 240Q170 300 226 262" stroke-dasharray="4 4"/>
  <text x="318" y="252" class="sm" style="font-size:11.5px">一枚硬币</text>
  <text x="318" y="270" class="sm" style="font-size:11.5px">大家同意它是马</text>
  <text x="318" y="288" class="sm" style="font-size:11.5px">它就是马</text>
  <path class="l thin" d="M16 312H474"/>
  <text x="245" y="340" text-anchor="middle" class="gt" style="font-size:13px">身份来自位置，不来自材料</text>
</svg>
