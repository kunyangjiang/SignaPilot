<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 376" role="img" aria-label="一张示意图，横轴是年份，从 1900 到 2020；纵轴从上到下分偏希腊、折中、偏埃及三档。各家观点画成点：1904 年赖岑施泰因，偏埃及；1924 年起司各特，偏希腊；1944 至 1954 年费斯蒂吉埃，最偏希腊；1949 年斯特里克，偏埃及；1962 年德尔尚，偏埃及；1975 年莫米利亚诺，偏希腊，认为是装成埃及的希腊作品；1978 至 1982 年马埃，偏埃及；1986 年福登，折中；2018 年布尔，偏埃及。底部标出新材料：1945 年拿戈玛第抄本出土，1970 年代发表；2005 年埃及语《托特之书》出版。这是示意，点的位置只表示大致倾向">
