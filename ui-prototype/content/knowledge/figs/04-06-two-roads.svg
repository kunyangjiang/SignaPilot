<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" role="img" aria-label="两条路的示意图，本课自绘。上面一条路标手抄：从左到右，10 世纪中叶阿拉伯文原书，13 世纪中叶译成西班牙文、再译成拉丁文，1456 年第一次被提到，1458—1459 年最早有年代的抄本，之后一串小抄本向右散开，标在欧洲流传到 17 世纪，那几百年里没有印本。下面一条路标印刷：1510 年手稿初稿，1531 年第一卷印出，1533 年三卷全本在科隆印出，之后一摞一样的书向右排开。底部：手抄本每一份都可能不同，读者少；印本一模一样，读者多，也更容易被盯上">
  <text x="16" y="30" class="gt" style="font-size:13.5px">《皮卡特里克斯》：手抄</text>
  <path class="l" d="M24 76H300"/>
  <g class="dotk"><circle cx="30" cy="76" r="4.5"/><circle cx="110" cy="76" r="4.5"/><circle cx="200" cy="76" r="4.5"/><circle cx="270" cy="76" r="4.5"/></g>
  <g style="font-size:11.5px" text-anchor="middle">
    <text x="36" y="60">10 世纪中叶</text><text x="36" y="100" class="sm">阿拉伯文</text>
    <text x="110" y="60">13 世纪中叶</text><text x="110" y="100" class="sm">西班牙文</text><text x="110" y="114" class="sm">→ 拉丁文</text>
    <text x="200" y="60">1456</text><text x="200" y="100" class="sm">第一次</text><text x="200" y="114" class="sm">被提到</text>
    <text x="270" y="60">1458—59</text><text x="270" y="100" class="sm">最早有年代</text><text x="270" y="114" class="sm">的抄本</text>
  </g>
  <!-- scattered copies, all a bit different -->
  <g class="l thin">
    <path d="M318 52h20v26h-20z" transform="rotate(-8 328 65)"/><path d="M350 66h18v24h-18z" transform="rotate(6 359 78)"/>
    <path d="M380 46h22v28h-22z" transform="rotate(-3 391 60)"/><path d="M412 70h18v22h-18z" transform="rotate(10 421 81)"/>
    <path d="M440 50h20v26h-20z" transform="rotate(-12 450 63)"/>
  </g>
  <text x="390" y="116" text-anchor="middle" class="sm" style="font-size:11.5px">流传到 17 世纪，其间没有印本</text>
  <path class="l thin" d="M16 146H474" stroke-dasharray="2 4"/>
  <text x="16" y="178" class="gt" style="font-size:13.5px">阿格里帕《论秘传哲学》：印刷</text>
  <path class="l" d="M24 224H300"/>
  <g class="dotk"><circle cx="40" cy="224" r="4.5"/><circle cx="160" cy="224" r="4.5"/><circle cx="270" cy="224" r="4.5"/></g>
  <g style="font-size:11.5px" text-anchor="middle">
    <text x="40" y="208">1510</text><text x="40" y="248" class="sm">手稿初稿</text>
    <text x="160" y="208">1531</text><text x="160" y="248" class="sm">第一卷印出</text>
    <text x="270" y="208">1533</text><text x="270" y="248" class="sm">三卷全本</text><text x="270" y="262" class="sm">科隆</text>
  </g>
  <!-- identical printed copies -->
  <g class="l thin">
    <path d="M320 200h20v26h-20zM348 200h20v26h-20zM376 200h20v26h-20zM404 200h20v26h-20zM432 200h20v26h-20z"/>
  </g>
  <text x="390" y="250" text-anchor="middle" class="sm" style="font-size:11.5px">一模一样的许多本</text>
  <text x="245" y="300" text-anchor="middle" class="gt" style="font-size:12.5px">手抄本份份不同、读者少；印本一模一样、读者多</text>
  <text x="245" y="318" text-anchor="middle" class="sm" style="font-size:11.5px">印本也更容易被教会和官府盯上</text>
</svg>
