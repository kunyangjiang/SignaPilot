<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 336" role="img" aria-label="三种术数的证据时间线，本课自绘。一条从西汉到清代的横轴，上中下三行分别是太乙、六壬、遁甲。太乙一行：西汉初汝阴侯墓出土的式盘，据二手研究；《汉书·艺文志》著录泰壹阴阳，书已不存；唐开元年间王希明奉敕编《太乙金镜式经》。六壬一行：西汉初同墓出土的式盘，据二手研究；东汉人写的《吴越春秋》《越绝书》里有近似的说法；《隋书·经籍志》著录六壬式经；唐《唐六典》写下四课、三传、十二将。遁甲一行：南朝宋人写的《后汉书》说东汉高获晓遁甲；《隋书·经籍志》著录遁甲书十几家；北宋杨维德奉命撰《遁甲玉函符应经》；明程道生《遁甲演义》写出九宫、三奇、六仪、八门、九星。底部：越往后，文字写得越完整；早期证据多是名字和器物，具体规则要到很晚才有书写定">
