  <text x="245" y="306" text-anchor="middle" class="gt" style="font-size:12px">越往后，文字写得越完整</text>
  <text x="245" y="324" text-anchor="middle" class="sm" style="font-size:11px">早期证据多是名字和器物；具体规则要到很晚才写定</text>
