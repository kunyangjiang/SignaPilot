    <text x="280" y="88" class="gt">解释</text><text x="316" y="88" class="sm" style="font-size:12px">言语可靠，国土欢喜</text>
    <text x="280" y="140" class="gt">观测</text><text x="316" y="140" class="sm" style="font-size:12px">火星在天蝎座里，变暗</text>
    <text x="280" y="160" class="gt">计算</text><text x="316" y="160" class="sm" style="font-size:12px">第四个月 25 日离开</text>
