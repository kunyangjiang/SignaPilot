<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 340" role="img" aria-label="拉希尔报告泥板的示意图，本课自绘，不是原物照片。一块圆角泥板上刻着几行楔形文字，右边用四种括号把文字分成四段：月亮初一出现，标观测；言语可靠、国土欢喜，标解释；火星到第四个月 25 日离开天蝎座，标计算；国王要多加小心，标建议。泥板下方写着：一块泥板，四种工作">
