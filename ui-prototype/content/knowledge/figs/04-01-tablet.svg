    <path d="M58 172h18M82 166v12M92 172l6 -6 0 12zM110 172h16M132 166l5 6-5 6M146 172l6 -6 0 12zM164 172h28M198 166v12"/>
    <path d="M58 202l6 -6 0 12zM74 202h20M100 196l5 6-5 6M114 202l6 -6 0 12zM132 202h18M156 196v12M166 202l6 -6 0 12zM184 202h18"/>
