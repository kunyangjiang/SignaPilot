  <text x="104" y="126" text-anchor="end" class="sm" style="font-size:12px">经院哲学……</text>
  <path class="gl" d="M266 192h18M266 214h18M284 192V214"/>
  <text x="292" y="207" class="gt" style="font-size:13px">119 条讲卡巴拉</text>
