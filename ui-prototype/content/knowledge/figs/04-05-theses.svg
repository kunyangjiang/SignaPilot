  <g class="l thin">
    <path d="M122 48H248M122 56H240M122 64H246M122 72H236M122 80H248M122 88H242M122 96H230M122 104H248M122 112H244M122 120H238M122 128H248M122 136H232M122 144H246M122 152H240M122 160H248M122 168H236M122 176H244"/>
  </g>
