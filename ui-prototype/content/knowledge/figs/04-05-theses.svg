<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 300" role="img" aria-label="1486 年的 900 条论题示意图，本课自绘。一张长长的印刷单页，上面密密的小横线代表一条条论题，大部分是灰色，靠下有一段标金色，写 119 条讲卡巴拉；最下面一小段更深，写最后 72 条要用卡巴拉证明三位一体和基督。右边一个封印，写 1487 年整本被谴责">
