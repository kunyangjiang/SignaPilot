<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 308" role="img" aria-label="“Sak Yant”一词的构成的示意图，本课自绘。左边：泰文 สักยันต์ 读作 sak yan。它由两个词组成：สัก（sak），意思是“刺、纹”；ยันต์（yan），是梵文 yantra 在泰语里的形式，指写有文字或图案的护佑符。右边：在印度，yantra 常指仪式中的几何图形（见 06-03）；在泰国，据泰国基金会的文章，yan 上的字多是用高棉文字改成的“Khom 文”写的巴利语或梵语的短句，佛教的真言、咒语和符号，补充甚至取代了原来的几何图形。底部：同一个词，在两处指的不是同一类东西；泰国的 yan 不等于 Śrī Yantra">
  <text x="110" y="70" text-anchor="middle" lang="th" class="gt" style="font-size:30px;font-family:&quot;Noto Sans Thai&quot;,&quot;Leelawadee UI&quot;,Tahoma,&quot;Thonburi&quot;,sans-serif">สักยันต์</text>
  <text x="110" y="92" text-anchor="middle" class="sm" style="font-size:11px">sak yan</text>
  <text x="60" y="150" text-anchor="middle" lang="th" style="font-size:22px;font-family:&quot;Noto Sans Thai&quot;,&quot;Leelawadee UI&quot;,Tahoma,&quot;Thonburi&quot;,sans-serif">สัก</text>
  <text x="60" y="170" text-anchor="middle" class="sm" style="font-size:10.5px">sak：刺、纹</text>
  <text x="160" y="150" text-anchor="middle" lang="th" style="font-size:22px;font-family:&quot;Noto Sans Thai&quot;,&quot;Leelawadee UI&quot;,Tahoma,&quot;Thonburi&quot;,sans-serif">ยันต์</text>
  <text x="160" y="170" text-anchor="middle" class="sm" style="font-size:10.5px">yan：梵文 yantra</text>
  <path class="l thin" d="M110 100V126"/><path class="l thin" d="M110 126H60V132M110 126H160V132"/>
  <path class="l thin" d="M235 36V230" stroke-dasharray="2 4"/>
  <text x="355" y="36" text-anchor="middle" class="gt" style="font-size:12px">同一个词，两处的所指</text>
  <text x="300" y="74" text-anchor="start" class="gt" style="font-size:11.5px">印度：yantra</text>
  <text x="300" y="92" text-anchor="start" style="font-size:10.5px">仪式中的几何图形</text>
  <text x="300" y="108" text-anchor="start" class="sm" style="font-size:10.5px">（见 06-03）</text>
  <text x="300" y="146" text-anchor="start" class="gt" style="font-size:11.5px">泰国：ยันต์ yan</text>
  <text x="300" y="164" text-anchor="start" style="font-size:10.5px">多用 Khom 文写的</text>
  <text x="300" y="180" text-anchor="start" style="font-size:10.5px">巴利语、梵语短句</text>
  <text x="300" y="196" text-anchor="start" style="font-size:10.5px">佛教真言与符号补充，</text>
  <text x="300" y="212" text-anchor="start" style="font-size:10.5px">有时取代了几何</text>
  <text x="245" y="262" text-anchor="middle" class="gt" style="font-size:12.5px">泰国的 yan，不等于 Śrī Yantra</text>
  <text x="245" y="280" text-anchor="middle" class="sm" style="font-size:10.5px">“Khom 文”：据泰国基金会 2023 年文章，由古高棉文字改造；本课没有读到学术论证</text>
  <text x="245" y="296" text-anchor="middle" class="sm" style="font-size:10.5px">词源与所指为一般说明；各地各派用法不一</text>
</svg>
