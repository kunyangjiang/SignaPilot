<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 318" role="img" aria-label="第六阶段七课各自在“组织意义”的什么地方的回顾图，本课自绘。七行，每行一课：06-01 字母，数值与解释；06-02 数字方阵、地占的图形与写成的物件；06-03 几何图形与仪式空间；06-04 声音，身体与师承；06-05 刻在身体上的文字与图；06-06 可携带的物件与它的流通；06-07 官署，历与专门家族。右边一列标出每课的证据主要是什么：文本，目录与论文，论文与梵文诗，UNESCO 记录与学界争论，新闻与个案研究，警方指控、访谈与市场研究，日记、史书与官署记录。底部：每个传统用的材料、人群和争论都不同，不是同一种东西的七个版本">
  <text x="30" y="22" text-anchor="start" class="gt" style="font-size:11px">课</text>
  <text x="80" y="22" text-anchor="start" class="gt" style="font-size:11px">意义放在哪里</text>
  <text x="290" y="22" text-anchor="start" class="gt" style="font-size:11px">本课用的材料</text>
  <path class="l thin" d="M20 32H470V60H20Z"/>
  <text x="30" y="51" text-anchor="start" class="gt" style="font-size:11px">06-01</text>
  <text x="80" y="51" text-anchor="start" style="font-size:11.5px">字母 · 数值 · 解释</text>
  <text x="290" y="51" text-anchor="start" class="sm" style="font-size:10.5px">阿拉伯文注释与论文</text>
  <path class="l thin" d="M20 66H470V94H20Z"/>
  <text x="30" y="85" text-anchor="start" class="gt" style="font-size:11px">06-02</text>
  <text x="80" y="85" text-anchor="start" style="font-size:11.5px">方阵 · 图形 · 物件</text>
  <text x="290" y="85" text-anchor="start" class="sm" style="font-size:10.5px">目录、论文与注释</text>
  <path class="l thin" d="M20 100H470V128H20Z"/>
  <text x="30" y="119" text-anchor="start" class="gt" style="font-size:11px">06-03</text>
  <text x="80" y="119" text-anchor="start" style="font-size:11.5px">几何 · 仪式空间</text>
  <text x="290" y="119" text-anchor="start" class="sm" style="font-size:10.5px">梵文诗与数学论文</text>
  <path class="l thin" d="M20 134H470V162H20Z"/>
  <text x="30" y="153" text-anchor="start" class="gt" style="font-size:11px">06-04</text>
  <text x="80" y="153" text-anchor="start" style="font-size:11.5px">声音 · 身体 · 师承</text>
  <text x="290" y="153" text-anchor="start" class="sm" style="font-size:10.5px">UNESCO 记录与学界争论</text>
  <path class="l thin" d="M20 168H470V196H20Z"/>
  <text x="30" y="187" text-anchor="start" class="gt" style="font-size:11px">06-05</text>
  <text x="80" y="187" text-anchor="start" style="font-size:11.5px">身上的文字与图</text>
  <text x="290" y="187" text-anchor="start" class="sm" style="font-size:10.5px">新闻与个案研究</text>
  <path class="l thin" d="M20 202H470V230H20Z"/>
  <text x="30" y="221" text-anchor="start" class="gt" style="font-size:11px">06-06</text>
  <text x="80" y="221" text-anchor="start" style="font-size:11.5px">物件 · 流通 · 市场</text>
  <text x="290" y="221" text-anchor="start" class="sm" style="font-size:10.5px">警方指控、访谈与市场研究</text>
  <path class="l thin" d="M20 236H470V264H20Z"/>
  <text x="30" y="255" text-anchor="start" class="gt" style="font-size:11px">06-07</text>
  <text x="80" y="255" text-anchor="start" style="font-size:11.5px">官署 · 历 · 家族</text>
  <text x="290" y="255" text-anchor="start" class="sm" style="font-size:10.5px">日记、史书与官署记录</text>
  <text x="245" y="288" text-anchor="middle" class="gt" style="font-size:12.5px">每个传统有自己的材料、人群和争论</text>
  <text x="245" y="306" text-anchor="middle" class="sm" style="font-size:11px">不是同一种东西的七个版本</text>
</svg>
