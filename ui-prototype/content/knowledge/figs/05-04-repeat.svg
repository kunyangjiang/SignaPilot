<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 304" role="img" aria-label="同一个干支日反复出现的示意图，本课自绘。一条很长的横线代表一天接一天的日子，每隔六十天有一个金色刻度，都标甲子。中间一条引线写：记录只说甲子，没说是哪一个甲子。下面另画一条短线，标锚点：要先知道某个甲子对应公历哪一天，再知道这件事落在哪一年、哪一月，才能往前或往后数。底部：干支是循环的名字，不是绝对日期">
  <path class="l" d="M20 90H470" style="stroke-width:1.6"/>
  <path class="gl" d="M40 78V102" style="stroke-width:2"/>
  <text x="40" y="70" text-anchor="middle" class="gt" style="font-size:11px">甲子</text>
  <text x="70" y="118" text-anchor="middle" class="sm" style="font-size:10px">60 天</text>
  <path class="gl" d="M100 78V102" style="stroke-width:2"/>
  <text x="100" y="70" text-anchor="middle" class="gt" style="font-size:11px">甲子</text>
  <text x="130" y="118" text-anchor="middle" class="sm" style="font-size:10px">60 天</text>
  <path class="gl" d="M160 78V102" style="stroke-width:2"/>
  <text x="160" y="70" text-anchor="middle" class="gt" style="font-size:11px">甲子</text>
  <text x="190" y="118" text-anchor="middle" class="sm" style="font-size:10px">60 天</text>
  <path class="gl" d="M220 78V102" style="stroke-width:2"/>
  <text x="220" y="70" text-anchor="middle" class="gt" style="font-size:11px">甲子</text>
  <text x="250" y="118" text-anchor="middle" class="sm" style="font-size:10px">60 天</text>
  <path class="gl" d="M280 78V102" style="stroke-width:2"/>
  <text x="280" y="70" text-anchor="middle" class="gt" style="font-size:11px">甲子</text>
  <text x="310" y="118" text-anchor="middle" class="sm" style="font-size:10px">60 天</text>
  <path class="gl" d="M340 78V102" style="stroke-width:2"/>
  <text x="340" y="70" text-anchor="middle" class="gt" style="font-size:11px">甲子</text>
  <text x="370" y="118" text-anchor="middle" class="sm" style="font-size:10px">60 天</text>
  <path class="gl" d="M400 78V102" style="stroke-width:2"/>
  <text x="400" y="70" text-anchor="middle" class="gt" style="font-size:11px">甲子</text>
  <text x="430" y="118" text-anchor="middle" class="sm" style="font-size:10px">60 天</text>
  <path class="gl" d="M460 78V102" style="stroke-width:2"/>
  <text x="460" y="70" text-anchor="middle" class="gt" style="font-size:11px">甲子</text>
  <path class="l thin" d="M220 104Q220 140 245 150"/>
  <text x="245" y="166" text-anchor="middle" style="font-size:12px">记录只说“甲子”，没说是哪一个甲子</text>
  <path class="l thin" d="M40 210H450" stroke-dasharray="3 4"/>
  <circle class="dotk" cx="150" cy="210" r="5"/>
  <text x="150" y="236" text-anchor="middle" class="gt" style="font-size:11.5px">锚点：某个甲子 ＝ 公历某一天</text>
  <text x="150" y="254" text-anchor="middle" class="sm" style="font-size:10.5px">靠天象、历谱、别的纪年来定</text>
  <text x="360" y="236" text-anchor="middle" style="font-size:11.5px">还要知道事情在哪一年、哪一月</text>
  <text x="360" y="254" text-anchor="middle" class="sm" style="font-size:10.5px">才能往前或往后数到它</text>
  <text x="245" y="292" text-anchor="middle" class="gt" style="font-size:12.5px">干支是循环的名字，不是绝对日期</text>
</svg>
