<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 302" role="img" aria-label="把干支材料分成四层的示意图，本课自绘。从上到下四个横条。第一条，记录里的干支：例如利簋“甲子”，这是原始记录本身。第二条，换算成公历：例如前 1046 年 1 月 20 日，这是后人的推算，会随证据改变。第三条，历法计算：例如《史记·历书》“日得甲子，夜半朔旦冬至”，这是当时的人自己做的推步。第四条，后来的配属：例如地支配动物、配方位、配时辰、用来择日，这是在循环上叠加的意义。右边一个竖箭头，标越往下离原始记录越远。底部：四层要分开说">
  <defs><marker id="ar5402" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" class="l" fill="none"/></marker></defs>
  <path class="wash" d="M20 20H430V70H20Z"/>
  <path class="gl thin" d="M20 20H430V70H20Z"/>
  <text x="32" y="41" text-anchor="start" class="gt" style="font-size:12.5px">记录里的干支</text>
  <text x="32" y="60" text-anchor="start" class="sm" style="font-size:11px">利簋“唯甲子朝”</text>
  <text x="420" y="41" text-anchor="end" class="sm" style="font-size:11px">原始记录本身</text>
  <path class="l thin" d="M20 82H430V132H20Z"/>
  <text x="32" y="103" text-anchor="start" style="font-size:12.5px">换算成公历</text>
  <text x="32" y="122" text-anchor="start" class="sm" style="font-size:11px">如：前 1046 年 1 月 20 日（一种推定）</text>
  <text x="420" y="103" text-anchor="end" class="sm" style="font-size:11px">后人的推算，会随证据改变</text>
  <path class="l thin" d="M20 144H430V194H20Z"/>
  <text x="32" y="165" text-anchor="start" style="font-size:12.5px">当时的历法计算</text>
  <text x="32" y="184" text-anchor="start" class="sm" style="font-size:11px">《史记·历书》“日得甲子，夜半朔旦冬至”</text>
  <text x="420" y="165" text-anchor="end" class="sm" style="font-size:11px">当时的人自己算的</text>
  <path class="l thin" d="M20 206H430V256H20Z"/>
  <text x="32" y="227" text-anchor="start" style="font-size:12.5px">后来的配属</text>
  <text x="32" y="246" text-anchor="start" class="sm" style="font-size:11px">地支配动物、方位、时辰，用来择日</text>
  <text x="420" y="227" text-anchor="end" class="sm" style="font-size:11px">在循环上叠加的意义</text>
  <path class="l thin" d="M456 30V250" marker-end="url(#ar5402)"/>
  <text x="470" y="140" text-anchor="middle" class="sm" style="font-size:11px">离</text>
  <text x="470" y="156" text-anchor="middle" class="sm" style="font-size:11px">记</text>
  <text x="470" y="172" text-anchor="middle" class="sm" style="font-size:11px">录</text>
  <text x="470" y="188" text-anchor="middle" class="sm" style="font-size:11px">越</text>
  <text x="470" y="204" text-anchor="middle" class="sm" style="font-size:11px">远</text>
  <text x="245" y="290" text-anchor="middle" class="gt" style="font-size:12px">四层要分开说：同一个“甲子”，在每一层里的分量不一样</text>
</svg>
