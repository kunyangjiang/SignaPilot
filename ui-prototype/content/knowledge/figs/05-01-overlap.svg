<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 340" role="img" aria-label="三个圈的示意图，本课自绘。三个部分重叠的圆圈：左上标术数，旁注一类书，推算吉凶；右上标方术，旁注一类人，各种特殊本事；下方标道教，旁注一个宗教，经典、神谱、仪式。两两重叠处写例子：术数和方术之间写占候、卜筮；方术和道教之间写求仙；术数和道教之间写择日、阴阳五行。正中三圈重叠处留空。底部：这是本课为教学画的简化示意，不是任何古代目录的分法；三个圈在不同时代的大小和位置都会变">
  <g filter="url(#wob2)">
    <circle class="l" cx="190" cy="130" r="92"/><circle class="l" cx="300" cy="130" r="92"/><circle class="gl" cx="245" cy="210" r="92"/>
  </g>
  <g style="font-size:14px" text-anchor="middle"><text x="150" y="104">术数</text><text x="340" y="104">方术</text><text x="245" y="252" class="gt">道教</text></g>
  <g class="sm" style="font-size:11px" text-anchor="middle">
    <text x="146" y="122">一类书</text><text x="146" y="136">推算吉凶</text>
    <text x="344" y="122">一类人</text><text x="344" y="136">各种本事</text>
    <text x="245" y="268">一个宗教</text><text x="245" y="282">经典、神谱、仪式</text>
  </g>
  <g style="font-size:11.5px" text-anchor="middle">
    <text x="245" y="86">占候</text><text x="245" y="102">卜筮</text>
    <text x="300" y="206">求仙</text>
    <text x="190" y="200">择日</text><text x="190" y="216">阴阳五行</text>
  </g>
  <text x="245" y="326" text-anchor="middle" class="sm" style="font-size:11px">本课为教学画的简化示意，不是任何古代目录的分法；各代的圈大小、位置都不同</text>
</svg>
