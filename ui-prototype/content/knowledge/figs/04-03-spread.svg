<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 360" role="img" aria-label="《逃跑的阿塔兰塔》一组寓意的版面示意图，本课自绘。一本摊开的书：左页是三行乐谱，分别标着希波墨涅斯在追、阿塔兰塔在逃、金苹果在拖延；右页上方一行格言，中间一幅画，下方一首短诗。书的右边还有几页叠在一起，标着拉丁文论述。五个部分分别编号：1 格言，2 画，3 短诗，4 三声部赋格，5 论述。底部：每一组寓意，都是一个音乐、图像和文字的小包裹">
