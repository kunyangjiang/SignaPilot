<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" role="img" aria-label="第 21 组格言的步骤示意图，本课自绘。从左到右四个图形，箭头相连：一个小圆，里面一男一女；一个正方形；一个三角形；一个大圆。每个图形下面写着迈尔在论述里给它的解释：小圆是男人和女人，正方形是四元素，三角形是身体、精神、灵魂，大圆是不变的红色，也就是完成的哲人石。下方：画上的图形是这四步一层套一层画出来的，最里面是起点，最外面是终点">
