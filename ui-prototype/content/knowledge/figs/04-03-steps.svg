  <g text-anchor="middle" style="font-size:13px">
    <text x="62" y="146">圆</text><text x="182" y="146">四方</text><text x="302" y="146">三角</text><text x="428" y="146">圆</text>
  </g>
  <g text-anchor="middle" class="sm" style="font-size:11.5px">
    <text x="62" y="166">男人和女人</text><text x="182" y="166">四元素</text><text x="302" y="166">身体、精神、</text><text x="302" y="182">灵魂</text><text x="428" y="166">不变的红色</text><text x="428" y="182">（哲人石）</text>
  </g>
