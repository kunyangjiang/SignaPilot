<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 328" role="img" aria-label="具注历用作日记的示意图，本课自绘，不是任何一页的复制。一页历的版面：左边一窄列是日期和干支；中间每天一行，是用汉字密密写好的历注，也就是当日的节气、吉凶宜忌；每行之间留有空白，贵族在空白里用另一种笔迹写自己的日记。右边引出两个标签：印的或抄的，是阴阳寮制定的历，写的是历注；手写的，是使用者自己的日记。底部：同一张纸上，叠着官署的计算与个人的记录；平安贵族的日记，因此成了今天研究那个时代的重要史料">
  <path class="l" d="M30 40H330V250H30Z" filter="url(#wob2)"/>
  <path class="l thin" d="M80 40V250"/>
