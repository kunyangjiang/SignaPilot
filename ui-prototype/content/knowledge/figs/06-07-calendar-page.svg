  <path class="l thin" d="M340 78H395" marker-end="url(#ar6701)"/>
  <defs><marker id="ar6701" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" class="l" fill="none"/></marker></defs>
  <text x="400" y="74" text-anchor="start" class="gt" style="font-size:11px">历注（金线虚线）</text>
  <text x="400" y="90" text-anchor="start" class="sm" style="font-size:10px">阴阳寮制定的历：</text>
  <text x="400" y="104" text-anchor="start" class="sm" style="font-size:10px">节气、吉凶宜忌</text>
  <path class="l thin" d="M340 152H395" marker-end="url(#ar6701)"/>
  <text x="400" y="148" text-anchor="start" style="font-size:11px">余白（细实线）</text>
  <text x="400" y="164" text-anchor="start" class="sm" style="font-size:10px">使用者手写的日记</text>
  <text x="245" y="282" text-anchor="middle" class="gt" style="font-size:12.5px">同一张纸上，叠着官署的计算与个人的记录</text>
  <text x="245" y="300" text-anchor="middle" class="sm" style="font-size:10.5px">平安贵族常在历的空白处写日记，今天因此成了研究那个时代的重要史料</text>
  <text x="245" y="316" text-anchor="middle" class="sm" style="font-size:10.5px">据日本国立国会图书馆“日本的历”展示说明；示意图不是某一页的复制</text>
</svg>
