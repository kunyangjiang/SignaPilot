<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 342" role="img" aria-label="《美的波浪》（Saundaryalaharī）第 11 节用数字描述一个图形的示意图，本课自绘，译文为本课自译。一张对照表：左边是梵文词，中间是它说的数目，右边是对应图形里的哪一层。caturbhiḥ śrīkaṇṭhaiḥ，四个湿婆的，也就是四个朝上的三角形；pañcabhiḥ śivayuvatibhiḥ，五个湿婆的女伴的，也就是五个朝下的三角形；navabhiḥ mūlaprakṛtibhiḥ，九个根本自性，合起来是九个三角形；vasudala，八瓣，对应八瓣莲花；kalāśra，常被理解为十六瓣，对应十六瓣莲花；trivalaya，三重圆环，对应三个圆；trirekhā，三条线，对应三重方城；catuścatvāriṃśat，四十四，是整句里数出的总数。底部：同一句诗，用数字把图形“说”了出来；各词的对应是常见的理解，不同注释有不同说法">
  <text x="30" y="24" text-anchor="start" class="gt" style="font-size:11px">诗里的词</text>
  <text x="230" y="24" text-anchor="start" class="gt" style="font-size:11px">数目</text>
  <text x="300" y="24" text-anchor="start" class="gt" style="font-size:11px">常见的理解：对应图形的哪一层</text>
  <path class="l thin" d="M20 36H470V62H20Z"/>
  <text x="30" y="54" text-anchor="start" style="font-size:11.5px">caturbhiḥ śrīkaṇṭhaiḥ</text>
  <text x="230" y="54" text-anchor="start" class="gt" style="font-size:12px">4</text>
  <text x="300" y="54" text-anchor="start" style="font-size:11px">朝上的三角形（属湿婆）</text>
  <path class="l thin" d="M20 66H470V92H20Z"/>
  <text x="30" y="84" text-anchor="start" style="font-size:11.5px">pañcabhiḥ śivayuvatibhiḥ</text>
  <text x="230" y="84" text-anchor="start" class="gt" style="font-size:12px">5</text>
  <text x="300" y="84" text-anchor="start" style="font-size:11px">朝下的三角形（属女神）</text>
  <path class="l thin" d="M20 96H470V122H20Z"/>
  <text x="30" y="114" text-anchor="start" style="font-size:11.5px">navabhiḥ mūlaprakṛtibhiḥ</text>
  <text x="230" y="114" text-anchor="start" class="gt" style="font-size:12px">4 ＋ 5 ＝ 9</text>
  <text x="300" y="114" text-anchor="start" style="font-size:11px">九个三角形合起来</text>
  <path class="l thin" d="M20 126H470V152H20Z"/>
  <text x="30" y="144" text-anchor="start" style="font-size:11.5px">vasu-dala</text>
  <text x="230" y="144" text-anchor="start" class="gt" style="font-size:12px">8</text>
  <text x="300" y="144" text-anchor="start" style="font-size:11px">八瓣莲花</text>
  <path class="l thin" d="M20 156H470V182H20Z"/>
  <text x="30" y="174" text-anchor="start" style="font-size:11.5px">kalāśra</text>
  <text x="230" y="174" text-anchor="start" class="gt" style="font-size:12px">16</text>
  <text x="300" y="174" text-anchor="start" style="font-size:11px">十六瓣莲花（kalā 常指十六）</text>
  <path class="l thin" d="M20 186H470V212H20Z"/>
  <text x="30" y="204" text-anchor="start" style="font-size:11.5px">tri-valaya</text>
  <text x="230" y="204" text-anchor="start" class="gt" style="font-size:12px">3</text>
  <text x="300" y="204" text-anchor="start" style="font-size:11px">三重圆环</text>
  <path class="l thin" d="M20 216H470V242H20Z"/>
  <text x="30" y="234" text-anchor="start" style="font-size:11.5px">tri-rekhā</text>
  <text x="230" y="234" text-anchor="start" class="gt" style="font-size:12px">3</text>
  <text x="300" y="234" text-anchor="start" style="font-size:11px">三条线（三重方城）</text>
  <path class="l thin" d="M20 246H470V272H20Z"/>
  <text x="30" y="264" text-anchor="start" style="font-size:11.5px">catuś-catvāriṃśat</text>
  <text x="230" y="264" text-anchor="start" class="gt" style="font-size:12px">44</text>
  <text x="300" y="264" text-anchor="start" style="font-size:11px">整句数出的总数（见正文）</text>
  <text x="245" y="296" text-anchor="middle" class="gt" style="font-size:12.5px">一句诗，用数字把一个图形“说”了出来</text>
  <text x="245" y="314" text-anchor="middle" class="sm" style="font-size:10.5px">梵文据维基文库（梵文）所录；各词的对应是常见理解，不同注释说法不一；译文为本课自译</text>
  <text x="245" y="330" text-anchor="middle" class="sm" style="font-size:10.5px">“44”与另一份转写的“43”、常见的“43 个三角形”，见正文</text>
</svg>
