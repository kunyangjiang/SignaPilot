<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 246" role="img" aria-label="混沌魔法形成过程中几个有记录的节点的时间线，本课自绘，据 Carroll 1987 年版的书、维基百科条目和学术文章的摘要，二手归纳。一条横轴，七个点：1913 年，Austin Osman Spare 自费出版《快乐之书》；1956 年，Spare 去世；1970 年代中期，对 Spare 的兴趣回升；1978 年，Peter Carroll 的《Liber Null》和 Ray Sherwin 的《结果之书》出现，同年前后出现首个混沌魔法团体 Illuminates of Thanateros；1981 年，Carroll 与 Sherwin 做了修订，“混沌”成了关键概念；1987 年，Weiser 出版社把两部书合为一册出版；2025 年，学术期刊 Aries 发表对 1978 与 1981 年两个早期版本的研究。底部：这是一个很年轻的传统；它的理论，是在几年之内成形的，不是从古代传下来的">
  <path class="l" d="M15 110H475"/>
  <circle class="dotk" cx="45" cy="110" r="4"/>
  <text x="45" y="92" text-anchor="middle" class="gt" style="font-size:11.5px">1913</text>
  <text x="45" y="76" text-anchor="middle" style="font-size:10px">Spare 自费出书</text>
  <circle class="dotk" cx="110" cy="110" r="4"/>
  <text x="110" y="134" text-anchor="middle" class="gt" style="font-size:11.5px">1956</text>
  <text x="110" y="150" text-anchor="middle" style="font-size:10px">Spare 去世</text>
  <circle class="dotk" cx="175" cy="110" r="4"/>
  <text x="175" y="92" text-anchor="middle" class="gt" style="font-size:11.5px">1970s中</text>
  <text x="175" y="76" text-anchor="middle" style="font-size:10px">兴趣回升</text>
  <circle class="dotk" cx="240" cy="110" r="4"/>
  <text x="240" y="134" text-anchor="middle" class="gt" style="font-size:11.5px">1978</text>
  <text x="240" y="150" text-anchor="middle" style="font-size:10px">Carroll · Sherwin</text>
  <circle class="dotk" cx="305" cy="110" r="4"/>
  <text x="305" y="92" text-anchor="middle" class="gt" style="font-size:11.5px">1981</text>
  <text x="305" y="76" text-anchor="middle" style="font-size:10px">修订，“混沌”成形</text>
  <circle class="dotk" cx="370" cy="110" r="4"/>
  <text x="370" y="134" text-anchor="middle" class="gt" style="font-size:11.5px">1987</text>
  <text x="370" y="150" text-anchor="middle" style="font-size:10px">Weiser 合订本</text>
  <circle class="dotk" cx="440" cy="110" r="4"/>
  <text x="440" y="92" text-anchor="middle" class="gt" style="font-size:11.5px">2025</text>
  <text x="440" y="76" text-anchor="middle" style="font-size:10px">Aries 的研究</text>
  <text x="245" y="196" text-anchor="middle" class="gt" style="font-size:12px">这是一个很年轻的传统；1978 年版里“混沌”几乎没出现，1981 年已成关键概念</text>
  <text x="245" y="214" text-anchor="middle" class="sm" style="font-size:11px">Spare 与 1978 年之间，没读到直接往来的记载；承接关系是 Carroll 的自述</text>
  <text x="245" y="232" text-anchor="middle" class="sm" style="font-size:10.5px">据 Carroll（1987 年版）、Duggan（2012）、Aries 2025 年文章的摘要；日期以原始资料为准</text>
</svg>
