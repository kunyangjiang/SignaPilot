<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 470" role="img" aria-label="五个容易混用的词，各问一个不同的问题。本课整理的对照示意，不是定义表。秘传：问知识怎样传、传给谁，例子是亚里士多德早晨那门要经过考察才能进的课。秘传主义，历史派的用法：问哪一组思潮有共同的谱系，例子是波墨的基督教神智学。神秘学：问的是 19 世纪以后的一批运动，哈内赫拉夫称之为世俗化了的秘传主义，例子是 19 世纪末的金色黎明会。神秘主义：问的是对神或终极实在的直接体验，在基督教、伊斯兰教、犹太教里都有正统的传统。魔法与宗教，弗雷泽的用法：问行动者把结果设想成照规矩必然到来，还是取决于更高力量的意愿，例子是法国农民请的圣灵弥撒。底部：同一样东西可以同时落在好几行，金色黎明会有入会和等级，自称魔法，谱系上属于近代神秘学">
  <g class="sm" style="font-size:11px">
    <text x="16" y="22">词</text><text x="130" y="22">它在问什么</text><text x="352" y="22">例子</text>
  </g>
  <g class="l" filter="url(#wob2)">
    <rect x="12" y="32" width="466" height="62" rx="6"/>
    <rect x="12" y="102" width="466" height="62" rx="6"/>
    <rect x="12" y="172" width="466" height="62" rx="6"/>
    <rect x="12" y="242" width="466" height="62" rx="6"/>
    <rect x="12" y="312" width="466" height="62" rx="6"/>
  </g>
  <g class="l thin"><path d="M120 38V88M342 38V88M120 108V158M342 108V158M120 178V228M342 178V228M120 248V298M342 248V298M120 318V368M342 318V368"/></g>
  <g style="font-size:14px">
    <text x="22" y="60">秘传</text>
    <text x="22" y="130">秘传主义</text>
    <text x="22" y="200">神秘学</text>
    <text x="22" y="270">神秘主义</text>
    <text x="22" y="340">魔法 / 宗教</text>
  </g>
  <g class="sm" style="font-size:10.5px">
    <text x="22" y="80">esoteric</text>
    <text x="22" y="150">历史派的用法</text>
    <text x="22" y="220">occultism</text>
    <text x="22" y="290">mysticism</text>
    <text x="22" y="360">弗雷泽的用法</text>
  </g>
  <g style="font-size:12px">
    <text x="130" y="58">知识怎样传、传给谁？</text>
    <text x="130" y="78" class="sm">限制传授，不等于内容超自然</text>
    <text x="130" y="128">哪一组思潮有共同谱系？</text>
    <text x="130" y="148" class="sm">文艺复兴以来的欧洲材料</text>
    <text x="130" y="198">19 世纪以后的一批运动</text>
    <text x="130" y="218" class="sm">“世俗化了的秘传主义”</text>
    <text x="130" y="268">对神或终极实在的直接体验</text>
    <text x="130" y="288" class="sm">三大一神教里都有正统传统</text>
    <text x="130" y="338">结果是照规矩必然到来，</text>
    <text x="130" y="356">还是取决于对方的意愿？</text>
  </g>
  <g class="gt" style="font-size:11.5px">
    <text x="352" y="58">吕克昂的早课</text>
    <text x="352" y="76">要经考察才能进</text>
    <text x="352" y="128">波墨的</text>
    <text x="352" y="146">基督教神智学</text>
    <text x="352" y="198">19 世纪末的</text>
    <text x="352" y="216">金色黎明会</text>
    <text x="352" y="268">不天然属于</text>
    <text x="352" y="286">被排斥的一方</text>
    <text x="352" y="338">农民请的</text>
    <text x="352" y="356">“圣灵弥撒”</text>
  </g>
  <path class="l thin" d="M12 394H478"/>
  <text x="245" y="418" text-anchor="middle" style="font-size:12px">同一样东西可以同时落在好几行</text>
  <text x="245" y="440" text-anchor="middle" class="sm" style="font-size:11px">金色黎明会：有入会和等级，自称魔法，谱系上属于近代神秘学</text>
  <text x="478" y="462" text-anchor="end" class="sm" style="font-size:10px">本课整理的对照示意，不是定义表</text>
</svg>
