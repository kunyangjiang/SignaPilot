<text x="347" y="167" text-anchor="middle" class="sm" style="font-size:10px">6</text>
<rect x="274" y="122" width="34" height="52" rx="3" class="l" />
<text x="291" y="150" text-anchor="middle" lang="he" style="font-size:22px">ק</text>
<text x="291" y="167" text-anchor="middle" class="sm" style="font-size:10px">100</text>
<rect x="236" y="122" width="34" height="52" rx="3" class="l" />
<text x="253" y="150" text-anchor="middle" lang="he" style="font-size:22px">ס</text>
<text x="253" y="167" text-anchor="middle" class="sm" style="font-size:10px">60</text>
<rect x="198" y="122" width="34" height="52" rx="3" class="l" />
