<text x="40" y="170" text-anchor="start" class="sm" style="font-size:10px">尼禄·凯撒（Nero）</text>
<path d="M170 80v34" class="gl" marker-end="url(#arg)"/>
<text x="210" y="102" text-anchor="start" class="sm" style="font-size:10.5px">去掉末尾那个字母（50）</text>
<text x="245" y="230" text-anchor="middle" class="sm" style="font-size:11px">拼写不同，数不同；两个数，都能对到同一个名字</text>
