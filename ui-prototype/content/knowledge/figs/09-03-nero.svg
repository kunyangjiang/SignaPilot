<text x="177" y="69" text-anchor="middle" class="sm" style="font-size:10px">200</text>
<text x="40" y="54" text-anchor="start" class="gt" style="font-size:15px">合计 666</text>
<text x="40" y="72" text-anchor="start" class="sm" style="font-size:10px">尼禄·凯撒（Nerōn）</text>
<rect x="406" y="122" width="34" height="52" rx="3" class="l" />
<text x="423" y="150" text-anchor="middle" lang="he" style="font-size:22px">נ</text>
<text x="423" y="167" text-anchor="middle" class="sm" style="font-size:10px">50</text>
<rect x="368" y="122" width="34" height="52" rx="3" class="l" />
<text x="385" y="150" text-anchor="middle" lang="he" style="font-size:22px">ר</text>
<text x="385" y="167" text-anchor="middle" class="sm" style="font-size:10px">200</text>
