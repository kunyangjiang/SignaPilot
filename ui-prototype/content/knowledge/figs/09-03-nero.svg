<text x="347" y="52" text-anchor="middle" lang="he" style="font-size:22px">ו</text>
<text x="347" y="69" text-anchor="middle" class="sm" style="font-size:10px">6</text>
<rect x="292" y="24" width="34" height="52" rx="3" class="l" />
<text x="309" y="52" text-anchor="middle" lang="he" style="font-size:22px">ן</text>
<text x="309" y="69" text-anchor="middle" class="sm" style="font-size:10px">50</text>
<rect x="236" y="24" width="34" height="52" rx="3" class="l" />
<text x="253" y="52" text-anchor="middle" lang="he" style="font-size:22px">ק</text>
<text x="253" y="69" text-anchor="middle" class="sm" style="font-size:10px">100</text>
<rect x="198" y="24" width="34" height="52" rx="3" class="l" />
<text x="215" y="52" text-anchor="middle" lang="he" style="font-size:22px">ס</text>
