<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" role="img" aria-label="同一个名字的两种希伯来文拼写：נרון קסר（尼禄凯撒）各字母数值之和为 666；去掉末尾的 ן（50）得 נרו קסר，之和为 616。">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gold)"/></marker></defs>
<rect x="406" y="24" width="34" height="52" rx="3" class="l" />
<text x="423" y="52" text-anchor="middle" lang="he" style="font-size:22px">נ</text>
<text x="423" y="69" text-anchor="middle" class="sm" style="font-size:10px">50</text>
<rect x="368" y="24" width="34" height="52" rx="3" class="l" />
<text x="385" y="52" text-anchor="middle" lang="he" style="font-size:22px">ר</text>
<text x="385" y="69" text-anchor="middle" class="sm" style="font-size:10px">200</text>
