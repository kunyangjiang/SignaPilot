<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 420" role="img" aria-label="洛特曼的符号域示意。一个不规则的大区域，里面有三个大小不一的核心，最大的一个带着一层自我描述的硬壳；核心周围是越往外越松散的边缘地带。最外面一圈不是实线，而是一层带孔的膜，代表边界：外来的东西经过它时被过滤、翻译成内部的某种语言，箭头穿过膜以后变成了另一种线。膜上站着同时属于两边的人。图下注：边界画成线只是为了看得见，洛特曼说它是抽象的">
  <path class="wash" d="M70 200C60 110 150 52 250 58C360 62 430 120 424 210C418 300 340 352 240 348C130 344 80 292 70 200Z"/>
  <path class="gl" filter="url(#wob2)" stroke-dasharray="10 7" stroke-width="3" d="M70 200C60 110 150 52 250 58C360 62 430 120 424 210C418 300 340 352 240 348C130 344 80 292 70 200Z"/>
  <g class="l" filter="url(#wob2)">
    <ellipse cx="190" cy="170" rx="46" ry="36"/>
    <ellipse cx="300" cy="150" rx="30" ry="24"/>
    <ellipse cx="270" cy="260" rx="36" ry="28"/>
  </g>
  <g class="l thin">
    <ellipse cx="190" cy="170" rx="38" ry="28"/>
    <path d="M6 120C30 124 50 132 64 146"/>
    <path d="M56 140l10 8-12 0"/>
    <path d="M86 168c18 8 30 4 46 10"/>
    <path d="M128 172l6 7-9 2"/>
  </g>
  <g text-anchor="middle">
    <text font-size="16" x="190" y="168">核心</text>
    <text class="sm" style="font-size:13px" x="190" y="186">自我描述</text>
    <text font-size="16" x="300" y="156">核心</text>
    <text font-size="16" x="270" y="266">核心</text>
    <text class="sm" style="font-size:14px" x="360" y="226">松散的边缘</text>
    <text class="sm" style="font-size:14px" x="150" y="300">松散的边缘</text>
  </g>
  <g class="sm" style="font-size:14px" text-anchor="start">
    <text x="6" y="104">外来的文本</text>
    <text x="330" y="44">边界：过滤、翻译的膜</text>
    <text x="352" y="354">边界上的人：</text>
    <text x="352" y="376">同时属于两边</text>
  </g>
  <circle class="gl" cx="404" cy="292" r="7"/>
  <path class="l thin" d="M404 300l-8 46"/>
