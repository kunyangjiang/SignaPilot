<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 246" role="img" aria-label="灵媒主义早期几件有记录的事的时间线，本课自绘，二手归纳。一条横轴，九个点：1848 年 3 月，纽约州海德斯维尔的福克斯家里出现敲击声；1849 年 11 月，罗切斯特的三个委员会检查福克斯姐妹，没有找到作假的方法；1851 年，布法罗大学的三位医学教授报告说，敲击声是身体发出的；1852 年，纽约的周刊《灵的电报》创刊；1861 年前后，波士顿的 William Mumler 开始卖“灵魂照片”；1869 年 4 月底，Mumler 在纽约接受预审，法官驳回了控告；1888 年 10 月，玛吉·福克斯公开说敲击声是自己弄出来的；1889 年 11 月，她收回了这个说法。底部：每一件事，都有人说、有人查、有人解释，三者不是一回事">
  <path class="l" d="M25 110H465"/>
  <circle class="dotk" cx="40" cy="110" r="4"/>
  <text x="40" y="92" text-anchor="middle" class="gt" style="font-size:12px">1848</text>
  <text x="40" y="76" text-anchor="middle" style="font-size:10.5px">敲击声</text>
  <circle class="dotk" cx="95" cy="110" r="4"/>
  <text x="95" y="134" text-anchor="middle" class="gt" style="font-size:12px">1849</text>
  <text x="95" y="150" text-anchor="middle" style="font-size:10.5px">罗切斯特</text>
  <circle class="dotk" cx="150" cy="110" r="4"/>
  <text x="150" y="92" text-anchor="middle" class="gt" style="font-size:12px">1851</text>
  <text x="150" y="76" text-anchor="middle" style="font-size:10.5px">布法罗</text>
  <circle class="dotk" cx="205" cy="110" r="4"/>
  <text x="205" y="134" text-anchor="middle" class="gt" style="font-size:12px">1852</text>
  <text x="205" y="150" text-anchor="middle" style="font-size:10.5px">《灵的电报》</text>
  <circle class="dotk" cx="260" cy="110" r="4"/>
  <text x="260" y="92" text-anchor="middle" class="gt" style="font-size:12px">1861</text>
  <text x="260" y="76" text-anchor="middle" style="font-size:10.5px">Mumler</text>
  <circle class="dotk" cx="315" cy="110" r="4"/>
  <text x="315" y="134" text-anchor="middle" class="gt" style="font-size:12px">1869</text>
  <text x="315" y="150" text-anchor="middle" style="font-size:10.5px">纽约预审</text>
  <circle class="dotk" cx="375" cy="110" r="4"/>
  <text x="375" y="92" text-anchor="middle" class="gt" style="font-size:12px">1888</text>
  <text x="375" y="76" text-anchor="middle" style="font-size:10.5px">“认了”</text>
  <circle class="dotk" cx="430" cy="110" r="4"/>
  <text x="430" y="134" text-anchor="middle" class="gt" style="font-size:12px">1889</text>
  <text x="430" y="150" text-anchor="middle" style="font-size:10.5px">收回</text>
  <text x="245" y="196" text-anchor="middle" class="gt" style="font-size:12.5px">每一件事，都有人说、有人查、有人解释</text>
  <text x="245" y="214" text-anchor="middle" class="sm" style="font-size:11px">这三样，不是一回事；本课按这个顺序来读</text>
  <text x="245" y="232" text-anchor="middle" class="sm" style="font-size:10.5px">日期据 SPR《超心理学百科》的福克斯姐妹条目、IAPSOP 与二手报道，具体日期待核</text>
</svg>
