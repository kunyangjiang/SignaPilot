<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 0 490 400" role="img" aria-label="左右两条完全一样的白臂章，上面都有一个十字。左边作为物：棉或麻，几寸宽，红色是染上去的，能扎伤口，谁来测量结果都一样。右边作为符号：看的人加上 1864 年的约定，读出“戴它的人在照料伤员，按约定不应受到攻击”。布没有变，那句话不在布上">
  <g class="l" filter="url(#wob2)">
    <rect x="30" y="62" width="180" height="74" rx="6"/>
    <rect x="270" y="62" width="180" height="74" rx="6"/>
    <path d="M360 150v86M360 236l-6-10M360 236l6-10"/>
  </g>
  <path class="l thin" d="M240 40v300" stroke-dasharray="3 6"/>
  <g class="gl" filter="url(#wob2)">
    <path d="M112 75h16v16h16v16h-16v16h-16v-16h-16v-16h16z"/>
    <path d="M352 75h16v16h16v16h-16v16h-16v-16h-16v-16h16z"/>
    <rect x="265" y="248" width="190" height="78" rx="8"/>
  </g>
  <rect class="wash" x="265" y="248" width="190" height="78" rx="8"/>
  <g text-anchor="middle">
    <text font-size="19" x="120" y="40">作为物</text>
    <text font-size="19" x="360" y="40">作为符号</text>
    <text class="sm" style="font-size:16px" x="120" y="178">棉或麻，几寸宽</text>
    <text class="sm" style="font-size:16px" x="120" y="206">红色是染上去的</text>
    <text class="sm" style="font-size:16px" x="120" y="234">能扎伤口，会被雨淋湿</text>
    <text class="sm" style="font-size:16px" x="120" y="262">谁来测量，结果都一样</text>
    <text font-size="17" class="gt" x="360" y="282">戴它的人在照料伤员</text>
    <text font-size="17" class="gt" x="360" y="308">按约定不应受到攻击</text>
    <text font-size="18" x="240" y="378">布没有变；那句话不在布上</text>
  </g>
  <text class="sm" style="font-size:16px" x="350" y="198" text-anchor="end">看的人</text>
  <text class="sm" style="font-size:16px" x="370" y="198">1864 年的约定</text>
</svg>
