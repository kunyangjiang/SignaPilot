<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 376" role="img" aria-label="陆修静所述天师道职位阶梯的示意图，本课自绘。左边一行小字：三勤为一功，三功为一德，民有三德，听得署箓。右边一架从下往上的阶梯：最底下一级标箓生，受十将军箓，阶至百五十；往上依次是散气道士、别治、游治、下治、配治；再往上是三八之品，分下八、中八、上八；最高一级金色，标阳平、鹿堂、鹤鸣三气治职。每两级之间写着升迁要有的条件，例如精笃、严能、功称、合法、保举。顶上一行：勿以人负官，勿以官负人。底部：这是陆修静笔下理想的次第，他写下来，正是因为现实中常被打乱">
  <path class="l" d="M220 300V30M420 300V30"/>
  <path class="l thin" d="M220 290H420"/>
  <text x="320" y="282" text-anchor="middle" style="font-size:11.5px">箓生</text>
  <text x="320" y="303" text-anchor="middle" class="sm" style="font-size:9.5px">十将军箓 → 百五十</text>
  <path class="l thin" d="M220 256H420"/>
  <text x="320" y="248" text-anchor="middle" style="font-size:11.5px">散气道士</text>
  <text x="212" y="266" text-anchor="end" class="sm" style="font-size:10px">忠良质朴</text>
  <path class="l thin" d="M220 222H420"/>
  <text x="320" y="214" text-anchor="middle" style="font-size:11.5px">别治</text>
  <text x="212" y="232" text-anchor="end" class="sm" style="font-size:10px">清修</text>
  <path class="l thin" d="M220 188H420"/>
  <text x="320" y="180" text-anchor="middle" style="font-size:11.5px">游治</text>
  <text x="212" y="198" text-anchor="end" class="sm" style="font-size:10px">精笃</text>
  <path class="l thin" d="M220 154H420"/>
  <text x="320" y="146" text-anchor="middle" style="font-size:11.5px">下治</text>
  <text x="212" y="164" text-anchor="end" class="sm" style="font-size:10px">严能</text>
  <path class="l thin" d="M220 120H420"/>
  <text x="320" y="112" text-anchor="middle" style="font-size:11.5px">配治</text>
  <text x="212" y="130" text-anchor="end" class="sm" style="font-size:10px">功称</text>
  <path class="l thin" d="M220 86H420"/>
  <text x="320" y="78" text-anchor="middle" style="font-size:11.5px">三八之品</text>
  <text x="424" y="78" text-anchor="start" class="sm" style="font-size:9px">下八·中八·上八</text>
  <text x="212" y="96" text-anchor="end" class="sm" style="font-size:10px">合法，保举</text>
  <path class="gl thin" d="M220 52H420"/>
  <text x="320" y="44" text-anchor="middle" class="gt" style="font-size:11px">阳平、鹿堂、鹤鸣三气治职</text>
  <text x="212" y="62" text-anchor="end" class="sm" style="font-size:10px">“明炼道气”</text>
  <text x="20" y="286" text-anchor="start" class="sm" style="font-size:11px">“三勤为一功，</text>
  <text x="20" y="302" text-anchor="start" class="sm" style="font-size:11px">三功为一德，</text>
  <text x="20" y="318" text-anchor="start" class="sm" style="font-size:11px">民有三德……听得署箓”</text>
  <path class="l thin" d="M150 300H214" stroke-dasharray="2 3"/>
  <text x="320" y="16" text-anchor="middle" class="gt" style="font-size:11.5px">“勿以人负官，勿以官负人”</text>
  <text x="245" y="346" text-anchor="middle" class="gt" style="font-size:12px">这是陆修静笔下理想的次第</text>
  <text x="245" y="364" text-anchor="middle" class="sm" style="font-size:11px">他写下来，正因为现实里常被打乱</text>
</svg>
