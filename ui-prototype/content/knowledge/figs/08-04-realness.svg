<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 234" role="img" aria-label="三种“真”的对比示意图，本课自绘，据 Densmore 1929、美国内政部印第安艺术与手工艺委员会的页面和 2001 年美联社报道，二手归纳。三列：一，社群里的“对”：谁做、用什么材料、守什么规矩、为谁而做，各社群、各长者可以不同；二，法律上的“如实”：以印第安人制作或某部落的名义销售，必须出自该部落成员或经认证的工匠之手，规定的是怎样标示，不是东西本身灵不灵；三，市场里的“原件”：产地、年份、流传记录、稀缺性。底部：一件东西可以在一栏里“真”，在另一栏里不“真”；三栏回答的是三个不同的问题">
  <path class="l" d="M15 30h150v130h-150Z"/>
  <text x="90" y="52" text-anchor="middle" class="gt" style="font-size:12px">社群里的“对”</text>
  <text x="90" y="78" text-anchor="middle" style="font-size:10.5px">谁做、用什么材料</text>
  <text x="90" y="98" text-anchor="middle" style="font-size:10.5px">守什么规矩、为谁做</text>
  <text x="90" y="118" text-anchor="middle" style="font-size:10.5px">各社群、各长者可以不同</text>
  <text x="90" y="138" text-anchor="middle" style="font-size:10.5px">外人没有现成标准</text>
  <path class="gl" d="M170 30h150v130h-150Z"/>
  <text x="245" y="52" text-anchor="middle" class="gt" style="font-size:12px">法律上的“如实”</text>
  <text x="245" y="78" text-anchor="middle" style="font-size:10.5px">以“印第安人制作”或</text>
  <text x="245" y="98" text-anchor="middle" style="font-size:10.5px">某部落的名义销售</text>
  <text x="245" y="118" text-anchor="middle" style="font-size:10.5px">须出自该部落成员或</text>
  <text x="245" y="138" text-anchor="middle" style="font-size:10.5px">经认证的工匠之手</text>
  <path class="l" d="M325 30h150v130h-150Z"/>
  <text x="400" y="52" text-anchor="middle" class="gt" style="font-size:12px">市场里的“原件”</text>
  <text x="400" y="78" text-anchor="middle" style="font-size:10.5px">产地、年份</text>
  <text x="400" y="98" text-anchor="middle" style="font-size:10.5px">流传记录</text>
  <text x="400" y="118" text-anchor="middle" style="font-size:10.5px">稀缺性</text>
  <text x="400" y="138" text-anchor="middle" style="font-size:10.5px">价格</text>
  <text x="245" y="186" text-anchor="middle" class="gt" style="font-size:12.5px">一件东西可以在一栏里“真”，在另一栏里不“真”</text>
  <text x="245" y="204" text-anchor="middle" class="sm" style="font-size:10.5px">法律那一栏管的是怎样标示，不是东西本身灵不灵</text>
  <text x="245" y="222" text-anchor="middle" class="sm" style="font-size:10.5px">三栏回答三个不同的问题</text>
</svg>
