<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" role="img" aria-label="两行文字的演变。第一行，书名：希腊文“最伟大的”，经中古波斯语先传名字，成为阿拉伯文 al-Majisṭī，再成为拉丁文 almagesti。第二行，正弦：梵文 jyā，阿拉伯文音译为 jība，只写作 jb；后人误读为 jayb，意思是褶；拉丁文照字义译为 sinus，也是褶">
  <defs><marker id="ar35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="gl"/></marker></defs>
  <text x="16" y="28" class="gt" style="font-size:14px">书名：Almagest</text>
  <g class="l" fill="none" filter="url(#wob2)">
    <rect x="16" y="40" width="96" height="76" rx="8"/>
    <rect x="264" y="40" width="96" height="76" rx="8"/>
    <rect x="388" y="40" width="96" height="76" rx="8"/>
    <rect x="16" y="170" width="96" height="76" rx="8"/>
    <rect x="388" y="170" width="96" height="76" rx="8"/>
  </g>
  <rect class="l thin" stroke-dasharray="4 5" fill="none" x="140" y="40" width="96" height="76" rx="8"/>
  <rect class="wash" x="140" y="170" width="96" height="76" rx="8"/>
  <rect class="wash" x="264" y="170" width="96" height="76" rx="8"/>
  <rect class="l thin" fill="none" x="140" y="170" width="96" height="76" rx="8"/>
  <rect class="l thin" fill="none" x="264" y="170" width="96" height="76" rx="8"/>
  <g text-anchor="middle">
    <text x="64" y="68" style="font-size:15px">μεγίστη</text>
    <text x="64" y="90" class="sm" style="font-size:11.5px">希腊文</text>
    <text x="64" y="106" class="sm" style="font-size:11.5px">“最伟大的”</text>
    <text x="188" y="68" style="font-size:13px">中古波斯语</text>
    <text x="188" y="90" class="sm" style="font-size:11.5px">先传名字</text>
    <text x="188" y="106" class="sm" style="font-size:11.5px">不是文本</text>
    <text x="312" y="68" style="font-size:15px">al-Majisṭī</text>
    <text x="312" y="90" class="sm" style="font-size:11.5px">阿拉伯文</text>
    <text x="312" y="106" class="sm" style="font-size:11.5px">9 世纪译本</text>
    <text x="436" y="68" style="font-size:15px">almagesti</text>
    <text x="436" y="90" class="sm" style="font-size:11.5px">拉丁文</text>
    <text x="436" y="106" class="sm" style="font-size:11.5px">12 世纪</text>
    <text x="64" y="198" style="font-size:15px">jyā</text>
    <text x="64" y="220" class="sm" style="font-size:11.5px">梵文</text>
    <text x="64" y="236" class="sm" style="font-size:11.5px">称正弦</text>
    <text x="188" y="198" style="font-size:15px">jība → jb</text>
    <text x="188" y="220" class="sm" style="font-size:11.5px">阿拉伯文音译</text>
    <text x="188" y="236" class="sm" style="font-size:11.5px">不写元音</text>
    <text x="312" y="198" style="font-size:15px">jayb</text>
    <text x="312" y="220" class="sm" style="font-size:11.5px">后人误读</text>
    <text x="312" y="236" class="sm" style="font-size:11.5px">意思是“褶”</text>
    <text x="436" y="198" style="font-size:15px">sinus</text>
    <text x="436" y="220" class="sm" style="font-size:11.5px">拉丁文意译</text>
    <text x="436" y="236" class="sm" style="font-size:11.5px">也是“褶”</text>
  </g>
  <text x="16" y="158" class="gt" style="font-size:14px">一个数学词：正弦（sine）</text>
  <g class="l thin" fill="none">
    <path d="M112 78H138" stroke-dasharray="3 4" marker-end="url(#ar35)"/>
    <path d="M236 78H262" stroke-dasharray="3 4" marker-end="url(#ar35)"/>
    <path d="M360 78H386" marker-end="url(#ar35)"/>
    <path d="M112 208H138" marker-end="url(#ar35)"/>
    <path d="M236 208H262" marker-end="url(#ar35)"/>
    <path d="M360 208H386" marker-end="url(#ar35)"/>
  </g>
  <path class="l thin" d="M16 268H474"/>
  <g style="font-size:12px">
    <text x="16" y="292">① 虚线：书名先经中古波斯语传入，阿拉伯人随后才自己翻译原文（据昆尼奇）</text>
    <text x="16" y="316">② 底色：jb 不写元音，被读成 jayb；拉丁译者照 jayb 的字义译成 sinus</text>
  </g>
</svg>
