<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" role="img" aria-label="安倍晴明的史实与传说的对照图，本课自绘，据 nippon.com 对研究的介绍，是二手归纳。左列“同时代记录”：陰阳寮的官人，天文博士；《小右记》记他择日、禊祓、祭祀；《权记》称他是阴阳道的杰出者；《御堂关白记》记他为立后择日、祈雨；约 985 到 986 年被看作阴阳道第一人，993 年以后晋升从四位下。右列“后来的说法”：《今昔物语集》（12 世纪）称赞他不输古代名人；《宇治拾遗物语》《古事谈》（13 世纪）里他成了保护朝廷和藤原道长的英雄；《安倍晴明物语》（1662 年）出现乌鸦对话、狐狸之母的故事；当代的小说、漫画、影视，常写他驱使式神。底部：能确定的是他在同时代贵族眼里是出色的阴阳道专家，其余多是后来加上去的">
  <text x="130" y="24" text-anchor="middle" class="gt" style="font-size:12.5px">同时代记录</text>
  <text x="370" y="24" text-anchor="middle" class="gt" style="font-size:12.5px">后来的说法</text>
  <path class="l thin" d="M245 34V250" stroke-dasharray="2 4"/>
  <text x="20" y="50" text-anchor="start" class="gt" style="font-size:10.5px">阴阳寮的官人，天文博士</text>
  <text x="20" y="69" text-anchor="start" style="font-size:10.5px"></text>
  <text x="20" y="88" text-anchor="start" style="font-size:10.5px">《小右记》：择日、禊祓、祭祀</text>
  <text x="20" y="107" text-anchor="start" style="font-size:10.5px">《权记》：称他是此道的杰出者</text>
  <text x="20" y="126" text-anchor="start" style="font-size:10.5px">《御堂关白记》：立后择日、祈雨</text>
  <text x="20" y="145" text-anchor="start" style="font-size:10.5px"></text>
  <text x="20" y="164" text-anchor="start" style="font-size:10.5px">约 985–986 年被看作第一人</text>
  <text x="20" y="183" text-anchor="start" style="font-size:10.5px">993 年后晋升从四位下</text>
  <text x="258" y="50" text-anchor="start" class="gt" style="font-size:10.5px">《今昔物语集》（12 世纪）</text>
  <text x="258" y="67" text-anchor="start" style="font-size:10.5px">称赞他不输古代名人</text>
  <text x="258" y="84" text-anchor="start" style="font-size:10.5px"></text>
  <text x="258" y="101" text-anchor="start" class="gt" style="font-size:10.5px">《宇治拾遗物语》《古事谈》（13 世纪）</text>
  <text x="258" y="118" text-anchor="start" style="font-size:10.5px">他成了保护朝廷与道长的英雄</text>
  <text x="258" y="135" text-anchor="start" style="font-size:10.5px"></text>
  <text x="258" y="152" text-anchor="start" class="gt" style="font-size:10.5px">《安倍晴明物语》（1662 年）</text>
  <text x="258" y="169" text-anchor="start" style="font-size:10.5px">乌鸦对话、狐狸之母</text>
  <text x="258" y="186" text-anchor="start" style="font-size:10.5px"></text>
  <text x="258" y="203" text-anchor="start" class="gt" style="font-size:10.5px">当代小说、漫画、影视（待核）</text>
  <text x="258" y="220" text-anchor="start" style="font-size:10.5px">常写他驱使式神</text>
  <text x="245" y="284" text-anchor="middle" class="gt" style="font-size:12.5px">能确定的是：他在同时代贵族眼里是出色的阴阳道专家</text>
  <text x="245" y="302" text-anchor="middle" class="sm" style="font-size:11px">式神、乌鸦、狐狸之母、驱鬼，都是后来加上去的</text>
  <text x="245" y="318" text-anchor="middle" class="sm" style="font-size:10.5px">据小林明在 nippon.com（2024）对研究的介绍，是二手归纳；本课没有读这些史料的原文</text>
</svg>
