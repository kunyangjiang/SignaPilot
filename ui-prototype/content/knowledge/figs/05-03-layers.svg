<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 304" role="img" aria-label="《易》的几层的示意图，本课自绘。三个套在一起的框。最里面一框标经：卦画、卦名、卦辞、爻辞，旁注成书年代学者说法不一。中间一框标传：彖、象、系辞、文言、说卦、序卦、杂卦，合称十翼。最外面一框标历代注疏。右边上半标传统说法：伏羲画卦，文王重卦，孔子作十篇传；北宋欧阳修认为不是一人之言。右边下半一条时间线，标两个出土写本：约前 300 年的楚地竹简本，约前 175 年的马王堆帛书本，后者另有今本没有的解说。底部：传统说法和出土证据，要分开看">
