  <path class="l" d="M38 62H278V244H38Z"/>
  <path class="wash" d="M62 116H254V226H62Z"/><path class="gl" d="M62 116H254V226H62Z"/>
  <text x="158" y="44" text-anchor="middle" style="font-size:12.5px">历代注、疏、解说</text>
  <text x="158" y="84" text-anchor="middle" style="font-size:12.5px">传：彖、象、系辞、文言</text>
  <text x="158" y="102" text-anchor="middle" style="font-size:12.5px">说卦、序卦、杂卦（“十翼”）</text>
  <text x="158" y="142" text-anchor="middle" class="gt" style="font-size:14px">经</text>
  <text x="158" y="166" text-anchor="middle" style="font-size:12px">卦画、卦名</text>
  <text x="158" y="186" text-anchor="middle" style="font-size:12px">卦辞、爻辞</text>
  <text x="158" y="210" text-anchor="middle" class="sm" style="font-size:11px">成书年代学者说法不一</text>
  <text x="318" y="40" text-anchor="start" style="font-size:12px">传统说法</text>
  <text x="318" y="58" text-anchor="start" class="sm" style="font-size:11px">伏羲画卦，文王重卦</text>
  <text x="318" y="74" text-anchor="start" class="sm" style="font-size:11px">孔子作十篇传</text>
  <text x="318" y="90" text-anchor="start" class="sm" style="font-size:11px">北宋欧阳修：非一人之言</text>
  <path class="l thin" d="M318 108H474" stroke-dasharray="2 4"/>
