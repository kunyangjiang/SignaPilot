  <text x="342" y="180" text-anchor="start" class="sm" style="font-size:11px">楚地竹简本（上博）</text>
  <text x="342" y="218" text-anchor="start" style="font-size:11.5px">约前 175 年</text>
  <text x="342" y="234" text-anchor="start" class="sm" style="font-size:11px">马王堆帛书本</text>
  <text x="342" y="250" text-anchor="start" class="sm" style="font-size:11px">另有今本没有的解说</text>
  <text x="245" y="292" text-anchor="middle" class="gt" style="font-size:12px">传统说法和出土证据，要分开看</text>
