<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 380" role="img" aria-label="示意图，不按比例，不是精确地图。中间一条带状的山脉是阿尔卑斯山。山以北，多瑙河自西向东流过维伦多夫。山以南是加尔达湖，旁边标着塞加迪阿拉：这里的鲕粒岩与小像几乎完全吻合。右边远处标着乌克兰东部的伊久姆：吻合程度排第二，但明显较低，实际距离维伦多夫直线至少 1,600 公里，图上用断开的线表示。两条虚线是论文引用的计算机模拟给出的试探性路线：一条从德国施瓦本山区的盖森克勒斯特勒翻越阿尔卑斯山到加尔达湖附近的富马内洞；另一条从维伦多夫附近的克雷姆斯一带绕开阿尔卑斯山南下到加尔达湖，约 930 公里">
