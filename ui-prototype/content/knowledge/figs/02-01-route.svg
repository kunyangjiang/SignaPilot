  </g>
  <g class="sm" style="font-size:13px">
    <text x="134" y="294">加尔达湖旁，几乎完全吻合</text>
    <text x="452" y="136" text-anchor="end">乌克兰东部，排第二</text>
    <text x="452" y="155" text-anchor="end">吻合程度明显较低</text>
