  <text x="70" y="290" text-anchor="middle" class="sm" style="font-size:11px">原样</text>
  <text x="370" y="290" text-anchor="middle" class="sm" style="font-size:11px">第 3 抄</text>
  <text x="245" y="318" text-anchor="middle" class="gt" style="font-size:12.5px">“今符上字不可读，误不可觉”</text>
  <text x="245" y="338" text-anchor="middle" class="sm" style="font-size:11px">认得的字，抄错了能发现；没人认得的符，抄错了也没人知道</text>
  <text x="245" y="354" text-anchor="middle" class="sm" style="font-size:10.5px">符板笔画为本课占位记号</text>
