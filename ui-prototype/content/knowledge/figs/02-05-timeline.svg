<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 380" role="img" aria-label="两条时间线，都不按比例。上面一条是古代证据：公元前 27 年至前 5 年间操练场建成；62 年地震；79 年庞贝被埋，方块不晚于此；约 130 年《巴拿巴书信》；约 185 年曼彻斯特陶片；256 年后不久杜拉被毁，那里的方块不晚于此；822 年加洛林圣经。下面一条是现代研究：1868 年赛伦塞斯特墙皮出土；1925 年庞贝残片出土，1929 年发表，未被认出；1926 年格罗瑟提出主祷文十字；1931 至 1932 年杜拉的发现使基督教说流行；1936 年操练场的完整方块；1937 年热尔法尼翁的五条难题；1959 年菲什威克提出犹太起源说；1978 年赫默仍主张基督教起源；2007 至 2008 年贝努奇讨论柱上的问候语">
  <text x="20" y="22" class="gt" style="font-size:13px">古代证据</text>
  <text x="20" y="212" class="gt" style="font-size:13px">现代研究</text>
  <g class="l" filter="url(#wob2)">
    <path d="M20 110H476M20 296H476"/>
  </g>
  <g class="gl">
    <circle cx="40" cy="110" r="4.5"/><circle cx="100" cy="110" r="4.5"/><circle cx="160" cy="110" r="6"/>
    <circle cx="230" cy="110" r="4.5"/><circle cx="300" cy="110" r="4.5"/><circle cx="370" cy="110" r="6"/><circle cx="440" cy="110" r="4.5"/>
    <circle cx="25" cy="296" r="4.5"/><circle cx="80" cy="296" r="4.5"/><circle cx="135" cy="296" r="4.5"/><circle cx="190" cy="296" r="4.5"/>
    <circle cx="245" cy="296" r="6"/><circle cx="300" cy="296" r="4.5"/><circle cx="355" cy="296" r="4.5"/><circle cx="410" cy="296" r="4.5"/><circle cx="462" cy="296" r="4.5"/>
  </g>
  <g class="l thin">
    <path d="M40 104V92M160 102V92M300 104V92M440 104V92M100 116V128M230 116V128M370 118V128"/>
    <path d="M25 290V278M135 290V278M245 288V278M355 290V278M462 290V278M80 302V314M190 302V314M300 302V314M410 302V314"/>
  </g>
  <g style="font-size:12px" text-anchor="middle">
    <text x="40" y="66" class="sm">前 27–前 5</text><text x="40" y="84">操练场建成</text>
    <text x="160" y="66" class="gt">79</text><text x="160" y="84">庞贝被埋</text>
    <text x="300" y="66" class="sm">约 185</text><text x="300" y="84">曼彻斯特陶片</text>
    <text x="440" y="66" class="sm">822</text><text x="440" y="84">加洛林圣经</text>
    <text x="100" y="144" class="sm">62</text><text x="100" y="162">地震</text>
    <text x="230" y="144" class="sm">约 130</text><text x="230" y="162">《巴拿巴书信》</text>
    <text x="370" y="144" class="gt">256 后</text><text x="370" y="162">杜拉被毁</text>
  </g>
  <text x="245" y="190" text-anchor="middle" class="sm" style="font-size:12px">两个较大的点是“不晚于”的界限：方块只能写在城市被埋或被毁之前</text>
  <g style="font-size:12px">
    <text x="14" y="252" class="sm">1868</text><text x="14" y="270">赛伦塞斯特</text>
    <text x="135" y="252" class="sm" text-anchor="middle">1926</text><text x="135" y="270" text-anchor="middle">格罗瑟的十字</text>
    <text x="245" y="252" class="gt" text-anchor="middle">1936</text><text x="245" y="270" text-anchor="middle">操练场方块</text>
    <text x="355" y="252" class="sm" text-anchor="middle">1959</text><text x="355" y="270" text-anchor="middle">菲什威克</text>
    <text x="476" y="252" class="sm" text-anchor="end">2007–08</text><text x="476" y="270" text-anchor="end">贝努奇</text>
  </g>
  <g style="font-size:12px" text-anchor="middle">
    <text x="80" y="330" class="sm">1925 / 1929</text><text x="80" y="348">残片出土、发表</text><text x="80" y="366" class="sm">未被认出</text>
    <text x="190" y="330" class="sm">1931–32</text><text x="190" y="348">杜拉</text><text x="190" y="366" class="sm">基督教说流行</text>
    <text x="300" y="330" class="sm">1937</text><text x="300" y="348">热尔法尼翁</text><text x="300" y="366" class="sm">五条难题</text>
    <text x="410" y="330" class="sm">1978</text><text x="410" y="348">赫默</text><text x="410" y="366" class="sm">仍主基督教说</text>
  </g>
</svg>
