  <text x="418" y="244" text-anchor="middle" class="gt" style="font-size:12.5px">初九</text>
  <text x="358" y="52" text-anchor="middle" style="font-size:12.5px">阳爻称“九”，阴爻称“六”</text>
  <text x="358" y="72" text-anchor="middle" class="sm" style="font-size:11px">二到五爻先说阴阳：九二、六五</text>
  <text x="358" y="88" text-anchor="middle" class="sm" style="font-size:11px">初、上两爻先说位置：初九、上六</text>
  <text x="245" y="294" text-anchor="middle" class="gt" style="font-size:12px">六条线 ＝ 下卦 ＋ 上卦；8 × 8 ＝ 64 卦</text>
</svg>
