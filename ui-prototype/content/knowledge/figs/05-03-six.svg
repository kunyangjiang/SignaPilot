  <path class="l" d="M266 116H292.24M303.76 116H330" style="stroke-width:4"/>
  <text x="298" y="224" text-anchor="middle" style="font-size:13px">《坤》</text>
  <text x="336" y="137" text-anchor="start" class="gt" style="font-size:12.5px">六五</text>
  <path class="gl" d="M386 196H450" style="stroke-width:4"/>
  <path class="l" d="M386 180H412.24M423.76 180H450" style="stroke-width:4"/>
  <path class="l" d="M386 164H412.24M423.76 164H450" style="stroke-width:4"/>
  <path class="l" d="M386 148H412.24M423.76 148H450" style="stroke-width:4"/>
  <path class="l" d="M386 132H450" style="stroke-width:4"/>
  <path class="l" d="M386 116H412.24M423.76 116H450" style="stroke-width:4"/>
