<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" role="img" aria-label="两种传递，本课自绘的对照示意。上面一行是上一课的号码书：发送方和接收方手里是同一本书，253 发出去，253 到达，原样送达。下面一行是洛特曼的边界：外面的一段文本碰到一层带孔的膜，膜把它翻译成里面的某一种语言，穿过膜以后，形状变了；没有被翻译的部分被挡在外面，对里面来说等于不存在。底部：同一本书，信息原样到达；不同的书，信息要过边界，就要被翻译">
  <text x="16" y="24" class="sm" style="font-size:12px">上一课：同一本书</text>
  <g class="l" filter="url(#wob2)"><rect x="30" y="40" width="80" height="44" rx="5"/><rect x="380" y="40" width="80" height="44" rx="5"/></g>
  <g style="font-size:12px" text-anchor="middle"><text x="70" y="60">号码书</text><text x="70" y="76" class="sm" style="font-size:11px">发送方</text><text x="420" y="60">号码书</text><text x="420" y="76" class="sm" style="font-size:11px">接收方</text></g>
  <path class="l thin" d="M116 62H372M364 57L374 62L364 67"/>
  <text x="245" y="56" text-anchor="middle" style="font-size:13px">253</text>
  <text x="245" y="80" text-anchor="middle" class="gt" style="font-size:11px">原样送达</text>
  <path class="l thin" d="M16 110H474" stroke-dasharray="3 5"/>
  <text x="16" y="134" class="sm" style="font-size:12px">这一课：边界</text>
  <path class="wash" d="M262 148H474V262H262Z"/>
  <path class="gl" filter="url(#wob2)" stroke-dasharray="10 7" stroke-width="3" d="M256 146V264"/>
  <text x="370" y="166" text-anchor="middle" class="sm" style="font-size:11px">里面：自己的语言</text>
  <g class="l" filter="url(#wob2)"><path d="M40 182h22l8 10 8-10h22v26H40z"/><path d="M40 222h60v22H40z"/></g>
  <text x="70" y="168" text-anchor="middle" class="sm" style="font-size:11px">外来的文本</text>
  <path class="l thin" d="M106 196H250M242 191L252 196L242 201"/>
  <path class="l thin" d="M106 233H236"/>
  <path class="l thin" d="M230 227L240 239M240 227L230 239"/>
  <g class="l" filter="url(#wob2)"><ellipse cx="330" cy="196" rx="34" ry="14"/></g>
  <path class="l thin" d="M262 196H292M286 191L296 196L286 201"/>
  <text x="368" y="232" text-anchor="middle" style="font-size:11px" class="gt">翻译成另一种形状</text>
  <text x="150" y="258" text-anchor="middle" class="gt" style="font-size:11px">没被翻译的：挡在外面，等于不存在</text>
  <text x="256" y="282" text-anchor="middle" class="sm" style="font-size:11px">膜：过滤，也加工</text>
  <path class="l thin" d="M16 296H474"/>
  <text x="245" y="320" text-anchor="middle" class="sm" style="font-size:12px">同一本书，信息原样到达；书不同，过边界就要被翻译</text>
</svg>
