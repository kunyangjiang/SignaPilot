<text x="362" y="203" class="sm" style="font-size:12.5px">各管人生一方面</text>
<text x="362" y="245" class="gt" style="font-size:12.5px">上升点</text>
<text x="362" y="266" class="sm" style="font-size:12.5px">出生那一刻</text>
<text x="362" y="287" class="sm" style="font-size:12.5px">正从东方升起的点</text>
<text x="362" y="308" class="sm" style="font-size:12.5px">平均约两小时</text>
<text x="362" y="329" class="sm" style="font-size:12.5px">换一个宫；快慢</text>
<text x="362" y="350" class="sm" style="font-size:12.5px">要看纬度和哪个宫</text>
<text x="245" y="388" text-anchor="middle" class="sm" style="font-size:11.5px">行星位置是随手放的示意，不对应任何真实出生时刻</text>
