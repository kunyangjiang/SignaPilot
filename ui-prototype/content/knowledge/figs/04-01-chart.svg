<text x="362" y="56" class="gt" style="font-size:12.5px">外圈：十二宫</text>
<text x="362" y="77" class="sm" style="font-size:12.5px">每宫 30 度</text>
<text x="362" y="98" class="sm" style="font-size:12.5px">看行星在哪个宫</text>
<text x="362" y="140" class="gt" style="font-size:12.5px">内圈：十二个位</text>
<text x="362" y="161" class="sm" style="font-size:12.5px">从上升点起</text>
