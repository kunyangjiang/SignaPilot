<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 400" role="img" aria-label="宗庙平面示意，北在上，不按比例，只标出《士冠礼》经文提到的位置。上方是高出地面的堂，堂的东西两面墙叫东序、西序；堂后部东边是房，房的西边是室，室门叫户。堂前有两道台阶，东边是阼阶，西边是西阶。台阶下是庭院，院子东侧靠近东阶处设洗，庭院东墙上有闱门。最南面是庙门">
