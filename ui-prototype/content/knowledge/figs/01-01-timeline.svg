<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" role="img" aria-label="红十字标志的时间线：1857 年博当提议统一标志；1863 年日内瓦会议在白臂章上加红十字；1864 年公约第七条定为白底红十字；1876 年奥斯曼帝国改挂红新月；1906 年公约补写红十字是瑞士国旗颜色颠倒；1929 年承认红新月和红狮与太阳；1949 年红色大卫盾提案被否决；2005 年第三附加议定书通过红水晶；2006 年大卫红盾会和巴勒斯坦红新月会加入运动">
  <path class="l thin" d="M132 26V558"/>
  <circle class="dotk" cx="132" cy="44" r="3.5"/><circle class="dotk" cx="132" cy="106" r="3.5"/><circle class="gdot" cx="132" cy="168" r="5"/><circle class="gdot" cx="132" cy="230" r="5"/><circle class="dotk" cx="132" cy="292" r="3.5"/><circle class="dotk" cx="132" cy="354" r="3.5"/><circle class="dotk" cx="132" cy="416" r="3.5"/><circle class="gdot" cx="132" cy="478" r="5"/><circle class="dotk" cx="132" cy="540" r="3.5"/>
  <text class="gt" font-size="18" x="112" y="50" text-anchor="end">1857</text><text font-size="18" x="154" y="50">博当提议：各国救护人员佩戴同一种标志</text><text class="sm" style="font-size:15px" x="154" y="73">克里米亚战争之后</text><text class="gt" font-size="18" x="112" y="112" text-anchor="end">1863</text><text font-size="18" x="154" y="112">日内瓦会议：白臂章上加一个红十字</text><text class="sm" style="font-size:15px" x="154" y="135">会议记录写了结果，没有写理由</text><text class="gt" font-size="18" x="112" y="174" text-anchor="end">1864</text><text font-size="18" x="154" y="174">日内瓦公约第七条：白底红十字</text><text class="sm" style="font-size:15px" x="154" y="197">旗子要和本国国旗一起挂出</text><path class="gl" filter="url(#wob2)" d="M26 156h8v8h8v8h-8v8h-8v-8h-8v-8h8z"/><text class="gt" font-size="18" x="112" y="236" text-anchor="end">1876</text><text font-size="18" x="154" y="236">奥斯曼帝国照会：改挂红新月</text><text class="sm" style="font-size:15px" x="154" y="259">理由：这个标志冒犯了穆斯林士兵</text><path class="gl" filter="url(#wob2)" d="M36 219.6A12 12 0 1 0 36 240.4A10.6 10.6 0 1 1 36 219.6z"/><text class="gt" font-size="18" x="112" y="298" text-anchor="end">1906</text><text font-size="18" x="154" y="298">公约第十八条补写来历</text><text class="sm" style="font-size:15px" x="154" y="321">“瑞士联邦的颜色颠倒过来”</text><text class="gt" font-size="18" x="112" y="360" text-anchor="end">1929</text><text font-size="18" x="154" y="360">承认红新月、红狮与太阳</text><text class="sm" style="font-size:15px" x="154" y="383">只限已经在用的国家</text><text class="gt" font-size="18" x="112" y="422" text-anchor="end">1949</text><text font-size="18" x="154" y="422">红色大卫盾的提案被否决</text><text class="sm" style="font-size:15px" x="154" y="445">22 票对 21 票，7 票弃权</text><text class="gt" font-size="18" x="112" y="484" text-anchor="end">2005</text><text font-size="18" x="154" y="484">第三附加议定书：红水晶</text><text class="sm" style="font-size:15px" x="154" y="507">98 票赞成，27 票反对，10 票弃权</text><path class="gl" filter="url(#wob2)" d="M30 465L43 478L30 491L17 478zM30 471L37 478L30 485L23 478z"/><text class="gt" font-size="18" x="112" y="546" text-anchor="end">2006</text><text font-size="18" x="154" y="546">大卫红盾会、巴勒斯坦红新月会加入</text><text class="sm" style="font-size:15px" x="154" y="569">在同一次会议上获得承认</text>
</svg>
