<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 420" role="img" aria-label="迈尔《逃跑的阿塔兰塔》第 21 号寓意图的结构示意图，本课据 1618 年梅里安蚀刻版画自绘，只画结构，不是原画复制。左边一个穿长袍、戴帽子的人，手持一把大圆规，指向身后砖墙上画着的图形。墙上的图形一层套一层：最外面一个大圆，里面一个三角形，三角形里一个正方形，正方形里一个小圆，小圆里站着一男一女两个裸体的人。地上散放着画有几何图形的纸、一个半圆量角器和一把尺子">
