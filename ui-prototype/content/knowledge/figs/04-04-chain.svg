<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 300" role="img" aria-label="口传链条的示意图，本课自绘。三对人物从左到右排开：每一对是一个年长的老师侧身对着一个年轻的学生，老师的嘴边有一道弧线连到学生的耳朵；后一对里的老师，就是前一对里的学生。上方一本合着的书，旁边写书里只写暗示。下方：卡巴拉本义是接受，懂的人要从老师那里接过来">
  <!-- closed book -->
  <path class="wash" d="M200 22H290V70H200Z"/><path class="l" d="M200 22H290V70H200ZM206 22V70"/>
  <text x="304" y="44" class="sm" style="font-size:12px">书里只写暗示</text>
  <!-- pairs -->
  <g class="l">
    <g transform="translate(46 150)"><circle cx="0" cy="-30" r="11"/><path d="M-6 -20Q-8 -10 -4 -6M-14 -8Q-18 40 -16 80H14Q16 40 12 -8Z"/><path d="M-4 -24Q-2 -14 6 -18" class="thin"/></g>
    <g transform="translate(118 158)"><circle cx="0" cy="-26" r="9"/><path d="M-11 -14Q-13 34 -12 72H11Q13 34 11 -14Z"/></g>
    <g transform="translate(196 150)"><circle cx="0" cy="-30" r="11"/><path d="M-14 -8Q-18 40 -16 80H14Q16 40 12 -8Z"/></g>
    <g transform="translate(268 158)"><circle cx="0" cy="-26" r="9"/><path d="M-11 -14Q-13 34 -12 72H11Q13 34 11 -14Z"/></g>
    <g transform="translate(346 150)"><circle cx="0" cy="-30" r="11"/><path d="M-14 -8Q-18 40 -16 80H14Q16 40 12 -8Z"/></g>
    <g transform="translate(418 158)"><circle cx="0" cy="-26" r="9"/><path d="M-11 -14Q-13 34 -12 72H11Q13 34 11 -14Z"/></g>
  </g>
  <g class="gl" style="stroke-width:1.4">
    <path d="M58 118Q84 96 110 128" stroke-dasharray="3 3"/>
    <path d="M208 118Q234 96 260 128" stroke-dasharray="3 3"/>
    <path d="M358 118Q384 96 410 128" stroke-dasharray="3 3"/>
  </g>
  <path class="l thin" d="M130 200Q160 220 184 200M280 200Q310 220 334 200" stroke-dasharray="2 4"/>
  <g text-anchor="middle" class="sm" style="font-size:11.5px">
    <text x="82" y="256">老师 → 学生</text><text x="232" y="256">学生成了老师</text><text x="382" y="256">再传下去</text>
  </g>
  <text x="245" y="288" text-anchor="middle" class="gt" style="font-size:13px">“卡巴拉”本义是“接受”：懂的人要从老师那里接过来</text>
</svg>
