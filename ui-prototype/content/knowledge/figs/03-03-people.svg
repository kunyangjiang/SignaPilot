  <text x="474" y="406" text-anchor="end" class="sm" style="font-size:11.5px">15 世纪</text>
  <text x="474" y="428" text-anchor="end" style="font-size:12.5px">菲奇诺的拉丁文译本</text>
  <text x="16" y="446" class="sm" style="font-size:11.5px">200–500 年按比例；虚线处跳过约一千年</text>
