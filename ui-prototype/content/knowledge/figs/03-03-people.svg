<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 454" role="img" aria-label="人物时间线，200 年到 500 年按比例。普罗提诺，约 205 到 270 年，244 年起在罗马讲学；波菲利，约 234 到约 305 年，编《九章集》，写致阿内博的信；扬布里柯，约 242 到约 325 年，写《答波菲利》；尤利安，约 350 年求学，361 到 363 年在位；奥古斯丁写《上帝之城》，413 到 426 年，第 10 卷论神术；普罗克洛，5 世纪，说回信出自扬布里柯。右端另起一段：15 世纪，菲奇诺在佛罗伦萨把普罗提诺和扬布里柯译成拉丁文">
  <text x="16" y="44" style="font-size:14px">普罗提诺</text><rect class="wash" x="46" y="52" width="82" height="10" rx="3"/><text x="46" y="78" class="sm" style="font-size:11.5px">约 205–270　244 年起在罗马讲学</text><text x="16" y="100" style="font-size:14px">波菲利</text><rect class="wash" x="83" y="108" width="90" height="10" rx="3"/><text x="83" y="134" class="sm" style="font-size:11.5px">约 234–约 305　编《九章集》；致阿内博的信</text><text x="16" y="156" style="font-size:14px">扬布里柯</text><rect class="wash" x="93" y="164" width="105" height="10" rx="3"/><text x="93" y="190" class="sm" style="font-size:11.5px">约 242–约 325　《答波菲利》</text><text x="16" y="212" style="font-size:14px">尤利安</text><rect class="wash" x="230" y="220" width="16" height="10" rx="3"/><text x="230" y="246" class="sm" style="font-size:11.5px">约 350 年求学　361–363 年在位</text><text x="16" y="268" style="font-size:14px">奥古斯丁《上帝之城》</text><rect class="wash" x="310" y="276" width="16" height="10" rx="3"/><text x="310" y="302" class="sm" style="font-size:11.5px">413–426　第 10 卷论神术</text><text x="16" y="324" style="font-size:14px">普罗克洛</text><rect class="wash" x="309" y="332" width="92" height="10" rx="3"/><text x="309" y="358" class="sm" style="font-size:11.5px">5 世纪　说回信出自扬布里柯</text>
