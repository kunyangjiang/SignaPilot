<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" role="img" aria-label="六壬式盘结构的示意图，本课自绘。左边：一个方形底板，四边排着十二个地支，标地盘，下布十二辰；方板上叠一个圆盘，圆周上也是十二格，标天盘，刻十二神；圆盘中央一个小点，表示可以转动。盘下写以月将加卜时。右边：从盘上取出四个格子，标四课；四课里取出三个，排成一列，标三传；旁边一列小字列十二将：天一居中，前有螣蛇、朱雀、六合、句陈、青龙，后有天后、太阴、玄武、太常、白兽、天空。底部：据《唐六典》太卜署的文字画的结构示意，不是出土实物，也不能照着操作">
