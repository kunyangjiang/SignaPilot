  <text x="130" y="162" text-anchor="middle" class="sm" style="font-size:10.5px">十二神</text>
  <text x="130" y="30" text-anchor="middle" class="sm" style="font-size:11px">地盘：下布十二辰</text>
  <text x="130" y="262" text-anchor="middle" class="gt" style="font-size:11.5px">“以月将加卜时”</text>
  <text x="130" y="278" text-anchor="middle" class="sm" style="font-size:10.5px">“以枫木为天，枣心为地”</text>
