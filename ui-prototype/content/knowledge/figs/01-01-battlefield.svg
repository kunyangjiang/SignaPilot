    <text x="84" y="252">抬伤员的医生</text><text x="190" y="252">搬弹药的士兵</text>
    <text x="330" y="252">抬伤员的医生</text><text x="436" y="252">士兵</text>
  </g>
  <path class="l thin" d="M16 282H474"/>
  <text x="245" y="310" text-anchor="middle" style="font-size:13.5px">隔着几百米，弯腰抬人和弯腰搬箱子看起来一样</text>
  <text x="245" y="336" text-anchor="middle" class="gt" style="font-size:13.5px">缺的不是善意，是一个双方都认得的记号</text>
