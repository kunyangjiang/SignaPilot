<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 360" role="img" aria-label="从远处炮位望过去的战场示意。左半边：两个弯腰的人影，一个抬着担架上的伤员，一个搬着弹药箱，远看几乎一样，中间一个问号。右半边：同样两个人影，抬伤员的那个左臂多了一条白底红十字臂章，一眼就能分出来。底部：缺的不是善意，是一个双方都认得的记号">
  <text x="122" y="26" text-anchor="middle" style="font-size:14px">没有记号</text>
