  <text x="146" y="112" text-anchor="middle" class="gt" style="font-size:26px">?</text>
  <g class="l" transform="translate(290 128)"><circle cx="0" cy="0" r="9"/><path d="M2 10Q12 32 16 58"/><path d="M16 58L6 100M16 58L28 100"/><path d="M8 22L36 44"/><path d="M32 46H84"/><path d="M44 38Q62 30 76 38"/><circle cx="82" cy="34" r="6"/></g>
  <rect x="297" y="143" width="16" height="12" rx="2" class="wash"/>
  <rect x="297" y="143" width="16" height="12" rx="2" class="l thin" style="opacity:1"/>
  <path class="gl" d="M305 145V153M301 149H309" style="stroke-width:2.2"/>
  <path class="gl" d="M312 142Q330 112 352 104" stroke-dasharray="3 4"/>
  <text x="356" y="104" class="gt" style="font-size:12.5px">白底红十字臂章</text>
  <g class="l" transform="translate(452 128)"><circle cx="0" cy="0" r="9"/><path d="M-2 10Q-12 32 -16 58"/><path d="M-16 58L-26 100M-16 58L-4 100"/><path d="M-8 22L-24 40"/><rect x="-46" y="38" width="24" height="16" rx="2"/></g>
