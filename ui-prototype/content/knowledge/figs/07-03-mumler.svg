<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 274" role="img" aria-label="“灵魂照片”的三种材料的示意图，本课自绘，不含任何灵魂照片或其复制品。三列：一，留下来的：美术馆和图书馆里的实物，如盖蒂博物馆的 Mumler 相册，大都会博物馆的几张借展的蛋白银盐照片；这些照片的存在是确定的；二，证人说的：来拍照的人说照片里出现了亲人；辩方的证人，是说自己相信的前顾客；三，调查显示的：1869 年纽约警察法庭的预审里，控方的证人 Mason、Bogardus 和 Barnum 说，他们事先被告知会被诡计欺骗，仍然没能看出诡计；这显示自然的办法能骗过在场的观察者；法官当场驳回了控告，理由是控方没有证明 Mumler 是怎样做的。底部：驳回控告，不等于照片是真的；它说的是控方没有证明方法">
  <path class="l thin" d="M20 30h140v170h-140Z"/>
  <text x="90" y="52" text-anchor="middle" class="gt" style="font-size:12.5px">留下来的</text>
  <text x="90" y="84" text-anchor="middle" style="font-size:10px">实物：照片本身</text>
  <text x="90" y="104" text-anchor="middle" style="font-size:10px">馆藏里的 Mumler 照片</text>
  <text x="90" y="124" text-anchor="middle" style="font-size:10px">（盖蒂、大都会等）</text>
  <path class="gl thin" d="M30 152h120v34h-120Z"/>
  <text x="90" y="174" text-anchor="middle" class="gt" style="font-size:10.5px">确定：它们存在</text>
  <path class="l thin" d="M175 30h140v170h-140Z"/>
  <text x="245" y="52" text-anchor="middle" class="gt" style="font-size:12.5px">证人说的</text>
  <text x="245" y="84" text-anchor="middle" style="font-size:10px">来拍照的人说：</text>
  <text x="245" y="104" text-anchor="middle" style="font-size:10px">照片里有亲人</text>
  <text x="245" y="124" text-anchor="middle" style="font-size:10px">辩方：前顾客说相信</text>
  <path class="gl thin" d="M185 152h120v34h-120Z"/>
  <text x="245" y="174" text-anchor="middle" class="gt" style="font-size:10.5px">这是说法，不是检验</text>
  <path class="l thin" d="M330 30h140v170h-140Z"/>
  <text x="400" y="52" text-anchor="middle" class="gt" style="font-size:12.5px">调查显示的</text>
  <text x="400" y="84" text-anchor="middle" style="font-size:10px">控方证人：被预先告知</text>
  <text x="400" y="104" text-anchor="middle" style="font-size:10px">仍看不出诡计</text>
  <text x="400" y="124" text-anchor="middle" style="font-size:10px">→ 自然办法能骗过观察者</text>
  <path class="gl thin" d="M340 152h120v34h-120Z"/>
  <text x="400" y="174" text-anchor="middle" class="gt" style="font-size:10.5px">显示“能做到”</text>
  <text x="245" y="226" text-anchor="middle" class="gt" style="font-size:12.5px">“驳回控告”，不等于“照片是真的”</text>
  <text x="245" y="244" text-anchor="middle" class="sm" style="font-size:11px">法官说的是：控方没有证明他是怎样做的；这不是对灵魂的结论</text>
  <text x="245" y="262" text-anchor="middle" class="sm" style="font-size:10.5px">据 Hull（1869）的信、二手材料；本课没有读庭审记录，也没有读 Kaplan</text>
</svg>
