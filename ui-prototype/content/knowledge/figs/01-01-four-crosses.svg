<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 430" role="img" aria-label="同一个十字形出现在四个地方。作业本上：2 + 3 = 5，十字是加号。旗杆上：红底白十字，是瑞士国旗。屋顶上：教堂尖顶上竖杆更长的十字，指基督教。救护车上：白底红十字旗，指受保护的救护人员。底部：形状没变，周围的东西变了">
  <!-- panel frames -->
  <g class="l thin" style="opacity:.8">
    <rect x="16" y="16" width="220" height="170" rx="6"/><rect x="254" y="16" width="220" height="170" rx="6"/>
    <rect x="16" y="200" width="220" height="170" rx="6"/><rect x="254" y="200" width="220" height="170" rx="6"/>
  </g>
  <!-- 1 notebook -->
  <g class="l thin"><path d="M40 60H212M40 84H212M40 108H212M40 132H212"/></g>
  <text x="62" y="104" style="font-size:24px;font-family:var(--f-hei)">2</text>
  <path class="gl" d="M86 96H104M95 87V105" style="stroke-width:2.4"/>
  <text x="112" y="104" style="font-size:24px;font-family:var(--f-hei)">3 = 5</text>
  <text x="126" y="172" text-anchor="middle" style="font-size:13.5px">作业本上：加号</text>
  <!-- 2 Swiss flag -->
  <path class="l" d="M300 40V160"/>
  <rect class="wash" x="300" y="44" width="70" height="70" style="opacity:.35"/>
  <rect class="l" x="300" y="44" width="70" height="70"/>
  <path class="l" d="M329 58H341V73H356V85H341V100H329V85H314V73H329Z" style="stroke-width:1.4"/>
  <text x="400" y="74" class="sm" style="font-size:11.5px">红底</text>
  <text x="400" y="92" class="sm" style="font-size:11.5px">白十字</text>
  <text x="364" y="172" text-anchor="middle" style="font-size:13.5px">旗杆上：瑞士国旗</text>
  <!-- 3 church spire -->
  <path class="l" d="M70 360V300L126 254L182 300V360"/>
  <path class="l" d="M110 360V318Q126 304 142 318V360"/>
  <path class="l" d="M126 254V218"/>
  <path class="gl" d="M126 214V246M116 224H136" style="stroke-width:2.2"/>
  <text x="200" y="232" class="sm" style="font-size:11.5px" text-anchor="end">竖杆更长</text>
  <!-- 4 ambulance -->
  <path class="l" d="M280 316H420V284H384L370 262H280Z"/>
  <path class="l" d="M280 316V336H440V300L420 284"/>
  <circle class="l" cx="310" cy="338" r="10"/><circle class="l" cx="408" cy="338" r="10"/>
  <path class="l" d="M300 262V220"/>
  <rect class="l" x="300" y="222" width="40" height="28"/>
  <path class="gl" d="M320 228V244M312 236H328" style="stroke-width:2.4"/>
  <text x="348" y="238" class="sm" style="font-size:11.5px">白底红十字</text>
  <text x="126" y="394" text-anchor="middle" style="font-size:13.5px">屋顶上：基督教</text>
  <text x="364" y="394" text-anchor="middle" style="font-size:13.5px">救护车上：受保护的人</text>
  <text x="245" y="416" text-anchor="middle" class="gt" style="font-size:13px">形状没变，周围的东西变了</text>
</svg>
