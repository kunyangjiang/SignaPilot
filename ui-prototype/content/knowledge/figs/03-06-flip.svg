  <text x="245" y="185" text-anchor="middle" style="font-size:13px">相似</text>
  <g class="l thin" stroke-dasharray="3 4"><path d="M196 172H140"/><path d="M294 172H350"/></g>
  <path class="l thin" d="M16 322H474"/>
  <text x="245" y="352" text-anchor="middle" style="font-size:13.5px">文本没变，年代变了，箭头就掉了头</text>
</svg>
