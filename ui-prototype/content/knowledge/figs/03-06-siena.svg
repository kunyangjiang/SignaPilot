<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 470" role="img" aria-label="锡耶纳主教座堂地面赫尔墨斯拼花的结构示意，本课自绘，不是原作复制。中间是戴高帽、穿长袍的赫尔墨斯；他向左递出一本书，书上写着埃及人啊，接受文字和法律吧；左边两个求教的人，一个缠头巾，一个蒙面纱；右边两只狮身人面像托着一块石板，石板上是一段讲神造了第二位神、爱他如儿子的话；画面底部的铭文写着摩西的同时代人">
