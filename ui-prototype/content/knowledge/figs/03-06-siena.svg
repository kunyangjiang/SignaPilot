  <g style="font-size:12.5px">
    <text x="16" y="372">① 书上写着：“埃及人啊，接受文字和法律吧”</text>
    <text x="16" y="394">② 石板：神造了第二位神，爱他如儿子（大意）</text>
    <text x="16" y="416">③ 底部铭文：“摩西的同时代人”</text>
    <text x="16" y="438">④ 两个求教者：一个缠头巾，一个蒙面纱</text>
    <text x="16" y="462" class="sm" style="font-size:11.5px">1488 年铺成 · 设计者一般认为是乔瓦尼·迪·斯特凡诺 · 示意图</text>
