<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 220" role="img" aria-label="一条“巧合的链”的示意图，本课自绘，据 SPLC 2017 年的文章和 ADL 的页面，二手归纳，没有复制任何表情包或截图。从左到右四环：一，《魔兽世界》的聊天翻译，把“LOL”显示成“KEK”，这个词被玩家带出游戏；二，有网友注意到古埃及有一位名叫 Kek 的神，据文章是蛙头；三，网友把它与一只名叫 Pepe 的卡通青蛙连在一起，这只青蛙是 2005 年漫画里的角色，原本没有政治含义；四，在一些社区里，出现了一套半真半假的“宗教”，有祈祷词、虚构国家和“meme magic”的说法。每两环之间标着：这一步是网友事后发现的“对上了”，不是任何一方事先设计的；底部：巧合，被一群人认出来、反复说、并且给了名字，就开始有了符号的作用">
  <defs><marker id="a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" class="l" fill="none"/></marker></defs>
  <path class="l" d="M10 36h110v84h-110Z"/>
  <text x="65" y="56" text-anchor="middle" class="gt" style="font-size:12px">一</text>
  <text x="65" y="78" text-anchor="middle" style="font-size:10px">游戏聊天翻译</text>
  <text x="65" y="98" text-anchor="middle" style="font-size:10px">“LOL”显示成“KEK”</text>
  <path class="l" d="M122 78h6" marker-end="url(#a86)"/>
  <text x="125" y="140" text-anchor="middle" class="sm" style="font-size:9.5px">事后发现</text>
  <path class="l" d="M130 36h110v84h-110Z"/>
  <text x="185" y="56" text-anchor="middle" class="gt" style="font-size:12px">二</text>
  <text x="185" y="78" text-anchor="middle" style="font-size:10px">有网友注意到</text>
  <text x="185" y="98" text-anchor="middle" style="font-size:10px">古埃及有神名 Kek</text>
  <path class="l" d="M242 78h6" marker-end="url(#a86)"/>
  <text x="245" y="140" text-anchor="middle" class="sm" style="font-size:9.5px">事后发现</text>
  <path class="l" d="M250 36h110v84h-110Z"/>
  <text x="305" y="56" text-anchor="middle" class="gt" style="font-size:12px">三</text>
  <text x="305" y="78" text-anchor="middle" style="font-size:10px">网友把它与</text>
  <text x="305" y="98" text-anchor="middle" style="font-size:10px">卡通青蛙 Pepe 连起来</text>
  <path class="l" d="M362 78h6" marker-end="url(#a86)"/>
  <text x="365" y="140" text-anchor="middle" class="sm" style="font-size:9.5px">事后发现</text>
  <path class="gl" d="M370 36h110v84h-110Z"/>
  <text x="425" y="56" text-anchor="middle" class="gt" style="font-size:12px">四</text>
  <text x="425" y="78" text-anchor="middle" style="font-size:10px">一些社区出现</text>
  <text x="425" y="98" text-anchor="middle" style="font-size:10px">半真半假的“宗教”</text>
  <text x="245" y="172" text-anchor="middle" class="gt" style="font-size:12px">每两环之间：是网友“对上了”，不是任何一方事先设计的</text>
  <text x="245" y="190" text-anchor="middle" class="sm" style="font-size:10.5px">巧合被一群人认出来、反复说、给了名字，才开始像符号</text>
  <text x="245" y="208" text-anchor="middle" class="sm" style="font-size:10px">据 SPLC 2017、ADL；未复制任何表情包或截图</text>
</svg>
