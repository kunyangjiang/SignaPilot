<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" role="img" aria-label="太乙行九宫的示意图，本课自绘。左边一个三乘三的九宫格，按《大戴礼记》明堂一节的数字排列：上排二、九、四，中排七、五、三，下排六、一、八；中间的五用金色标出。格子外面一条虚线箭头绕行，写太乙在九宫之间移动。右边从上到下三个框：以岁、月、日、时为纲；八将；落到分野、治乱、水旱兵疫。框边小字：关心的是国家和天下，时间单位常以年计。底部：数字排列据《大戴礼记》，经清代《四库全书总目》引用；太乙的具体行宫次序，各家说法不同，本图不画">
