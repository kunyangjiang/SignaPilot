<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 420" role="img" aria-label="一张合成图。中间是一个圆，写着“三倍伟大的赫尔墨斯”。四周五个来源指向它：左上，埃及的托特神，掌管文字与知识，崇拜中心在赫尔莫波利斯；右上，希腊的赫尔墨斯神，众神的信使，希腊人把他与托特等同；左下，远古的凡人智者，见于拉克坦提乌斯转述的西塞罗，给埃及人带去法律和文字；右下，文本里的老师，在对话中被弟子称为父亲，教导塔特、阿斯克勒庇俄斯和阿蒙王；正下方，同名的祖父，见于奥古斯丁引用的对话，葬在以他命名的城市。图下方注明：这是一个由多种来源叠成的形象，不是一个可以考证生卒年的人">
  <g class="l thin">
    <path d="M178 104L212 158M312 104L278 158M178 268L212 228M312 268L278 228M245 302V250"/>
  </g>
  <circle class="wash" cx="245" cy="193" r="58"/>
  <circle class="l" cx="245" cy="193" r="58" fill="none" filter="url(#wob2)"/>
  <g text-anchor="middle">
    <text x="245" y="188" style="font-size:15px" class="gt">三倍伟大的</text>
    <text x="245" y="210" style="font-size:15px" class="gt">赫尔墨斯</text>
  </g>
  <g class="l" filter="url(#wob2)">
    <rect x="16" y="24" width="190" height="80" rx="7"/>
    <rect x="284" y="24" width="190" height="80" rx="7"/>
    <rect x="16" y="268" width="190" height="80" rx="7"/>
    <rect x="284" y="268" width="190" height="80" rx="7"/>
  </g>
  <rect class="l thin" stroke-dasharray="4 5" fill="none" x="150" y="302" width="190" height="80" rx="7"/>
  <g style="font-size:14px">
    <text x="30" y="48">埃及的托特神</text>
    <text x="298" y="48">希腊的赫尔墨斯神</text>
    <text x="30" y="292">远古的凡人智者</text>
    <text x="298" y="292">文本里的老师</text>
  </g>
  <g class="sm" style="font-size:12px">
    <text x="30" y="70">掌管文字、计算与知识</text>
    <text x="30" y="88">崇拜中心：赫尔莫波利斯</text>
    <text x="298" y="70">众神的信使</text>
    <text x="298" y="88">希腊人把他认作托特</text>
    <text x="30" y="314">拉克坦提乌斯转述西塞罗：</text>
    <text x="30" y="332">给埃及人带去法律和文字</text>
    <text x="298" y="314">被弟子称为“父亲”，</text>
    <text x="298" y="332">教导塔特、阿斯克勒庇俄斯</text>
  </g>
  <text x="245" y="326" text-anchor="middle" style="font-size:14px">同名的祖父</text>
  <text x="245" y="348" text-anchor="middle" class="sm" style="font-size:12px">“葬在以他命名的城市”</text>
  <text x="245" y="368" text-anchor="middle" class="sm" style="font-size:12px">见于奥古斯丁所引的对话</text>
  <text x="245" y="406" text-anchor="middle" class="sm" style="font-size:12px">一个叠起来的形象，不是一个可以考证生卒年的人</text>
</svg>
