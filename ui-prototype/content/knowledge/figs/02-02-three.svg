<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 400" role="img" aria-label="三次加冠，本课据《士冠礼》经文自绘的对照示意，冠和衣服只写名称，不画样式。第一次：缁布冠，宾走下西阶一级去接；祝辞里有弃尔幼志，顺尔成德；戴上后少年进房换上玄端。第二次：皮弁，宾走下两级；祝辞里有敬尔威仪，淑慎尔德；换上皮弁服，配素积、素韠。第三次：爵弁，宾走下三级；祝辞里有兄弟具在，以成厥德；换上爵弁服，配纁裳、纯衣、韎韐。三次是先后发生的，图里并排只为对照；每一列从上往下是经文里的先后。每次之后少年都出房面朝南站着，让在场的人看。底部：《冠义》只用一句三加弥尊">
  <g class="sm" style="font-size:11px">
    <text x="12" y="70">冠</text><text x="12" y="132">宾去接</text><text x="12" y="200">祝辞</text><text x="12" y="262">换上</text>
  </g>
  <g class="l" filter="url(#wob2)">
    <rect x="70" y="20" width="128" height="300" rx="6"/>
    <rect x="206" y="20" width="128" height="300" rx="6"/>
  </g>
  <g class="gl" filter="url(#wob2)"><rect x="342" y="20" width="128" height="300" rx="6"/></g>
  <g style="font-size:13px" text-anchor="middle">
    <text x="134" y="44">第一次</text><text x="270" y="44">第二次</text><text x="406" y="44">第三次</text>
    <text x="134" y="72">缁布冠</text><text x="270" y="72">皮弁</text><text x="406" y="72">爵弁</text>
  </g>
  <g class="l thin">
    <path d="M100 118h20v8h20v8h20" /><circle cx="110" cy="112" r="3"/>
    <path d="M236 118h20v8h20v8h20" /><circle cx="266" cy="120" r="3"/>
    <path d="M372 118h20v8h20v8h20" /><circle cx="422" cy="128" r="3"/>
  </g>
  <g class="gt" style="font-size:11.5px" text-anchor="middle">
    <text x="134" y="156">走下一级</text><text x="270" y="156">走下两级</text><text x="406" y="156">走下三级</text>
  </g>
  <g style="font-size:12px" text-anchor="middle">
    <text x="134" y="256">玄端</text><text x="270" y="256">皮弁服</text><text x="406" y="256">爵弁服</text>
  </g>
  <g class="sm" style="font-size:11px" text-anchor="middle">
    <text x="134" y="276">黑色礼服</text><text x="270" y="276">素积、素韠</text><text x="406" y="276">纁裳、纯衣、韎韐</text>
  </g>
  <g style="font-size:12px" text-anchor="middle">
    <text x="134" y="194">弃尔幼志，</text><text x="134" y="212">顺尔成德</text>
    <text x="270" y="194">敬尔威仪，</text><text x="270" y="212">淑慎尔德</text>
    <text x="406" y="194">兄弟具在，</text><text x="406" y="212">以成厥德</text>
  </g>
  <g class="sm" style="font-size:10.5px" text-anchor="middle">
    <text x="134" y="308">出房，面朝南</text><text x="270" y="308">出房，面朝南</text><text x="406" y="308">出房，面朝南</text>
  </g>
  <path class="l thin" d="M16 340H474"/>
  <text x="245" y="364" text-anchor="middle" class="sm" style="font-size:12px">对照示意：三次先后进行，每列从上往下按经文次序</text>
  <text x="245" y="388" text-anchor="middle" class="gt" style="font-size:12.5px">《冠义》：“三加弥尊”，只一句</text>
</svg>
