<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 308" role="img" aria-label="一位当代学者概括的精气神关系的示意图，本课自绘，据普雷加迪奥（Fabrizio Pregadio）对内丹的概括，是一种框架，不是某部文本的原图，也不是操作步骤。从左到右：精，气，神，虚。箭头方向向右，表示把前一个收回到后一个，最后返回到虚，也就是道。下方小字：各家对三者的名称、次序、含义并不一致；《悟真篇序》里神气出现在被批评的名单中，说明张伯端不认为可以把它们简单当作铅汞的替身。底部：这是一种归纳，不是所有内丹文本共同的图">
  <defs><marker id="ar5903" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" class="l" fill="none"/></marker></defs>
  <circle class="l" cx="70" cy="110" r="32"/>
  <text x="70" y="118" text-anchor="middle" style="font-size:22px">精</text>
  <path class="l thin" d="M106 110H148" marker-end="url(#ar5903)"/>
  <circle class="l" cx="187" cy="110" r="32"/>
  <text x="187" y="118" text-anchor="middle" style="font-size:22px">气</text>
  <path class="l thin" d="M223 110H265" marker-end="url(#ar5903)"/>
  <circle class="l" cx="304" cy="110" r="32"/>
  <text x="304" y="118" text-anchor="middle" style="font-size:22px">神</text>
  <path class="l thin" d="M340 110H382" marker-end="url(#ar5903)"/>
  <circle class="gl" cx="421" cy="110" r="32"/>
  <text x="421" y="118" text-anchor="middle" class="gt" style="font-size:22px">虚</text>
  <text x="128" y="80" text-anchor="middle" class="sm" style="font-size:10.5px">收回到</text>
  <text x="245" y="80" text-anchor="middle" class="sm" style="font-size:10.5px">收回到</text>
  <text x="362" y="80" text-anchor="middle" class="sm" style="font-size:10.5px">返回</text>
  <text x="70" y="166" text-anchor="middle" class="sm" style="font-size:10.5px">Essence</text>
  <text x="187" y="166" text-anchor="middle" class="sm" style="font-size:10.5px">Breath</text>
  <text x="304" y="166" text-anchor="middle" class="sm" style="font-size:10.5px">Spirit</text>
  <text x="421" y="166" text-anchor="middle" class="sm" style="font-size:10.5px">Emptiness / 道</text>
  <path class="l thin" d="M20 190H470" stroke-dasharray="2 4"/>
  <text x="245" y="214" text-anchor="middle" class="gt" style="font-size:12px">这是一位当代学者对内丹的一种概括，不是某部文本的原图</text>
  <text x="245" y="234" text-anchor="middle" class="sm" style="font-size:11px">各家对三者的名称、次序、含义并不一致</text>
  <text x="245" y="252" text-anchor="middle" class="sm" style="font-size:11px">《悟真篇序》把“用神气为子母”列在被批评的读法里</text>
  <text x="245" y="270" text-anchor="middle" class="sm" style="font-size:11px">说明作者不认为可以把它们简单当作“铅汞”的替身</text>
  <text x="245" y="296" text-anchor="middle" class="sm" style="font-size:11px">这里只是一种框架，不是步骤，也不是现代生理学</text>
</svg>
