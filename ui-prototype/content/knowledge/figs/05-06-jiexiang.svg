<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 380" role="img" aria-label="介象读符的示意图，本课自绘。上排五块竖长的符板，每块上面画着抽象的弯曲笔画，顶端原本贴着写名字的题签，题签被撕下来放在一旁，写着去其签题。中间一个人像标介象，从他引出五条线，分别回到五块符板，写皆一一据名之；其中一块用金色圈出，写其有误者，便为人定之。下排一条横线，左边标三国吴，右边标葛洪写书时，线上写自是以来，莫有能知者也。底部：笔画是本课随手画的占位记号，不是任何真符；故事出自《抱朴子·遐览》">
