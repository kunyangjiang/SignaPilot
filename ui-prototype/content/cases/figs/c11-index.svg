<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="一张照片从被拍的东西到看的人，经过五步：被拍的东西，光，底片，照片，看的人。底片是光留下的痕迹；照片可以在晒印时改动；最后认出“是他”的，是看照片的人。">
<rect class="l" x="30" y="30" width="120" height="46" rx="4"/><text x="90" y="59" font-size="16" text-anchor="middle">被拍的东西</text><text x="166" y="59" font-size="14">椅子上的人，或者椅子上没有人</text><path class="l" d="M90 76V110 m-6 -8 l6 8 l6 -8"/><rect class="l" x="30" y="116" width="120" height="46" rx="4"/><text x="90" y="145" font-size="16" text-anchor="middle">光</text><text x="166" y="145" font-size="14">从玻璃顶上来，碰到它，再进镜头</text><path class="l" d="M90 162V196 m-6 -8 l6 8 l6 -8"/><rect class="l" x="30" y="202" width="120" height="46" rx="4"/><text x="90" y="231" font-size="16" text-anchor="middle">底片</text><text x="166" y="231" font-size="14">光碰到哪里，哪里就黑：这是痕迹</text><path class="l" d="M90 248V282 m-6 -8 l6 8 l6 -8"/><rect class="l" x="30" y="288" width="120" height="46" rx="4"/><text x="90" y="317" font-size="16" text-anchor="middle">照片</text><text x="166" y="317" font-size="14">可以遮、挡、两张叠着晒</text><path class="l" d="M90 334V368 m-6 -8 l6 8 l6 -8"/><rect class="l" x="30" y="374" width="120" height="46" rx="4"/><text x="90" y="403" font-size="16" text-anchor="middle">看的人</text><text x="166" y="403" font-size="14">“是他”：这一步，靠的是看的人</text>
<text x="30" y="458" font-size="14">痕迹能证明光到过这里，不能证明那是谁。</text>
</svg>
