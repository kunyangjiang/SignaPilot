<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 568" role="img" aria-label="长期保存与临时防腐的对比。长期保存：为国家；不设期限；头一遍要几个月；做完以后每周查看，每 18 个月重做，停不得；主要办法是反复浸泡溶液、替换材料、修形；保的是样子连同手感，包括弹性、关节和体重；由陵墓实验室做。临时防腐：为家属；管到下葬，几天；头一遍几个钟头到几天；做完以后不再管；主要办法是经血管灌注药水、修补、化妆；保的是告别那天的样子；由太平间和私人公司做。小说人物说两条路从头一个钟头起就分开，这个说法方向有依据，细节未核。">
<text x="20.0" y="24.0" font-size="14" class="gt">两门手艺</text>
<rect class="wash" x="20.0" y="40.0" width="176.0" height="448.0" rx="3"/>
<rect class="l thin" x="20.0" y="40.0" width="176.0" height="448.0" rx="3" fill="none"/>
<rect class="l thin" x="204.0" y="40.0" width="176.0" height="448.0" rx="3" fill="none"/>
<text x="30.0" y="64.0" font-size="14" class="gt">长期保存</text>
<text x="214.0" y="64.0" font-size="14" class="gt">临时防腐</text>
<text x="30.0" y="100.0" font-size="12">为谁</text>
<text x="214.0" y="100.0" font-size="12">为谁</text>
<text x="40.0" y="120.0" font-size="12">国家</text>
<text x="224.0" y="120.0" font-size="12">家属</text>
<text x="30.0" y="148.0" font-size="12">管多久</text>
<text x="214.0" y="148.0" font-size="12">管多久</text>
<text x="40.0" y="168.0" font-size="12">不设期限</text>
<text x="224.0" y="168.0" font-size="12">到下葬，几天</text>
<text x="30.0" y="196.0" font-size="12">头一遍</text>
<text x="214.0" y="196.0" font-size="12">头一遍</text>
<text x="40.0" y="216.0" font-size="12">几个月</text>
<text x="224.0" y="216.0" font-size="12">几个钟头到几天</text>
<text x="30.0" y="244.0" font-size="12">做完以后</text>
<text x="214.0" y="244.0" font-size="12">做完以后</text>
<text x="40.0" y="264.0" font-size="12">每周查看，每 18 个</text>
<text x="224.0" y="264.0" font-size="12">不再管</text>
<text x="40.0" y="284.0" font-size="12">月重做，停不得</text>
<text x="30.0" y="312.0" font-size="12">主要办法</text>
<text x="214.0" y="312.0" font-size="12">主要办法</text>
<text x="40.0" y="332.0" font-size="12">反复浸泡溶液，</text>
<text x="224.0" y="332.0" font-size="12">经血管灌注药水，</text>
<text x="40.0" y="352.0" font-size="12">替换材料，修形</text>
<text x="224.0" y="352.0" font-size="12">修补，化妆</text>
<text x="30.0" y="380.0" font-size="12">保什么</text>
<text x="214.0" y="380.0" font-size="12">保什么</text>
<text x="40.0" y="400.0" font-size="12">样子连同手感：</text>
<text x="224.0" y="400.0" font-size="12">告别那天的样子</text>
<text x="40.0" y="420.0" font-size="12">弹性、关节、体重</text>
<text x="30.0" y="448.0" font-size="12">谁在做</text>
<text x="214.0" y="448.0" font-size="12">谁在做</text>
<text x="40.0" y="468.0" font-size="12">陵墓实验室</text>
<text x="224.0" y="468.0" font-size="12">太平间、私人公司</text>
<text x="20.0" y="514.0" font-size="12">小说人物说：先灌了福尔马林，组织就定住了，</text>
<text x="20.0" y="534.0" font-size="12">不能再照长期保存的办法做。</text>
<text x="20.0" y="554.0" font-size="12">这个说法方向有依据，细节未核。</text>
</svg>
