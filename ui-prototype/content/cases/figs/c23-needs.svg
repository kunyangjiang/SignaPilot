<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-label="小说里各人买的是什么。国家买一个不变的样子，没有期限。瓦列拉买摆出来的体面，三天。会计的妻子买等儿子赶回来，四天。梁赞的母亲要看一眼、握一握手，四十分钟。格列布的母亲要丈夫像样一点，到出殡为止。格列布的归纳是：名目不同，都是让人晚几天看见那件事。妮娜的做法相反：脸可以好看，手留着是凉的。人物和数字都是小说虚构。">
<text x="20.0" y="24.0" font-size="14" class="gt">各人买的是什么（小说里的归纳）</text>
<rect class="wash" x="20.0" y="44.0" width="360.0" height="46.0" rx="3"/>
<rect class="l thin" x="20.0" y="44.0" width="360.0" height="46.0" rx="3" fill="none"/>
<text x="30.0" y="72.0" font-size="13">国家</text>
<text x="150.0" y="72.0" font-size="12">一个不变的样子</text>
<text x="300.0" y="72.0" font-size="12">没有期限</text>
<rect class="l thin" x="20.0" y="98.0" width="360.0" height="46.0" rx="3" fill="none"/>
<text x="30.0" y="126.0" font-size="13">瓦列拉</text>
<text x="150.0" y="126.0" font-size="12">摆出来的体面</text>
<text x="300.0" y="126.0" font-size="12">三天</text>
<rect class="l thin" x="20.0" y="152.0" width="360.0" height="46.0" rx="3" fill="none"/>
<text x="30.0" y="180.0" font-size="13">会计的妻子</text>
<text x="150.0" y="180.0" font-size="12">等儿子赶回来</text>
<text x="300.0" y="180.0" font-size="12">四天</text>
<rect class="l thin" x="20.0" y="206.0" width="360.0" height="46.0" rx="3" fill="none"/>
<text x="30.0" y="234.0" font-size="13">梁赞的母亲</text>
<text x="150.0" y="234.0" font-size="12">看一眼，握一握手</text>
<text x="300.0" y="234.0" font-size="12">四十分钟</text>
<rect class="l thin" x="20.0" y="260.0" width="360.0" height="46.0" rx="3" fill="none"/>
<text x="30.0" y="288.0" font-size="13">格列布的母亲</text>
<text x="150.0" y="288.0" font-size="12">丈夫“像样一点”</text>
<text x="300.0" y="288.0" font-size="12">到出殡</text>
<text x="20.0" y="330.0" font-size="12">格列布的归纳：名目不同，都是让人晚几天看见那件事。</text>
<text x="20.0" y="350.0" font-size="12">妮娜的做法相反：脸可以好看，手留着是凉的。</text>
<text x="20.0" y="376.0" font-size="12">人物和数字都是小说虚构。</text>
</svg>
