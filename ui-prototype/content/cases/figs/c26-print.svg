<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 382" role="img" aria-label="示意柱状图：第一块样品比第二块多出来的 D 型氨基酸分子数，按异缬氨酸等于 1 折算：丙氨酸 3，谷氨酸 2，缬氨酸 1，天冬氨酸 1，异缬氨酸 1，不分左右的 Aib 多出 2，甘氨酸比不出来。下面用圆点画 LP-11 的成分：D 丙氨酸 3 个，D 谷氨酸 2 个，D 缬氨酸、D 天冬氨酸、D 异缬氨酸各 1 个，Aib 2 个，甘氨酸 2 个，两行对得上。L 型那一边两回几乎一样。含 Aib 和异缬氨酸的键难水解，比例只是大约。3 月 26 日的天平擦拭样里 D 型远多于 L 型，异缬氨酸全是 D。LP-11 和所有数字都是小说虚构。">
