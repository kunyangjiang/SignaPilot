<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" role="img" aria-label="一张牒的正面和背面。正面是簿房写的牒：抬头“河口追班”，正文“河口胡氏二姑，年八十八，限七月十五日子时”，落款主簿陆，盖着簿房的印；左下角是差役盖的“到”字。抬头少了一个“新”字。背面透出正面的反字，中间是一张旧包袱封皮：“上奉先父收用，孝男姚大”，是胡老纸代写的，只有称呼没有名字，所以进了投房的无主堆，后来被卖给簿房当纸用。">
<text x="30" y="22" font-size="14" class="gt">正面</text>
<rect class="l" x="30" y="32" width="210" height="150"/>
<rect class="wash" style="opacity:.35" x="78" y="44" width="34" height="22"/>
<text x="44" y="61" font-size="15">牒　河口追班</text>
<text x="44" y="88" font-size="13">河口胡氏二姑　年八十八</text>
<text x="44" y="112" font-size="13">限七月十五日子时</text>
<text x="44" y="136" font-size="13">主簿陆　押</text>
<rect class="gl" x="190" y="122" width="36" height="36"/>
<text x="208" y="146" font-size="15" text-anchor="middle" class="gt">印</text>
<rect class="l" x="44" y="148" width="26" height="26"/>
<text x="57" y="167" font-size="15" text-anchor="middle">到</text>
<path class="l thin" d="M112 55 H252"/>
<text x="258" y="52" font-size="13">少了一个</text>
<text x="258" y="70" font-size="13">“新”字</text>
<path class="l thin" d="M70 161 H252"/>
<text x="258" y="158" font-size="13">先盖了到，</text>
<text x="258" y="176" font-size="13">牒就归他了</text>
<text x="30" y="212" font-size="14" class="gt">背面</text>
<rect class="l" x="30" y="222" width="210" height="150"/>
<g transform="translate(270 0) scale(-1 1)" style="opacity:.22"><text x="44" y="251" font-size="15">牒　河口追班</text><text x="44" y="278" font-size="13">河口胡氏二姑　年八十八</text><text x="44" y="302" font-size="13">限七月十五日子时</text></g>
<rect class="l" x="62" y="262" width="146" height="78" stroke-dasharray="5 4"/>
<text x="135" y="293" font-size="14" text-anchor="middle">上奉　先父　收用</text>
<text x="135" y="322" font-size="14" text-anchor="middle">孝男姚大</text>
<path class="l thin" d="M208 290 H252"/>
<text x="258" y="272" font-size="13">胡老纸代写的</text>
<text x="258" y="290" font-size="13">包袱封皮。</text>
<text x="258" y="316" font-size="13">只有称呼，</text>
<text x="258" y="334" font-size="13">没有名字，</text>
<text x="258" y="352" font-size="13">进了无主堆。</text>
<text x="30" y="402" font-size="14">阴间没有新纸：这张牒写在旧包袱皮的背面。</text>
</svg>
