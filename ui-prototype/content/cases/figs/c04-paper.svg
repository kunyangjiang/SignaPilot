<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="小说中虚构的婚书示意：三折红纸，竖写三行。新娘一行最后的死期是后来添的，墨色不同">
  <g class="l" filter="url(#wob2)">
    <rect x="150" y="24" width="420" height="400"/>
    <path d="M290 24v400M430 24v400" stroke-dasharray="4 7"/>
  </g>
  <!-- each glyph is placed at its own x/y so the column renders the same in every browser -->
  <g font-size="18" text-anchor="middle">
    <text x="500" y="54">乾</text><text x="500" y="76">造</text><text x="500" y="120">祁</text><text x="500" y="142">晓</text><text x="500" y="164">军</text><text x="500" y="208">壬</text><text x="500" y="230">申</text><text x="500" y="252">年</text><text x="500" y="274">生</text><text x="500" y="318">十</text><text x="500" y="340">月</text><text x="500" y="362">殁</text>
    <text x="360" y="54">坤</text><text x="360" y="76">造</text><text x="360" y="120">李</text><text x="360" y="142">改</text><text x="360" y="164">花</text><text x="360" y="208">己</text><text x="360" y="230">卯</text><text x="360" y="252">年</text><text x="360" y="274">生</text>
    <text x="220" y="54">两</text><text x="220" y="76">姓</text><text x="220" y="98">合</text><text x="220" y="120">婚</text><text x="220" y="164">同</text><text x="220" y="186">归</text><text x="220" y="208">一</text><text x="220" y="230">茔</text><text x="220" y="274">永</text><text x="220" y="296">为</text><text x="220" y="318">眷</text><text x="220" y="340">属</text>
  </g>
  <g class="gt" font-size="18" text-anchor="middle"><text x="360" y="318">腊</text><text x="360" y="340">月</text><text x="360" y="362">十</text><text x="360" y="384">三</text><text x="360" y="406">殁</text></g>
  <g class="gl" filter="url(#wob2)"><path d="M360 426v18"/></g>
  <text class="sm gt" text-anchor="middle" x="360" y="462">金色的五个字是后添的。写婚书那天，她还活着。</text>
  <text class="sm" text-anchor="middle" x="360" y="486">示意图。小说虚构的文书，不是任何真实婚书的样式。</text>
</svg>
