<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 358" role="img" aria-label="庙祝的本子：掷筊记录，和“踩到”一栏的三十七样失物">
<text x="20.0" y="24.0" font-size="14" class="gt">黄水生的本子</text>
<text x="20.0" y="52.0" font-size="12">正月初九</text>
<text x="92.0" y="52.0" font-size="12">公交站单下雨，三分钟。龙王？发怒？</text>
<text x="20.0" y="76.0" font-size="12">正月初十</text>
<text x="92.0" y="76.0" font-size="12">问了四尊，四个阴筊。珠子丢了。</text>
<text x="20.0" y="100.0" font-size="12">正月初十</text>
<text x="92.0" y="100.0" font-size="12">大道公，两平。笑筊。（小颜说是阴的）</text>
<text x="20.0" y="124.0" font-size="12">正月十二</text>
<text x="92.0" y="124.0" font-size="12">魁星歪了，垫收据。</text>
<text x="20.0" y="148.0" font-size="12">正月十四</text>
<text x="92.0" y="148.0" font-size="12">漏雨三处，接了一夜水。</text>
<text x="20.0" y="172.0" font-size="12">正月十八</text>
<text x="92.0" y="172.0" font-size="12">八张纸化龙。神不让改。</text>
<text x="20.0" y="196.0" font-size="12">正月廿二</text>
<text x="92.0" y="196.0" font-size="12">桌腿垫收据。砖缝出沙。敲砖，一块空。</text>
<text x="20.0" y="220.0" font-size="12">正月廿三</text>
<text x="92.0" y="220.0" font-size="12">二十一个圣筊。门外，圣。</text>
<path class="l thin" fill="none" d="M20 248H380"/>
<text x="20.0" y="272.0" font-size="13">踩到：</text>
<text x="70.0" y="272.0" font-size="12">助听器</text>
<text x="174.0" y="272.0" font-size="12">电动车钥匙</text>
<text x="278.0" y="272.0" font-size="12">手机</text>
<text x="70.0" y="294.0" font-size="12">黑伞</text>
<text x="174.0" y="294.0" font-size="12">公交卡</text>
<text x="278.0" y="294.0" font-size="12">老花镜</text>
<text x="70.0" y="316.0" font-size="12">门禁卡</text>
<text x="174.0" y="316.0" font-size="12">耳环</text>
<text x="278.0" y="316.0" font-size="12">……</text>
<text x="20.0" y="344.0" font-size="12">一共三十七样。都是在地上找着的。地上的事，归土地。树是树。</text>
</svg>
