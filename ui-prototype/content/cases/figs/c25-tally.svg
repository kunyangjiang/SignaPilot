<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" role="img" aria-label="小说示例：麦记在表格背面的数。头一轮走访 40 户，问家里的男人有没有被压过：答有的 23 户，答没有的 14 户，说不清的 3 户。答有的 23 户里，本人讲的 15 户共 17 个人，家里人代讲的 8 户。第二轮走到 36 户，问这些天夜里睡得怎么样：说起被压的 31 户，有人守夜的 17 户。两轮问的不是同一句话，答话的也未必是同一个人，所以 23 和 31 不能直接相比；多出来的 8 户里，3 户自己说看了报才知道那叫什么，5 户不知道。守夜的事头一轮没有问过，从前是几户不知道。亲口讲的 17 个人都活着，因为活着才能讲，这不等于被压过的人不会死。这些数是小说里编的，不是调查结果。">
<text x="20.0" y="24.0" font-size="14" class="gt">表的背面：麦记的数（小说示例）</text>
<text x="20.0" y="48.0" font-size="13">头一轮：40 户，问“家里的男人有没有被压过”</text>
<rect class="wash" x="20.0" y="58.0" width="184.0" height="14.0" rx="3"/>
<rect class="l thin" x="20.0" y="58.0" width="184.0" height="14.0" rx="3" fill="none"/>
<rect class="l thin" x="204.0" y="58.0" width="112.0" height="14.0" rx="3" fill="none"/>
<rect class="l thin" x="316.0" y="58.0" width="24.0" height="14.0" rx="3" fill="none"/>
<text x="20.0" y="90.0" font-size="12">有 23 户</text>
<text x="204.0" y="90.0" font-size="12">没有 14 户</text>
<text x="380.0" y="90.0" font-size="12" text-anchor="end">说不清 3</text>
<text x="20.0" y="120.0" font-size="13">“有”的 23 户里，是谁说的</text>
<rect class="wash" x="20.0" y="130.0" width="120.0" height="14.0" rx="3"/>
<rect class="l thin" x="20.0" y="130.0" width="120.0" height="14.0" rx="3" fill="none"/>
<rect class="l thin" x="140.0" y="130.0" width="64.0" height="14.0" rx="3" fill="none"/>
<text x="20.0" y="162.0" font-size="12">本人讲的 15 户（17 个人）</text>
<text x="204.0" y="162.0" font-size="12">家里人代讲 8 户</text>
<text x="20.0" y="192.0" font-size="13">第二轮：走到 36 户，问“这些天夜里睡得怎么样”</text>
<rect class="wash" x="20.0" y="202.0" width="248.0" height="14.0" rx="3"/>
<rect class="l thin" x="20.0" y="202.0" width="248.0" height="14.0" rx="3" fill="none"/>
<rect class="l thin" x="268.0" y="202.0" width="40.0" height="14.0" rx="3" fill="none"/>
<text x="20.0" y="234.0" font-size="12">说起被压的 31 户</text>
<text x="380.0" y="234.0" font-size="12" text-anchor="end">有人守夜的 17 户</text>
<path class="l thin" fill="none" d="M20 250H380"/>
<text x="20.0" y="270.0" font-size="12">两轮问的不是同一句话，答话的也未必是同一个人，</text>
<text x="20.0" y="290.0" font-size="12">所以 23 和 31 不能直接相比。多出来的 8 户里，</text>
<text x="20.0" y="310.0" font-size="12">3 户自己说“看了报才知道那叫什么”，5 户不知道。</text>
<text x="20.0" y="330.0" font-size="12">守夜的事头一轮没有问过，从前是几户，不知道。</text>
<text x="20.0" y="350.0" font-size="12">亲口讲的 17 个人都活着：活着才能讲。</text>
<text x="20.0" y="370.0" font-size="12">这不等于被压过的人不会死。</text>
<text x="20.0" y="390.0" font-size="12">这些数是小说里编的，不是调查结果。</text>
</svg>
