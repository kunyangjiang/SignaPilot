<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 658" role="img" aria-label="1910 年 9 月 14 日实验的每一步。前一日：福来给千鹤子一根练习用铅管，内为盗丸射，另把一根样品交给山川一方。准备：山川备铅管 20 根，各封三字，另留底单；管上不编号无记号是小说设定。交付：从匣中取一根交给千鹤子。透视：她上二楼，在屏风后，两位立会人在别室，没有人看得见她的手。回答：她说出盗丸射。开封：当众割开，纸条上是盗丸射，结果相符。核对：底单上没有这三个字，这根管子不是山川的二十根之一。当场：众人推测样品混进了匣子。当夜：千鹤子对福来说，交出去的是练习用的那根。点数：匣中余数二十，只有濑川一人数过，是小说虚构。">
<text x="20.0" y="24.0" font-size="14" class="gt">1910 年 9 月 14 日：实验的每一步</text>
<rect class="l thin" x="20.0" y="44.0" width="360.0" height="56.0" rx="3" fill="none"/>
<text x="30.0" y="67.0" font-size="12">前一日</text>
<text x="84.0" y="67.0" font-size="12">福来给千鹤子一根练习用铅管（盗丸射）；</text>
<text x="84.0" y="87.0" font-size="12">另把一根样品交给山川一方</text>
<path class="l thin" fill="none" d="M50 100v8"/>
<rect class="wash" x="20.0" y="108.0" width="360.0" height="56.0" rx="3"/>
<rect class="l thin" x="20.0" y="108.0" width="360.0" height="56.0" rx="3" fill="none"/>
<text x="30.0" y="131.0" font-size="12">准备</text>
<text x="84.0" y="131.0" font-size="12">山川备铅管 20 根，各封三字；另留底单</text>
<text x="84.0" y="151.0" font-size="12">管上不编号、无记号（小说设定）</text>
<path class="l thin" fill="none" d="M50 164v8"/>
<rect class="l thin" x="20.0" y="172.0" width="360.0" height="38.0" rx="3" fill="none"/>
<text x="30.0" y="195.0" font-size="12">交付</text>
<text x="84.0" y="195.0" font-size="12">从匣中取一根，交给千鹤子</text>
<path class="l thin" fill="none" d="M50 210v8"/>
<rect class="l thin" x="20.0" y="218.0" width="360.0" height="56.0" rx="3" fill="none"/>
<text x="30.0" y="241.0" font-size="12">透视</text>
<text x="84.0" y="241.0" font-size="12">她上二楼，在屏风后；两位立会人在别室</text>
<text x="84.0" y="261.0" font-size="12">没有人看得见她的手</text>
<path class="l thin" fill="none" d="M50 274v8"/>
<rect class="l thin" x="20.0" y="282.0" width="360.0" height="38.0" rx="3" fill="none"/>
<text x="30.0" y="305.0" font-size="12">回答</text>
<text x="84.0" y="305.0" font-size="12">她说出三个字：盗丸射</text>
<path class="l thin" fill="none" d="M50 320v8"/>
<rect class="l thin" x="20.0" y="328.0" width="360.0" height="56.0" rx="3" fill="none"/>
<text x="30.0" y="351.0" font-size="12">开封</text>
<text x="84.0" y="351.0" font-size="12">当众割开：纸条上是“盗丸射”</text>
<text x="84.0" y="371.0" font-size="12">结果相符</text>
<path class="l thin" fill="none" d="M50 384v8"/>
<rect class="l thin" x="20.0" y="392.0" width="360.0" height="56.0" rx="3" fill="none"/>
<text x="30.0" y="415.0" font-size="12">核对</text>
<text x="84.0" y="415.0" font-size="12">底单上没有这三个字</text>
<text x="84.0" y="435.0" font-size="12">这根管子不是山川的二十根之一</text>
<path class="l thin" fill="none" d="M50 448v8"/>
<rect class="l thin" x="20.0" y="456.0" width="360.0" height="38.0" rx="3" fill="none"/>
<text x="30.0" y="479.0" font-size="12">当场</text>
<text x="84.0" y="479.0" font-size="12">众人推测：样品混进了匣子</text>
<path class="l thin" fill="none" d="M50 494v8"/>
<rect class="l thin" x="20.0" y="502.0" width="360.0" height="38.0" rx="3" fill="none"/>
<text x="30.0" y="525.0" font-size="12">当夜</text>
<text x="84.0" y="525.0" font-size="12">千鹤子对福来说：交出去的是练习用的那根</text>
<path class="l thin" fill="none" d="M50 540v8"/>
<rect class="wash" x="20.0" y="548.0" width="360.0" height="56.0" rx="3"/>
<rect class="l thin" x="20.0" y="548.0" width="360.0" height="56.0" rx="3" fill="none"/>
<text x="30.0" y="571.0" font-size="12">点数</text>
<text x="84.0" y="571.0" font-size="12">匣中余数：二十</text>
<text x="84.0" y="591.0" font-size="12">只有濑川一人数过（小说虚构）</text>
<text x="20.0" y="624.0" font-size="12">浅底的两格是小说的设计，其余据国会图书馆资料</text>
<text x="20.0" y="644.0" font-size="12">和后人依当时报纸所作的考证。</text>
</svg>
