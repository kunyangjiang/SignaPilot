<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 590" role="img" aria-label="同一件事的三种来源对照。入院：记录是 4 月 30 日晚 9 时 45 分，发热、疼痛、咯血；家人说姐姐送去，皮肤发蓝；本人说皮下像有虫在爬。宣告死亡：记录是 5 月 2 日下午 1 时 15 分，两位医生；家人是姐姐在床边、二姐按指印；本人说动不了但听得见哭声和宣告。冷房：记录约 20 小时；本人没有提到。下葬：记录是 5 月 3 日上午 10 时；家人全家在场，十天后浇盖板；本人说钉子扎破右脸，飘在坟上。之后十八年：没有记录；没有人见过坟被打开；本人说被挖出，在北方两年，流浪十六年。">
<text x="20.0" y="24.0" font-size="14" class="gt">同一件事，三种来源</text>
<rect class="l thin" x="20.0" y="46.0" width="360.0" height="92.0" rx="3" fill="none"/>
<text x="30.0" y="66.0" font-size="13">入院（4 月 30 日）</text>
<text x="30.0" y="88.0" font-size="12">记录</text>
<text x="74.0" y="88.0" font-size="12">晚 9:45；发热、疼痛、咯血</text>
<text x="30.0" y="108.0" font-size="12">家人</text>
<text x="74.0" y="108.0" font-size="12">姐姐送去；皮肤发蓝</text>
<text x="30.0" y="128.0" font-size="12">本人</text>
<text x="74.0" y="128.0" font-size="12">皮下像有虫在爬</text>
<rect class="l thin" x="20.0" y="146.0" width="360.0" height="92.0" rx="3" fill="none"/>
<text x="30.0" y="166.0" font-size="13">宣告死亡（5 月 2 日）</text>
<text x="30.0" y="188.0" font-size="12">记录</text>
<text x="74.0" y="188.0" font-size="12">下午 1:15，两位医生</text>
<text x="30.0" y="208.0" font-size="12">家人</text>
<text x="74.0" y="208.0" font-size="12">姐姐在床边；二姐按指印</text>
<text x="30.0" y="228.0" font-size="12">本人</text>
<text x="74.0" y="228.0" font-size="12">动不了，但听得见哭声和宣告</text>
<rect class="l thin" x="20.0" y="246.0" width="360.0" height="92.0" rx="3" fill="none"/>
<text x="30.0" y="266.0" font-size="13">冷房</text>
<text x="30.0" y="288.0" font-size="12">记录</text>
<text x="74.0" y="288.0" font-size="12">约 20 小时</text>
<text x="30.0" y="308.0" font-size="12">家人</text>
<text x="74.0" y="308.0" font-size="12">（小说：姐姐送到门口）</text>
<text x="30.0" y="328.0" font-size="12">本人</text>
<text x="74.0" y="328.0" font-size="12">没有提到</text>
<rect class="l thin" x="20.0" y="346.0" width="360.0" height="92.0" rx="3" fill="none"/>
<text x="30.0" y="366.0" font-size="13">下葬（5 月 3 日）</text>
<text x="30.0" y="388.0" font-size="12">记录</text>
<text x="74.0" y="388.0" font-size="12">上午 10:00</text>
<text x="30.0" y="408.0" font-size="12">家人</text>
<text x="74.0" y="408.0" font-size="12">全家在场；十天后浇盖板</text>
<text x="30.0" y="428.0" font-size="12">本人</text>
<text x="74.0" y="428.0" font-size="12">钉子扎破右脸；飘在坟上</text>
<rect class="wash" x="20.0" y="446.0" width="360.0" height="92.0" rx="3"/>
<rect class="l thin" x="20.0" y="446.0" width="360.0" height="92.0" rx="3" fill="none"/>
<text x="30.0" y="466.0" font-size="13">之后十八年</text>
<text x="30.0" y="488.0" font-size="12">记录</text>
<text x="74.0" y="488.0" font-size="12">没有记录</text>
<text x="30.0" y="508.0" font-size="12">家人</text>
<text x="74.0" y="508.0" font-size="12">没有人见过坟被打开</text>
<text x="30.0" y="528.0" font-size="12">本人</text>
<text x="74.0" y="528.0" font-size="12">被挖出，北方两年，流浪十六年</text>
<text x="20.0" y="556.0" font-size="12">“记录”一栏的钟点据 Davis 转述的医院材料。</text>
<text x="20.0" y="576.0" font-size="12">三栏只在头两行互相碰得上；越往下，越只剩一栏有话。</text>
</svg>
