<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 584" role="img" aria-label="示意图：黑屋的两面墙。上面是对着门的那一面：一个点着许多星的圆，圆里有一条弧线，弧线上两个记号；三幅小画，一个人在挖，一个人弯腰捂着肚子，一个人躺下；一张眼睛挤紧、嘴张大的脸；一个方框，框里三片一般大的扇形叶子，叶尖朝里，围着正中一个小圆点；最底下一排七个圆，头一个全黑，第二个黑一半，第三个黑四分之一，往后每个都是前一个的一半，每两个圆之间刻着同一串记号。下面是右手墙上的一角：一条横线是地面，上面立着一块黑石和一个小人；地下很深处有横道，横道底下一排竖着的圆柱；每根圆柱伸出几道直线，朝四面散开，其中一道从地面上那个小人的身上穿了过去。">
