<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="卡片上的 23:38 如果是北京时间，修正后是 21:32 亥时；如果是新疆时间，修正后是 23:32，又回到子时">
  <g class="l" filter="url(#wob2)">
    <rect x="270" y="20" width="180" height="50" rx="8"/>
    <path d="M320 70L190 116M400 70L530 116"/>
    <rect x="80" y="118" width="220" height="46" rx="8"/>
    <rect x="420" y="118" width="220" height="46" rx="8"/>
    <path d="M530 164v30"/>
    <rect x="420" y="196" width="220" height="46" rx="8"/>
    <path d="M190 164v108M530 242v30"/>
    <path d="M190 272l-6-10M190 272l6-10M530 272l-6-10M530 272l6-10"/>
    <rect x="80" y="274" width="220" height="62" rx="8"/>
  </g>
  <g class="gl" filter="url(#wob2)">
    <rect x="420" y="274" width="220" height="62" rx="8"/>
    <path d="M640 304c58-30 62-230-186-264"/>
    <path d="M454 40l13-4M454 40l8 11"/>
  </g>
  <rect class="wash" x="420" y="274" width="220" height="62" rx="8"/>
  <g text-anchor="middle">
    <text font-size="19" x="360" y="52">卡片上写着 23:38</text>
    <text font-size="16" x="190" y="147">如果这是北京时间</text>
    <text font-size="16" x="530" y="147">如果这是新疆时间</text>
    <text font-size="16" x="530" y="225">等于北京时间次日 1:38</text>
    <text class="sm" x="190" y="222">减 2 小时 20 分</text>
    <text class="sm" x="190" y="242">加 14 分</text>
    <text class="sm" x="474" y="262">同样修正</text>
    <text font-size="20" x="190" y="302">21:32　亥时</text>
    <text class="sm" x="190" y="324">14 号，没有争议</text>
    <text font-size="20" class="gt" x="530" y="302">23:32　子时</text>
    <text class="sm gt" x="530" y="324">回到原来的问题</text>
    <text class="sm gt" x="672" y="150" transform="rotate(90 672 150)">绕了一圈</text>
  </g>
</svg>
