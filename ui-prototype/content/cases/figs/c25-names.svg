<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 498" role="img" aria-label="对照图：一件事，三个名字。第一个，突然、意外、夜间的死亡：美国疾病控制中心 1981 年起的，五条都对上才算一例，解剖找不出原因是其中一条；说话的是在场的家人和法医，说不了话的是死者本人。第二个，被压，赫蒙话 dab tsog：赫蒙人起的，年代说不清；指的是醒着、动不了、胸口有东西压；说话的是被压过又醒来的人，说不了话的是没有醒来的人。第三个，布鲁加达综合征：心脏科医生 1992 年以后起的，凭的是胸前导联上一种特别的心电图；说话的是活人的心电图和家族的基因，说不了话的是 1981 年已经下葬的人。三个名字各自圈住了一部分人，三个圈重叠多少没有人量过，因为能量的时候要问的人已经不在了。">
<text x="20.0" y="24.0" font-size="14" class="gt">一件事，三个名字</text>
<rect class="l thin" x="20.0" y="40.0" width="360.0" height="130.0" rx="3" fill="none"/>
<rect class="l thin" x="20.0" y="40.0" width="360.0" height="130.0" rx="3" fill="none"/>
<text x="32.0" y="62.0" font-size="13">突然、意外、夜间的死亡</text>
<text x="32.0" y="84.0" font-size="12">谁起的：美国疾病控制中心，1981 年。</text>
<text x="32.0" y="104.0" font-size="12">凭什么：五条都对上才算一例；</text>
<text x="32.0" y="124.0" font-size="12">解剖找不出原因是其中一条。</text>
<text x="32.0" y="144.0" font-size="12">谁在说话：在场的家人、法医。</text>
<text x="32.0" y="164.0" font-size="12">说不了话的：死者本人。</text>
<rect class="wash" x="20.0" y="182.0" width="360.0" height="110.0" rx="3"/>
<rect class="l thin" x="20.0" y="182.0" width="360.0" height="110.0" rx="3" fill="none"/>
<text x="32.0" y="204.0" font-size="13">被压（dab tsog）</text>
<text x="32.0" y="226.0" font-size="12">谁起的：赫蒙人，年代说不清。</text>
<text x="32.0" y="246.0" font-size="12">凭什么：醒着，动不了，胸口有东西压。</text>
<text x="32.0" y="266.0" font-size="12">谁在说话：被压过又醒来的人。</text>
<text x="32.0" y="286.0" font-size="12">说不了话的：没有醒来的人。</text>
<rect class="l thin" x="20.0" y="304.0" width="360.0" height="110.0" rx="3" fill="none"/>
<rect class="l thin" x="20.0" y="304.0" width="360.0" height="110.0" rx="3" fill="none"/>
<text x="32.0" y="326.0" font-size="13">布鲁加达综合征</text>
<text x="32.0" y="348.0" font-size="12">谁起的：心脏科医生，1992 年以后。</text>
<text x="32.0" y="368.0" font-size="12">凭什么：胸前导联上一种特别的心电图。</text>
<text x="32.0" y="388.0" font-size="12">谁在说话：活人的心电图、家族的基因。</text>
<text x="32.0" y="408.0" font-size="12">说不了话的：1981 年已经下葬的人。</text>
<text x="20.0" y="438.0" font-size="12">三个名字各自圈住了一部分人。三个圈重叠多少，</text>
<text x="20.0" y="458.0" font-size="12">没有人量过：能量的时候，要问的人已经不在了。</text>
<text x="20.0" y="478.0" font-size="12">第三个名字的来历这次只读到二手叙述。</text>
</svg>
