<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" role="img" aria-label="名字、辫梢和一张纸在不同场合的意义。名字：在蒙馆花名册里是谁来上学；在保甲册和甘结里是谁归官府管；在传闻的桩头纸片上是可以被摄走的魂；在供单和枷上的纸条里是犯人。辫梢：在剃头摊是日常的头发；在朝廷的发式之令下是归顺本朝的标记；在传闻里的术士手中是叫魂的凭借；在验辫清册里是有没有被害的证据。一张纸：鱼行的账簿记欠多少钱；向土地爷烧的黄纸是告阴状；衙门口的告示说并无此事，也教了人怎么做；解省的卷是收不回来的东西。">
<text x="20.0" y="24.0" font-size="14" class="gt">同一样东西，换一个场合</text>
<rect class="l thin" x="20.0" y="44.0" width="360.0" height="118.0" rx="3" fill="none"/>
<text x="30.0" y="66.0" font-size="14" class="gt">名字</text>
<text x="30.0" y="88.0" font-size="12">蒙馆花名册</text>
<path class="gl" fill="none" d="M168 84h14"/>
<text x="190.0" y="88.0" font-size="12">谁来上学</text>
<text x="30.0" y="110.0" font-size="12">保甲册、甘结</text>
<path class="gl" fill="none" d="M168 106h14"/>
<text x="190.0" y="110.0" font-size="12">谁归官府管</text>
<text x="30.0" y="132.0" font-size="12">桩头的纸片（传闻）</text>
<path class="gl" fill="none" d="M168 128h14"/>
<text x="190.0" y="132.0" font-size="12">可以被摄走的魂</text>
<text x="30.0" y="154.0" font-size="12">供单、枷上的纸条</text>
<path class="gl" fill="none" d="M168 150h14"/>
<text x="190.0" y="154.0" font-size="12">犯人</text>
<rect class="l thin" x="20.0" y="172.0" width="360.0" height="118.0" rx="3" fill="none"/>
<text x="30.0" y="194.0" font-size="14" class="gt">辫梢</text>
<text x="30.0" y="216.0" font-size="12">剃头摊</text>
<path class="gl" fill="none" d="M168 212h14"/>
<text x="190.0" y="216.0" font-size="12">日常的头发</text>
<text x="30.0" y="238.0" font-size="12">朝廷的发式之令</text>
<path class="gl" fill="none" d="M168 234h14"/>
<text x="190.0" y="238.0" font-size="12">归顺本朝的标记</text>
<text x="30.0" y="260.0" font-size="12">传闻里的术士手中</text>
<path class="gl" fill="none" d="M168 256h14"/>
<text x="190.0" y="260.0" font-size="12">叫魂的凭借</text>
<text x="30.0" y="282.0" font-size="12">验辫清册</text>
<path class="gl" fill="none" d="M168 278h14"/>
<text x="190.0" y="282.0" font-size="12">有没有被害的证据</text>
<rect class="l thin" x="20.0" y="300.0" width="360.0" height="118.0" rx="3" fill="none"/>
<text x="30.0" y="322.0" font-size="14" class="gt">一张纸</text>
<text x="30.0" y="344.0" font-size="12">鱼行的账簿</text>
<path class="gl" fill="none" d="M168 340h14"/>
<text x="190.0" y="344.0" font-size="12">欠多少钱</text>
<text x="30.0" y="366.0" font-size="12">向土地爷烧的黄纸</text>
<path class="gl" fill="none" d="M168 362h14"/>
<text x="190.0" y="366.0" font-size="12">告阴状</text>
<text x="30.0" y="388.0" font-size="12">衙门口的告示</text>
<path class="gl" fill="none" d="M168 384h14"/>
<text x="190.0" y="388.0" font-size="12">“并无此事”，也教了人怎么做</text>
<text x="30.0" y="410.0" font-size="12">解省的卷</text>
<path class="gl" fill="none" d="M168 406h14"/>
<text x="190.0" y="410.0" font-size="12">收不回来的东西</text>
<text x="20.0" y="438.0" font-size="12">东西没有变，变的是它被放进了哪一套办事的规矩。</text>
</svg>
