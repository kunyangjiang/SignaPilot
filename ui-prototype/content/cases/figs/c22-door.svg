<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-label="小说示意图：一道封门，各人看的地方。门楣上是墓主的名字，先知看名字；灰泥面上是一方一方压在湿泥上的墓区印，宰相的书记看印；库房书记看门前的土；警卫长看脚印；门的右下角有一块拆开又补上的地方，没有人看。封门抹灰压印有考古实例；看抹子方向、掺旧土、翻模做印是小说虚构。">
<text x="20.0" y="24.0" font-size="14" class="gt">一道封门：各人看的地方（小说示意）</text>
