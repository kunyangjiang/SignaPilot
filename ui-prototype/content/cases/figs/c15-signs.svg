<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" role="img" aria-label="七个私人符号：敲三下、画葱划一道、钥匙、沈家门照片、“端面的”、捏脸、摸左耳垂。每个符号的来源、意义变化和结局，其中前三个在关键时刻被丈夫误读，摸左耳垂的意思只有她知道。">
<text x="20.0" y="24.0" font-size="14" class="gt">七个私人符号的来路和去向</text>
<text x="20.0" y="52.0" font-size="14">敲三下</text>
<text x="130.0" y="52.0" font-size="12">2003 年，出菜口；他左耳不灵</text>
<text x="130.0" y="70.0" font-size="13">过来 → 端走 → 我来</text>
<text x="130.0" y="88.0" font-size="12">被读成“端走”；最后只剩节奏</text>
<path class="gl" fill="none" d="M120 83h5"/>
<path class="l thin" fill="none" d="M20 94H380"/>
<text x="20.0" y="110.0" font-size="14">画葱，划一道</text>
<text x="130.0" y="110.0" font-size="12">2014 年，点单纸</text>
<text x="130.0" y="128.0" font-size="13">免青 → 不要</text>
<text x="130.0" y="146.0" font-size="12">被读成“不要葱”“画着玩”</text>
<path class="gl" fill="none" d="M120 141h5"/>
<path class="l thin" fill="none" d="M20 152H380"/>
<text x="20.0" y="168.0" font-size="14">钥匙</text>
<text x="130.0" y="168.0" font-size="12">面馆卷帘门</text>
<text x="130.0" y="186.0" font-size="13">店 → 你别管 → 面馆交给阿葛开</text>
<text x="130.0" y="204.0" font-size="12">被当成症状；最后只是“该在那里”</text>
<path class="gl" fill="none" d="M120 199h5"/>
<path class="l thin" fill="none" d="M20 210H380"/>
<text x="20.0" y="226.0" font-size="14">沈家门照片</text>
<text x="130.0" y="226.0" font-size="12">1988 年，婚后第二天</text>
<text x="130.0" y="244.0" font-size="13">我们俩 → 以前 → 海 → 蓝的</text>
<text x="130.0" y="262.0" font-size="12">最后是“人”</text>
<path class="gl" fill="none" d="M120 257h5"/>
<path class="l thin" fill="none" d="M20 268H380"/>
<text x="20.0" y="284.0" font-size="14">“端面的”</text>
<text x="130.0" y="284.0" font-size="12">2003 年起，骂他的话</text>
<text x="130.0" y="302.0" font-size="13">他 → 叫他做任何事</text>
<text x="130.0" y="320.0" font-size="12">最后指任何端饭来的人</text>
<path class="gl" fill="none" d="M120 315h5"/>
<path class="l thin" fill="none" d="M20 326H380"/>
<text x="20.0" y="342.0" font-size="14">捏脸</text>
<text x="130.0" y="342.0" font-size="12">她自己编的</text>
<text x="130.0" y="360.0" font-size="13">许乐</text>
<text x="130.0" y="378.0" font-size="12">没能接替旧词，自己也松了</text>
<path class="gl" fill="none" d="M120 373h5"/>
<path class="l thin" fill="none" d="M20 384H380"/>
<text x="20.0" y="400.0" font-size="14">摸左耳垂</text>
<text x="130.0" y="400.0" font-size="12">？</text>
<text x="130.0" y="418.0" font-size="13">？</text>
<text x="130.0" y="436.0" font-size="12">只有她知道</text>
<path class="gl" fill="none" d="M120 431h5"/>
</svg>
