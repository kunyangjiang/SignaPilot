<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" role="img" aria-label="1909 至 1913 年时间线。1909 年 8 月 14 日东京朝日首次报道透见法；1910 年 2 月今村在熊本实验、福来的通信实验；4 月 6 日千鹤子与河地协议离婚；4 月 10 日前后福来、今村在熊本清原家实验；4 月 25 日福来在东京的心理学特别会上报告；9 月 5 日京都铅管实验未能透视；9 月 14 日东京大桥邸，盗丸射；9 月 15 日对记者、17 日对学者，道德天；11 月 17 至 18 日熊本骰子实验，五回中三回；1911 年 1 月 8 日丸龟干板失踪，实为忘装；1 月 18 至 19 日千鹤子服毒，次日清晨去世；2 月 26 日长尾郁子病故；1913 年 8 月福来《透视与念写》出版，10 月休职。">
<text x="20.0" y="24.0" font-size="14" class="gt">1909—1913 年</text>
<path class="l thin" fill="none" d="M28 46V410"/>
<circle class="l" cx="28" cy="48" r="3.5" fill="none"/>
<text x="42.0" y="52.0" font-size="12">1909.8.14</text>
<text x="150.0" y="52.0" font-size="12">《东京朝日》首次报道“透见法”</text>
<circle class="l" cx="28" cy="78" r="3.5" fill="none"/>
<text x="42.0" y="82.0" font-size="12">1910.2</text>
<text x="150.0" y="82.0" font-size="12">今村在熊本实验；福来的通信实验</text>
<circle class="l" cx="28" cy="108" r="3.5" fill="none"/>
<text x="42.0" y="112.0" font-size="12">1910.4.6</text>
<text x="150.0" y="112.0" font-size="12">千鹤子与河地协议离婚</text>
<circle class="l" cx="28" cy="138" r="3.5" fill="none"/>
<text x="42.0" y="142.0" font-size="12">1910.4.10 前后</text>
<text x="150.0" y="142.0" font-size="12">福来、今村在熊本清原家实验</text>
<circle class="l" cx="28" cy="168" r="3.5" fill="none"/>
<text x="42.0" y="172.0" font-size="12">1910.4.25</text>
<text x="150.0" y="172.0" font-size="12">福来在东京的心理学特别会上报告</text>
<circle class="l" cx="28" cy="198" r="3.5" fill="none"/>
<text x="42.0" y="202.0" font-size="12">1910.9.5</text>
<text x="150.0" y="202.0" font-size="12">京都：铅管实验，未能透视</text>
<circle class="gdot" cx="28" cy="228" r="3.5"/>
<text x="42.0" y="232.0" font-size="12">1910.9.14</text>
<text x="150.0" y="232.0" font-size="13">东京大桥邸：盗丸射</text>
<circle class="l" cx="28" cy="258" r="3.5" fill="none"/>
<text x="42.0" y="262.0" font-size="12">1910.9.15 / 17</text>
<text x="150.0" y="262.0" font-size="12">对记者；对学者：道德天</text>
<circle class="l" cx="28" cy="288" r="3.5" fill="none"/>
<text x="42.0" y="292.0" font-size="12">1910.11.17—18</text>
<text x="150.0" y="292.0" font-size="12">熊本：骰子实验，五回中三回</text>
<circle class="l" cx="28" cy="318" r="3.5" fill="none"/>
<text x="42.0" y="322.0" font-size="12">1911.1.8</text>
<text x="150.0" y="322.0" font-size="12">丸龟：干板“失踪”，实为忘装</text>
<circle class="gdot" cx="28" cy="348" r="3.5"/>
<text x="42.0" y="352.0" font-size="12">1911.1.18—19</text>
<text x="150.0" y="352.0" font-size="13">千鹤子服毒，次日清晨去世</text>
<circle class="l" cx="28" cy="378" r="3.5" fill="none"/>
<text x="42.0" y="382.0" font-size="12">1911.2.26</text>
<text x="150.0" y="382.0" font-size="12">长尾郁子病故</text>
<circle class="l" cx="28" cy="408" r="3.5" fill="none"/>
<text x="42.0" y="412.0" font-size="12">1913.8</text>
<text x="150.0" y="412.0" font-size="12">福来《透视与念写》出版；10 月休职</text>
<path class="l thin" fill="none" d="M20 434H380"/>
<text x="20.0" y="456.0" font-size="12">日期据日本国立国会图书馆“千里眼事件及其时代”</text>
<text x="20.0" y="476.0" font-size="12">及日文维基百科所引资料。</text>
</svg>
