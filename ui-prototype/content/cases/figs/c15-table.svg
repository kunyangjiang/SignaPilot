<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" role="img" aria-label="沟通本最后一页的表。敲三下：面好了，过来；端走（她写的）；我来（她改的，2023 年 10 月）。照片：我们俩；以前。钥匙：店；去店里；店里的事，你别管。捏脸：许乐。画葱，划一道：不要；2024 年 9 月 16 日，签字的时候她画了，我说她画着玩，按住了她的手。">
<text x="20.0" y="24.0" font-size="14" class="gt">沟通本最后一页</text>
<rect class="l" x="20" y="38" width="360" height="300" rx="2" fill="none"/>
<path class="l thin" fill="none" d="M115 38V338"/>
<text x="30.0" y="62.0" font-size="13">敲三下</text>
<text x="123.0" y="62.0" font-size="13">面好了，过来</text>
<text x="123.0" y="82.0" font-size="13">端走</text>
<path class="gl" fill="none" d="M123 87q2 -2.5 4 0q2 2.5 4 0q2 -2.5 4 0q2 2.5 4 0q2 -2.5 4 0q2 2.5 4 0q2 -2.5 4 0q2 2.5 4 0"/>
<text x="123.0" y="102.0" font-size="13">我来（她改的，2023 年 10 月）</text>
<path class="l thin" fill="none" d="M20 114H380"/>
<text x="30.0" y="128.0" font-size="13">照片</text>
<text x="123.0" y="128.0" font-size="13">我们俩</text>
<text x="123.0" y="148.0" font-size="13">以前</text>
<path class="l thin" fill="none" d="M20 160H380"/>
<text x="30.0" y="174.0" font-size="13">钥匙</text>
<text x="123.0" y="174.0" font-size="13">店</text>
<text x="123.0" y="194.0" font-size="13">去店里</text>
<text x="123.0" y="214.0" font-size="13">店里的事，你别管</text>
<path class="l thin" fill="none" d="M20 226H380"/>
<text x="30.0" y="240.0" font-size="13">捏脸</text>
<text x="123.0" y="240.0" font-size="13">许乐</text>
<path class="l thin" fill="none" d="M20 252H380"/>
<text x="30.0" y="266.0" font-size="13">画葱，划一道</text>
<text x="123.0" y="266.0" font-size="13">不要</text>
<text x="123.0" y="286.0" font-size="13">2024 年 9 月 16 日，签字的时候</text>
<text x="123.0" y="306.0" font-size="13">她画了。我说她画着玩，</text>
<text x="123.0" y="326.0" font-size="13">按住了她的手。</text>
<path class="gl" fill="none" d="M30 360q2 -2.5 4 0q2 2.5 4 0q2 -2.5 4 0q2 2.5 4 0q2 -2.5 4 0q2 2.5 4 0q2 -2.5 4 0q2 2.5 4 0"/>
<text x="70.0" y="364.0" font-size="12">波浪线：她写的字；其余是他写的</text>
</svg>
