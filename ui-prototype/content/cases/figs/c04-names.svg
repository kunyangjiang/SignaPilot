<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="同一个人在不同的人和文书那里被叫作不同的东西：婚书上是坤造李改花，媒人叫她新人，买的人家叫她媳妇，卖的人当她是货，刑法里是被害人，挂号单上是监护人，女儿叫她妈">
  <rect class="wash" x="280" y="160" width="160" height="60" rx="8"/>
  <g class="gl" filter="url(#wob2)"><rect x="280" y="160" width="160" height="60" rx="8"/></g>
  <g class="l" filter="url(#wob2)">
    <path d="M300 160L200 92M360 160V86M420 160L520 92M280 190H196M440 190H524M300 220L200 290M420 220L520 290"/>
  </g>
  <g text-anchor="middle">
    <text class="gt" font-size="20" x="360" y="186">尚小娥</text>
    <text class="sm gt" x="360" y="208">36 岁，洗碗工</text>
    <text font-size="17" x="150" y="76">“坤造　李改花”</text><text class="sm" x="150" y="96">婚书</text>
    <text font-size="17" x="360" y="62">“新人”</text><text class="sm" x="360" y="80">媒人</text>
    <text font-size="17" x="570" y="76">“媳妇”“新的”</text><text class="sm" x="570" y="96">买的人家</text>
    <text font-size="17" x="120" y="186">“她的东西”</text><text class="sm" x="120" y="206">送货的人</text>
    <text font-size="17" x="600" y="186">被害人</text><text class="sm" x="600" y="206">报案以后</text>
    <text font-size="17" x="150" y="312">“监护人”</text><text class="sm" x="150" y="332">急诊挂号单</text>
    <text font-size="17" x="570" y="312">“妈”</text><text class="sm" x="570" y="332">电话那头的孩子</text>
    <text class="sm" x="360" y="366">每换一个叫法，旁人对她能做的事就换一套。</text>
  </g>
</svg>
