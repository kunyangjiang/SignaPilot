<text x="70" y="268" font-size="14" text-anchor="middle">石钱</text>
<text x="70" y="286" font-size="13" text-anchor="middle">旧人埋下的</text>
<text x="70" y="306" font-size="13" class="gt" text-anchor="middle">叫人别过来</text>
<text x="200" y="268" font-size="14" text-anchor="middle">惊面牌</text>
<text x="200" y="286" font-size="13" text-anchor="middle">满做的</text>
<text x="200" y="306" font-size="13" class="gt" text-anchor="middle">把病喊走</text>
<text x="330" y="268" font-size="14" text-anchor="middle">新牌</text>
<text x="330" y="286" font-size="13" text-anchor="middle">霜降板那年</text>
<text x="330" y="306" font-size="13" class="gt" text-anchor="middle">多了一行字</text>
<text x="200" y="334" font-size="13" text-anchor="middle">新牌背面：“圈内勿掘。底下有铜，</text>
<text x="200" y="352" font-size="13" text-anchor="middle">铜外有泥，泥是挡水的。”</text>
</svg>
