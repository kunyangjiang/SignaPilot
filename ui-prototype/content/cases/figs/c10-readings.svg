<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="同一叶纸，七种读法：1574 年马蒂亚读作寻回失物的方法；1586 年卢克雷齐娅读作把女儿领回来的凭证；1589 年尼科洛读作必须藏起来的证据；1618 年安佐拉读作母亲；1768 年德·拉韦纳尔读作迷信的样本；1884 年拉克读作一件有残缺的商品；1976 年皮尔读作一个可以复原的结构。">
  <text x="200" y="26" font-size="15" text-anchor="middle">第 31 叶，七个人</text>
  <text x="24" y="60" font-size="16">1574</text><text x="88" y="60" font-size="16">马蒂亚</text><text x="88" y="82" font-size="15">把第 31 叶读作：寻回失物的方法</text><path class="l" style="stroke-width:1.1;opacity:.8" d="M24 94H376"/><text x="24" y="118" font-size="16">1586</text><text x="88" y="118" font-size="16">卢克雷齐娅</text><text x="88" y="140" font-size="15">把第 31 叶读作：把女儿领回来的凭证</text><path class="l" style="stroke-width:1.1;opacity:.8" d="M24 152H376"/><text x="24" y="176" font-size="16">1589</text><text x="88" y="176" font-size="16">尼科洛</text><text x="88" y="198" font-size="15">把第 31 叶读作：必须藏起来的证据</text><path class="l" style="stroke-width:1.1;opacity:.8" d="M24 210H376"/><text x="24" y="234" font-size="16">1618</text><text x="88" y="234" font-size="16">安佐拉</text><text x="88" y="256" font-size="15">把第 31 叶读作：母亲</text><path class="l" style="stroke-width:1.1;opacity:.8" d="M24 268H376"/><text x="24" y="292" font-size="16">1768</text><text x="88" y="292" font-size="16">德·拉韦纳尔</text><text x="88" y="314" font-size="15">把第 31 叶读作：迷信的样本</text><path class="l" style="stroke-width:1.1;opacity:.8" d="M24 326H376"/><text x="24" y="350" font-size="16">1884</text><text x="88" y="350" font-size="16">拉克</text><text x="88" y="372" font-size="15">把第 31 叶读作：一件有残缺的商品</text><path class="l" style="stroke-width:1.1;opacity:.8" d="M24 384H376"/><text x="24" y="408" font-size="16">1976</text><text x="88" y="408" font-size="16">皮尔</text><text x="88" y="430" font-size="15">把第 31 叶读作：一个可以复原的结构</text><path class="l" style="stroke-width:1.1;opacity:.8" d="M24 442H376"/>
</svg>
