<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 484" role="img" aria-label="图表：美国疾病控制中心 1981 年 12 月 4 日通报里的 38 例。按来的地方：老挝赫蒙人 25，老挝其他 8，越南 4，柬埔寨 1。按报告的州：加利福尼亚 12，明尼苏达 8，俄勒冈 5，华盛顿州 3，伊利诺伊 3，罗得岛 2，另外 5 个州各 1。37 个男人，1 个女人；年龄 19 到 63 岁，中位数 32.5；到美国 5 天到 52 个月，中位数 6 个月，34 人有记录。头一例 1977 年 7 月 15 日，最近一例 1981 年 10 月 28 日。29 例有人在场，都在夜里 9 点半到早上 7 点之间。36 例验完，30 例找不到死因。通报写：目击者未描述疼痛或做噩梦受惊的迹象。据 MMWR 第 30 卷第 47 期原文。">
