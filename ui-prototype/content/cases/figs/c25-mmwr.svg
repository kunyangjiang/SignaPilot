<text x="20.0" y="350.0" font-size="12">37 个男人，1 个女人。年龄 19 到 63 岁，中位数 32.5。</text>
<text x="20.0" y="370.0" font-size="12">到美国 5 天到 52 个月，中位数 6 个月（34 人有记录）。</text>
