<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" role="img" aria-label="黄宝珠本子上的神位页：龙边起，魁星、财神、月老、大道公、龙王、文昌、注生娘娘；土地公，大门左手">
<text x="20.0" y="24.0" font-size="14" class="gt">黄宝珠的本子，其中一页</text>
<rect class="l" x="30.0" y="40.0" width="340.0" height="214.0" rx="3" fill="none"/>
<path class="l thin" fill="none" d="M44 84H356"/>
<path class="l thin" fill="none" d="M44 110H356"/>
<path class="l thin" fill="none" d="M44 136H356"/>
<path class="l thin" fill="none" d="M44 162H356"/>
<path class="l thin" fill="none" d="M44 188H356"/>
<path class="l thin" fill="none" d="M44 214H356"/>
<path class="l thin" fill="none" d="M44 240H356"/>
<text x="48.0" y="78.0" font-size="14">合兴宫神位　宝珠记</text>
<text x="48.0" y="104.0" font-size="13">龙边起：魁星、财神、月老、大道公、</text>
<text x="48.0" y="130.0" font-size="13">　　　　龙王、文昌、注生娘娘。</text>
<text x="48.0" y="156.0" font-size="13">虎爷：桌下。</text>
<text x="48.0" y="182.0" font-size="13">土地公：大门左手。</text>
<text x="48.0" y="208.0" font-size="13">每礼拜一，挨个问一遍。</text>
<text x="48.0" y="234.0" font-size="13">香油钱，不涨。</text>
<text x="20.0" y="278.0" font-size="12">颜小满上个月拍过这一页，照着抄了施工单。</text>
</svg>
