<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 496" role="img" aria-label="三种解释各自够得着哪里。医学，由塞儒尔和杜永代表：说得通的是判定死亡可能出错、有中毒样的症状，但一份粉末化验为惰性，毒物说未获证实；够不着的是冷房 20 小时、谁开的坟、他是谁。宗教与社会，由梅齐拉代表：说得通的是被拿走了说不的那一点、两年不知姓名，以及他在村里孤立、得罪的人多；够不着的是不替任何人证明身份，没有人在场。家庭与利益，由两个姐姐和若萨法代表：说得通的是卖地之争、地由姐姐接种、认与不认的人都有地在里头；够不着的是被指的兄弟已故、没有物证。三种解释并不互相排斥，也没有一种能单独回答 1980 年出现的人是不是 1962 年下葬的人。">
<text x="20.0" y="24.0" font-size="14" class="gt">三种解释：各自够得着哪里</text>
<rect class="l thin" x="20.0" y="44.0" width="360.0" height="126.0" rx="3" fill="none"/>
<text x="30.0" y="66.0" font-size="14" class="gt">医学</text>
<text x="370.0" y="66.0" font-size="12" text-anchor="end">塞儒尔、杜永</text>
<text x="30.0" y="90.0" font-size="12">说得通</text>
<text x="86.0" y="90.0" font-size="12">判定死亡可能出错；有中毒样的症状</text>
<text x="86.0" y="110.0" font-size="12">一份粉末化验为惰性；毒物说未获证实</text>
<path class="l thin" fill="none" d="M30 120H370" stroke-dasharray="3 3"/>
<text x="30.0" y="142.0" font-size="12">够不着</text>
<text x="86.0" y="142.0" font-size="12">冷房 20 小时；谁开的坟；他是谁</text>
<rect class="l thin" x="20.0" y="180.0" width="360.0" height="126.0" rx="3" fill="none"/>
<text x="30.0" y="202.0" font-size="14" class="gt">宗教与社会</text>
<text x="370.0" y="202.0" font-size="12" text-anchor="end">梅齐拉</text>
<text x="30.0" y="226.0" font-size="12">说得通</text>
<text x="86.0" y="226.0" font-size="12">“被拿走了说不的那一点”：两年不知姓名</text>
<text x="86.0" y="246.0" font-size="12">他在村里孤立，得罪的人多</text>
<path class="l thin" fill="none" d="M30 256H370" stroke-dasharray="3 3"/>
<text x="30.0" y="278.0" font-size="12">够不着</text>
<text x="86.0" y="278.0" font-size="12">不替任何人证明身份；没有人在场</text>
<rect class="l thin" x="20.0" y="316.0" width="360.0" height="126.0" rx="3" fill="none"/>
<text x="30.0" y="338.0" font-size="14" class="gt">家庭与利益</text>
<text x="370.0" y="338.0" font-size="12" text-anchor="end">两个姐姐、若萨法</text>
<text x="30.0" y="362.0" font-size="12">说得通</text>
<text x="86.0" y="362.0" font-size="12">卖地之争；地由姐姐接种</text>
<text x="86.0" y="382.0" font-size="12">认与不认的人都有地在里头</text>
<path class="l thin" fill="none" d="M30 392H370" stroke-dasharray="3 3"/>
<text x="30.0" y="414.0" font-size="12">够不着</text>
<text x="86.0" y="414.0" font-size="12">被指的兄弟已故；没有物证</text>
<text x="20.0" y="462.0" font-size="12">三种解释并不互相排斥，也没有一种能单独回答</text>
<text x="20.0" y="482.0" font-size="12">“1980 年出现的人是不是 1962 年下葬的人”。</text>
</svg>
