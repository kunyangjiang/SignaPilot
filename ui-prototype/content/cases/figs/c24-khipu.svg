<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 608" role="img" aria-label="示意图：一根结绳怎么记数。一根粗的主绳横在上面，一头有粗结，是开头。主绳上垂下四根垂绳，垂绳上分百位、十位、个位三段。第一根垂绳在百位上有 6 个单结，是 600；它旁边系着两根附绳，一根百位 3 个结、十位 6 个结，是 360，另一根是虚线，百位 2 个结、十位 4 个结，是 240。第二根垂绳十位上 2 个结，是 20；它的附绳个位上一个绕 6 圈的长结，是 6。第三根十位上 4 个结，个位上一个绕 8 圈的长结，是 48。第四根个位上一个 8 字结，是 1。图例：单结在十位、百位上，打几个就是几；长结在个位上，绕几圈就是几，从 2 到 9；8 字结是个位上的 1；空着的一位是 0；附绳系在垂绳上，常用来记一个数里的各部分。图上的数目是小说里的，记数法依 20 世纪初 Locke 以来的研究；颜色和捻向的含义各地各件不同，图上不表示。">
<text x="20.0" y="24.0" font-size="14" class="gt">一根绳怎么记数（示意）</text>
<path class="l" fill="none" d="M24 60H376" stroke-width="4"/>
<circle class="gdot" cx="24" cy="60" r="6"/>
<text x="376.0" y="50.0" font-size="12" text-anchor="end">主绳</text>
<text x="36.0" y="50.0" font-size="12">粗结的一头是开头</text>
<rect class="wash" x="40.0" y="92.0" width="316.0" height="76.0" rx="3"/>
<text x="394.0" y="134.0" font-size="12" text-anchor="end">百位</text>
<rect class="wash" x="40.0" y="180.0" width="316.0" height="76.0" rx="3"/>
<text x="394.0" y="222.0" font-size="12" text-anchor="end">十位</text>
<rect class="wash" x="40.0" y="268.0" width="316.0" height="76.0" rx="3"/>
<text x="394.0" y="310.0" font-size="12" text-anchor="end">个位</text>
