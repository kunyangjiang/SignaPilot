<text x="235.0" y="400.0" font-size="12" text-anchor="middle">附绳</text>
<text x="282.0" y="382.0" font-size="13" text-anchor="middle">48</text>
<text x="282.0" y="400.0" font-size="12" text-anchor="middle">垂绳</text>
<text x="336.0" y="382.0" font-size="13" text-anchor="middle">1</text>
<text x="336.0" y="400.0" font-size="12" text-anchor="middle">垂绳</text>
<circle class="gdot" cx="28" cy="426" r="3.5"/>
<text x="40.0" y="430.0" font-size="12">单结：在十位、百位上，打几个就是几。</text>
<rect class="gdot" x="24" y="438" width="8" height="16" rx="3"/>
<text x="40.0" y="452.0" font-size="12">长结：在个位上，绕几圈就是几（2 到 9）。</text>
<circle class="l" cx="28" cy="465" r="3.2" fill="none"/>
<circle class="l" cx="28" cy="471.4" r="3.2" fill="none"/>
<text x="40.0" y="474.0" font-size="12">8 字结：个位上的 1。</text>
<text x="40.0" y="496.0" font-size="12">哪一位空着，那一位就是 0。</text>
<text x="40.0" y="518.0" font-size="12">附绳系在垂绳上，常用来记一个数里的各部分。</text>
<path class="l thin" fill="none" d="M20 532H380"/>
<text x="20.0" y="550.0" font-size="12">图上的数目是小说里的。记数法依 20 世纪初 Locke</text>
<text x="20.0" y="570.0" font-size="12">以来的研究。虚线表示另一种线；颜色、捻向的含义</text>
<text x="20.0" y="590.0" font-size="12">各地、各件不同，这里不表示。</text>
</svg>
