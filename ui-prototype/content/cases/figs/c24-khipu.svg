<text x="60.0" y="382.0" font-size="13" text-anchor="middle">600</text>
<text x="60.0" y="400.0" font-size="12" text-anchor="middle">垂绳</text>
<text x="95.0" y="382.0" font-size="13" text-anchor="middle">360</text>
<text x="95.0" y="400.0" font-size="12" text-anchor="middle">附绳</text>
<text x="130.0" y="382.0" font-size="13" text-anchor="middle">240</text>
<text x="130.0" y="400.0" font-size="12" text-anchor="middle">附绳</text>
