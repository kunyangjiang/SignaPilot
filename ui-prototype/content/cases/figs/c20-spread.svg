<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 522" role="img" aria-label="1768 年春夏叫魂传闻走过的地方，按日期排列，不是地图。1 月 22 日即阴历腊月初，浙江德清水门开工，2 月间传出贴名桩头的说法；3 月 25 至 26 日即阴历二月上旬，穆方周设局、沈士良求石匠；3 月底浙江安吉一名外乡生人被打死；4 月 3 日杭州净慈寺计兆美被围殴；4 月 8 日浙江萧山四僧被捕，同日一名白铁匠被打死；4 月 30 日江苏昆山、5 月 3 日苏州陆墓三丐被捕、5 月 5 日太湖胥口湖州僧人被围殴、5 月 28 日江苏安东；6 月 21 日湖北汉阳人群打死所谓妖人并焚尸。各地说法并不相同，没有证据表明出自同一伙人。">
<text x="20.0" y="24.0" font-size="14" class="gt">1768 年春夏：传闻走过的地方</text>
<path class="l thin" fill="none" d="M28 48V394"/>
<circle class="gdot" cx="28" cy="50" r="3.5"/>
<text x="42.0" y="54.0" font-size="12">1 月 22 日起</text>
<text x="122.0" y="54.0" font-size="13">浙江德清（阴历腊月初）</text>
<text x="122.0" y="72.0" font-size="12">水门开工；2 月间传出“贴名桩头”</text>
<circle class="l" cx="28" cy="88" r="3.5" fill="none"/>
<text x="42.0" y="92.0" font-size="12">3 月 25—26 日</text>
<text x="122.0" y="92.0" font-size="13">德清 / 塘栖（阴历二月上旬）</text>
<text x="122.0" y="110.0" font-size="12">穆方周设局；沈士良求石匠</text>
<circle class="l" cx="28" cy="126" r="3.5" fill="none"/>
<text x="42.0" y="130.0" font-size="12">3 月底</text>
<text x="122.0" y="130.0" font-size="13">浙江安吉</text>
<text x="122.0" y="148.0" font-size="12">外乡口音的生人被打死</text>
<circle class="gdot" cx="28" cy="164" r="3.5"/>
<text x="42.0" y="168.0" font-size="12">4 月 3 日</text>
<text x="122.0" y="168.0" font-size="13">杭州净慈寺</text>
<text x="122.0" y="186.0" font-size="12">计兆美被围殴，供出“吴某明”</text>
<circle class="gdot" cx="28" cy="202" r="3.5"/>
<text x="42.0" y="206.0" font-size="12">4 月 8 日</text>
<text x="122.0" y="206.0" font-size="13">浙江萧山</text>
<text x="122.0" y="224.0" font-size="12">四僧被捕；同日白铁匠被打死</text>
<circle class="l" cx="28" cy="240" r="3.5" fill="none"/>
<text x="42.0" y="244.0" font-size="12">4 月 30 日</text>
<text x="122.0" y="244.0" font-size="13">江苏昆山</text>
<text x="122.0" y="262.0" font-size="12">剪辫嫌疑，被殴后获释</text>
<circle class="gdot" cx="28" cy="278" r="3.5"/>
<text x="42.0" y="282.0" font-size="12">5 月 3 日</text>
<text x="122.0" y="282.0" font-size="13">苏州陆墓</text>
<text x="122.0" y="300.0" font-size="12">三丐被捕，一人死于狱中</text>
<circle class="l" cx="28" cy="316" r="3.5" fill="none"/>
<text x="42.0" y="320.0" font-size="12">5 月 5 日</text>
<text x="122.0" y="320.0" font-size="13">太湖胥口</text>
<text x="122.0" y="338.0" font-size="12">湖州僧人被围殴</text>
<circle class="l" cx="28" cy="354" r="3.5" fill="none"/>
<text x="42.0" y="358.0" font-size="12">5 月 28 日</text>
<text x="122.0" y="358.0" font-size="13">江苏安东</text>
<text x="122.0" y="376.0" font-size="12">剪辫嫌疑，被殴后获释</text>
<circle class="gdot" cx="28" cy="392" r="3.5"/>
<text x="42.0" y="396.0" font-size="12">6 月 21 日</text>
<text x="122.0" y="396.0" font-size="13">湖北汉阳</text>
<text x="122.0" y="414.0" font-size="12">看戏人群打死“妖人”并焚尸</text>
<path class="l thin" fill="none" d="M20 426H380"/>
<text x="20.0" y="448.0" font-size="12">按日期排列，不是地图。日期为公历，据孔飞力第一章；</text>
<text x="20.0" y="468.0" font-size="12">括号里的阴历是换算的，小说正文用阴历月份。</text>
<text x="20.0" y="488.0" font-size="12">各地的说法并不相同：德清是贴名字，萧山、苏州是剪辫梢。</text>
<text x="20.0" y="508.0" font-size="12">没有证据表明这些事件出自同一伙人。</text>
</svg>
