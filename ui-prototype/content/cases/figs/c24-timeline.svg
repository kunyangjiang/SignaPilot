<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 754" role="img" aria-label="时间线。1533 年西班牙人进入豪哈谷地，瓦安卡头人的结绳从这时记起给了什么、被拿走什么。1547 年拉加斯卡率王军驻豪哈，年底离开。1549 年谢萨·德·莱昂在豪哈看头人瓜克拉保卡读绳。1558 年利马高等法院，卢林瓦安卡头人瓜克拉保卡的结绳证词写成文书。1560 年是小说里乌丘马尔卡村的官司，虚构。1561 年利马高等法院，阿通豪哈的结绳证词写成文书。1568 年拉普拉塔高等法院，在今玻利维亚苏克雷，查扬塔的头人和管绳人追讨多缴的贡赋，是另一个地方、另一个法院、另一类案子。1570 年在豪哈，托莱多总督查问谷地 20 年打官司的花费，有的头人仍凭结绳作答。1575 年托莱多的条例提到通译和管绳人。1583 年第三次利马主教会议。实心点是史料或研究里有的事，空心点是小说。">
<text x="20.0" y="24.0" font-size="14" class="gt">豪哈、利马、拉普拉塔：年份和案件</text>
<circle class="gdot" cx="26" cy="46" r="3.5"/>
<text x="38.0" y="50.0" font-size="13">1533</text>
<text x="38.0" y="70.0" font-size="12">西班牙人进入豪哈谷地。瓦安卡头人的结绳从这时</text>
<text x="38.0" y="90.0" font-size="12">记起：给了什么，被拿走什么。</text>
<circle class="gdot" cx="26" cy="118" r="3.5"/>
<text x="38.0" y="122.0" font-size="13">1547</text>
<text x="38.0" y="142.0" font-size="12">拉加斯卡率王军驻豪哈，年底离开。</text>
<circle class="gdot" cx="26" cy="170" r="3.5"/>
<text x="38.0" y="174.0" font-size="13">1549</text>
<text x="38.0" y="194.0" font-size="12">谢萨·德·莱昂在豪哈看头人瓜克拉保卡读绳。</text>
<circle class="gdot" cx="26" cy="222" r="3.5"/>
<text x="38.0" y="226.0" font-size="13">1558</text>
<text x="38.0" y="246.0" font-size="12">利马高等法院：卢林瓦安卡头人瓜克拉保卡的</text>
<text x="38.0" y="266.0" font-size="12">结绳证词写成文书。</text>
<circle class="l" cx="26" cy="294" r="3.5" fill="none"/>
<text x="38.0" y="298.0" font-size="13">1560</text>
<text x="38.0" y="318.0" font-size="12">小说：乌丘马尔卡村的官司。虚构。</text>
<circle class="gdot" cx="26" cy="346" r="3.5"/>
<text x="38.0" y="350.0" font-size="13">1561</text>
<text x="38.0" y="370.0" font-size="12">利马高等法院：阿通豪哈的结绳证词写成文书。</text>
<circle class="gdot" cx="26" cy="398" r="3.5"/>
<text x="38.0" y="402.0" font-size="13">1568</text>
<text x="38.0" y="422.0" font-size="12">拉普拉塔高等法院（今玻利维亚苏克雷）：</text>
<text x="38.0" y="442.0" font-size="12">查扬塔的头人和管绳人追讨多缴的贡赋。</text>
<text x="38.0" y="462.0" font-size="12">另一个地方，另一个法院，另一类案子。</text>
<circle class="gdot" cx="26" cy="490" r="3.5"/>
<text x="38.0" y="494.0" font-size="13">1570</text>
<text x="38.0" y="514.0" font-size="12">豪哈：托莱多总督查问谷地 20 年打官司的花费，</text>
<text x="38.0" y="534.0" font-size="12">有的头人仍凭结绳作答。</text>
<circle class="gdot" cx="26" cy="562" r="3.5"/>
<text x="38.0" y="566.0" font-size="13">1575</text>
<text x="38.0" y="586.0" font-size="12">托莱多的条例提到通译和管绳人。</text>
<circle class="gdot" cx="26" cy="614" r="3.5"/>
<text x="38.0" y="618.0" font-size="13">1583</text>
<text x="38.0" y="638.0" font-size="12">第三次利马主教会议。</text>
<path class="l thin" fill="none" d="M20 656H380"/>
<text x="20.0" y="678.0" font-size="12">实心点是史料或研究里有的事，空心点是小说。</text>
<text x="20.0" y="698.0" font-size="12">1533 到 1570 各条据 Medrano 2022、Medelius 与</text>
<text x="20.0" y="718.0" font-size="12">Puente Luna 2004；1547 一条据二手叙述；</text>
<text x="20.0" y="738.0" font-size="12">1575、1583 两条只读到转述，内容见 Notes。</text>
</svg>
