<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 590" role="img" aria-label="一句话的七道手。一，说话的人沈士良在堂上说：听见过路的讲，不晓得真假，想去问问看。二，问的人是知县，只追问与罪名有关的部分。三，书办的草单即原供，照土话记下。四，刑名师爷的叙供写成：闻知石匠有叫魂之法，遂起意往求。五，知县的详文：该犯等所称叫魂之事，委系无稽。六，巡抚的奏折摘叙各县供词，加上本省的判断。七，皇帝与军机处的朱批和廷寄：何以数月并无一字奏闻。引文是小说里的句子，不是档案原文。廷寄再一层层转回县里，成为下一轮问话的题目。">
<text x="20.0" y="24.0" font-size="14" class="gt">一句话的七道手</text>
<rect class="l thin" x="20.0" y="42.0" width="360.0" height="62.0" rx="3" fill="none"/>
<text x="30.0" y="63.0" font-size="13">1　说话的人</text>
<text x="370.0" y="63.0" font-size="12" text-anchor="end">沈士良（堂上）</text>
<text x="30.0" y="88.0" font-size="12">“听见过路的讲，不晓得真假，想去问问看。”</text>
<path class="l thin" fill="none" d="M200 104v10m-4 -5l4 5l4 -5"/>
<rect class="l thin" x="20.0" y="114.0" width="360.0" height="62.0" rx="3" fill="none"/>
<text x="30.0" y="135.0" font-size="13">2　问的人</text>
<text x="370.0" y="135.0" font-size="12" text-anchor="end">知县</text>
<text x="30.0" y="160.0" font-size="12">只追问与罪名有关的部分</text>
<path class="l thin" fill="none" d="M200 176v10m-4 -5l4 5l4 -5"/>
<rect class="l thin" x="20.0" y="186.0" width="360.0" height="62.0" rx="3" fill="none"/>
<text x="30.0" y="207.0" font-size="13">3　书办</text>
<text x="370.0" y="207.0" font-size="12" text-anchor="end">草单（原供）</text>
<text x="30.0" y="232.0" font-size="12">照土话记下，夹着哭和答非所问</text>
<path class="l thin" fill="none" d="M200 248v10m-4 -5l4 5l4 -5"/>
<rect class="wash" x="20.0" y="258.0" width="360.0" height="62.0" rx="3"/>
<rect class="l thin" x="20.0" y="258.0" width="360.0" height="62.0" rx="3" fill="none"/>
<text x="30.0" y="279.0" font-size="14" class="gt">4　刑名师爷</text>
<text x="370.0" y="279.0" font-size="12" text-anchor="end">叙供</text>
<text x="30.0" y="304.0" font-size="12">“闻知石匠有叫魂之法，遂起意往求。”</text>
<path class="l thin" fill="none" d="M200 320v10m-4 -5l4 5l4 -5"/>
<rect class="l thin" x="20.0" y="330.0" width="360.0" height="62.0" rx="3" fill="none"/>
<text x="30.0" y="351.0" font-size="13">5　知县</text>
<text x="370.0" y="351.0" font-size="12" text-anchor="end">详文</text>
<text x="30.0" y="376.0" font-size="12">“该犯等所称叫魂之事，委系无稽。”</text>
<path class="l thin" fill="none" d="M200 392v10m-4 -5l4 5l4 -5"/>
<rect class="l thin" x="20.0" y="402.0" width="360.0" height="62.0" rx="3" fill="none"/>
<text x="30.0" y="423.0" font-size="13">6　巡抚</text>
<text x="370.0" y="423.0" font-size="12" text-anchor="end">奏折</text>
<text x="30.0" y="448.0" font-size="12">摘叙各县供词，加上本省的判断</text>
<path class="l thin" fill="none" d="M200 464v10m-4 -5l4 5l4 -5"/>
<rect class="l thin" x="20.0" y="474.0" width="360.0" height="62.0" rx="3" fill="none"/>
<text x="30.0" y="495.0" font-size="13">7　皇帝与军机处</text>
<text x="370.0" y="495.0" font-size="12" text-anchor="end">朱批、廷寄</text>
<text x="30.0" y="520.0" font-size="12">“何以数月并无一字奏闻？”</text>
<text x="20.0" y="556.0" font-size="12">第 1、4、5、7 层的引文是小说里的句子，不是档案原文。</text>
<text x="20.0" y="576.0" font-size="12">廷寄再从第 7 层一层层转回县里，成为下一轮问话的题目。</text>
</svg>
