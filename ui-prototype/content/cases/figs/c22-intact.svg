<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 498" role="img" aria-label="完好两个字底下的三件事。看得见的：石块在、灰泥在、印在，巡查能查，文书能记。推得出的：最后一回封门以后没有人再动，只要补得不留痕，就推不出。要知道的：门后的人和东西是否还在，只有拆开才知道，而拆开本身就是侵入。史料里的例子：第十六年 19 日，美丽之地诸墓查得完好，见 Abbott 纸草；第十七年打开伊西斯王后墓，已被八个贼毁坏，见都灵残片；同一卷里铜匠自认进过此墓，实则不认得它在哪里。第十六年的巡查为什么没有发现，纸草没有说；小说给的解释是虚构的。">
<text x="20.0" y="24.0" font-size="14" class="gt">“完好”两个字底下的三件事</text>
<rect class="wash" x="20.0" y="46.0" width="360.0" height="74.0" rx="3"/>
<rect class="l thin" x="20.0" y="46.0" width="360.0" height="74.0" rx="3" fill="none"/>
<text x="30.0" y="68.0" font-size="14" class="gt">看得见的</text>
<text x="30.0" y="90.0" font-size="13">石块在，灰泥在，印在</text>
<text x="30.0" y="110.0" font-size="12">巡查能查，文书能记</text>
<rect class="l thin" x="20.0" y="128.0" width="360.0" height="74.0" rx="3" fill="none"/>
<text x="30.0" y="150.0" font-size="14" class="gt">推得出的</text>
<text x="30.0" y="172.0" font-size="13">最后一回封门以后，没有人再动</text>
<text x="30.0" y="192.0" font-size="12">只要补得不留痕，就推不出</text>
<rect class="l thin" x="20.0" y="210.0" width="360.0" height="74.0" rx="3" fill="none"/>
<text x="30.0" y="232.0" font-size="14" class="gt">要知道的</text>
<text x="30.0" y="254.0" font-size="13">门后的人和东西是否还在</text>
<text x="30.0" y="274.0" font-size="12">只有拆开才知道；拆开本身就是侵入</text>
<path class="l thin" fill="none" d="M20 294H380"/>
<text x="20.0" y="316.0" font-size="13">史料里的例子</text>
<circle class="l" cx="26" cy="336" r="3.5" fill="none"/>
<text x="38.0" y="340.0" font-size="12">第十六年 19 日</text>
<text x="38.0" y="358.0" font-size="12">“美丽之地”诸墓：查得完好（Abbott）</text>
<circle class="gdot" cx="26" cy="376" r="3.5"/>
<text x="38.0" y="380.0" font-size="12">第十七年</text>
<text x="38.0" y="398.0" font-size="12">打开伊西斯王后墓：已被八个贼毁坏（都灵残片）</text>
<circle class="l" cx="26" cy="416" r="3.5" fill="none"/>
<text x="38.0" y="420.0" font-size="12">同一卷里</text>
<text x="38.0" y="438.0" font-size="12">铜匠自认进过此墓，实则不认得它在哪里</text>
<text x="20.0" y="464.0" font-size="12">第十六年的巡查为什么没有发现，纸草没有说。</text>
<text x="20.0" y="484.0" font-size="12">小说给的解释（门被补过）是虚构的。</text>
</svg>
