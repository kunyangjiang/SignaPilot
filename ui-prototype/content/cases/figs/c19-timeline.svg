<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 562" role="img" aria-label="时间线。1961 年底兄弟为借钱和卖地打架；1962 年 4 月 30 日晚 9 时 45 分入院；5 月 2 日下午 1 时 15 分两位医生宣告死亡，二姐按指印；冷房约 20 小时；5 月 3 日上午 10 时下葬；十天后坟上浇水泥盖板；1962 至 1980 的十八年只有他本人的说法；1980 年春在莱斯代尔集市重新出现；杜永医生的二十个问题；1981 至 1982 年英国摄制组和外国研究者来访；1986 年向法院递交申请，这是小说设定；1988 年 Davis 的学术专著出版；1989 年化验之争未完，签下私人字据，这是小说设定。实心点是见于医院记录或据记录转述的钟点，空心点是家人、村民或研究者的记述。">
<text x="20.0" y="24.0" font-size="14" class="gt">1962 与 1980：有钟点的和没有钟点的</text>
<path class="l thin" fill="none" d="M30 48V472"/>
<circle class="l" cx="30" cy="50" r="3.5" fill="none"/>
<text x="44.0" y="54.0" font-size="12">1961 年底</text>
<text x="134.0" y="54.0" font-size="12">兄弟为借钱和卖地打架，两人进哨所</text>
<circle class="gdot" cx="30" cy="84" r="3.5"/>
<text x="44.0" y="88.0" font-size="12">1962.4.30</text>
<text x="134.0" y="88.0" font-size="12">晚 9:45 入院：发热、疼痛、咯血</text>
<circle class="gdot" cx="30" cy="118" r="3.5"/>
<text x="44.0" y="122.0" font-size="12">1962.5.2</text>
<text x="134.0" y="122.0" font-size="12">下午 1:15 两位医生宣告死亡；二姐按指印</text>
<circle class="gdot" cx="30" cy="152" r="3.5"/>
<text x="44.0" y="156.0" font-size="12">1962.5.2—3</text>
<text x="134.0" y="156.0" font-size="12">冷房约 20 小时</text>
<circle class="gdot" cx="30" cy="186" r="3.5"/>
<text x="44.0" y="190.0" font-size="12">1962.5.3</text>
<text x="134.0" y="190.0" font-size="12">上午 10:00 下葬</text>
<circle class="l" cx="30" cy="220" r="3.5" fill="none"/>
<text x="44.0" y="224.0" font-size="12">1962.5 中</text>
<text x="134.0" y="224.0" font-size="12">下葬十天后，坟上浇水泥盖板</text>
<circle class="l" cx="30" cy="254" r="3.5" fill="none"/>
<text x="44.0" y="258.0" font-size="12">1962—1980</text>
<text x="134.0" y="258.0" font-size="14" class="gt">十八年：只有他本人的说法</text>
<circle class="l" cx="30" cy="288" r="3.5" fill="none"/>
<text x="44.0" y="292.0" font-size="12">1980 春</text>
<text x="134.0" y="292.0" font-size="12">莱斯代尔集市；乳名；二百多人围观</text>
<circle class="l" cx="30" cy="322" r="3.5" fill="none"/>
<text x="44.0" y="326.0" font-size="12">1980</text>
<text x="134.0" y="326.0" font-size="12">杜永医生的二十个问题</text>
<circle class="l" cx="30" cy="356" r="3.5" fill="none"/>
<text x="44.0" y="360.0" font-size="12">1981—1982</text>
<text x="134.0" y="360.0" font-size="12">英国摄制组；外国研究者来访</text>
<circle class="l" cx="30" cy="390" r="3.5" fill="none"/>
<text x="44.0" y="394.0" font-size="12">1986</text>
<text x="134.0" y="394.0" font-size="12">向法院递交申请（小说设定）</text>
<circle class="l" cx="30" cy="424" r="3.5" fill="none"/>
<text x="44.0" y="428.0" font-size="12">1988</text>
<text x="134.0" y="428.0" font-size="12">Davis 的学术专著出版</text>
<circle class="l" cx="30" cy="458" r="3.5" fill="none"/>
<text x="44.0" y="462.0" font-size="12">1989</text>
<text x="134.0" y="462.0" font-size="12">化验之争未完；签下私人字据（小说设定）</text>
<path class="l thin" fill="none" d="M20 486H380"/>
<text x="20.0" y="508.0" font-size="12">实心点：见于医院记录或据记录转述的钟点。</text>
<text x="20.0" y="528.0" font-size="12">空心点：家人、村民或研究者的记述。</text>
<text x="20.0" y="548.0" font-size="12">1962 至 1980 之间没有任何文书。</text>
</svg>
