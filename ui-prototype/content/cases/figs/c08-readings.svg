<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 534" role="img" aria-label="同一件事的三种读法。沟边箱子一个人托得住：镇上说她变轻了、选了他；艾蒙写圣徒为选中的人变得像羔羊那么轻；原因是奥东力气大，骨头本来不重。星期三箱子很重：镇上说她舍不得他、不愿进金子；艾蒙已经走了，没有写；原因是石头比骨头重。箱子里是十四块石头：镇上说她变成了石头、随主升天；归来记怎么写这一段，小说没有交代；原因是艾蒙用袖子一趟趟带进去。回程骡子自己过河：雷蒙看见了，什么也没问；艾蒙说她想回家；原因是水浅了。">
  <g font-size="14">
    <text x="20" y="24">旁人</text>
    <text x="150" y="24">艾蒙</text>
    <text x="280" y="24" class="gt">小说交代的原因</text>
  </g>
  <path class="gl" d="M276 34V524" opacity=".6" filter="url(#wob2)"/>
  <g class="l thin" filter="url(#wob2)">
    <path d="M20 36H380M20 166H380M20 296H380M20 426H380M20 524H380"/>
  </g>
  <g font-size="16">
    <text x="20" y="64">沟边，箱子一个人托得住</text>
    <text x="20" y="194">星期三，箱子很重</text>
    <text x="20" y="324">箱子里是十四块石头</text>
    <text x="20" y="454">回程，骡子自己过了河</text>
  </g>
  <g font-size="14">
    <text x="20" y="96">她变轻了，</text><text x="20" y="116">她选了他</text>
    <text x="150" y="96">写：圣徒为她</text><text x="150" y="116">选中的人变得</text><text x="150" y="136">像羔羊那么轻</text>
    <text x="288" y="96">奥东力气大；</text><text x="288" y="116">骨头本来不重</text>

    <text x="20" y="226">她舍不得他；</text><text x="20" y="246">她不愿进金子</text>
    <text x="150" y="226">已经走了，</text><text x="150" y="246">没有写</text>
    <text x="288" y="226">石头比骨头重</text>

    <text x="20" y="356">她变成了石头；</text><text x="20" y="376">她随主升天了</text>
    <text x="150" y="356">归来记怎么写</text><text x="150" y="376">这一段，小说</text><text x="150" y="396">没有交代</text>
    <text x="288" y="356">艾蒙用袖子</text><text x="288" y="376">一趟一趟</text><text x="288" y="396">带进去</text>

    <text x="20" y="486">雷蒙看见了，</text><text x="20" y="506">什么也没问</text>
    <text x="150" y="486">说：她想回家</text>
    <text x="288" y="486">水浅了</text>
  </g>
</svg>
