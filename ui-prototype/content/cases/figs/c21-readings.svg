<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 542" role="img" aria-label="同一个结果的几种说法。结果是她说的三个字等于管子里的三个字。有透视的能力：支持是字相符、她自述看见了；不足是管子不是指定的、手不在人眼前。调换：支持是交回的不是山川的管子、她当夜自认；不足是自认是从字推出来的，不是认出了管子。实验物混杂：支持是福来确曾交出一根样品；不足是样品里的字和去向都没有记录。事先已知内容：支持是练习管在她手里放了一夜；不足是没有人见过她打开，铅管割开就合不上。无意的提示：支持是福来知道练习管里的字；不足是 9 月 14 日他不在二楼。过程有了缺口，结果就不能替任何一种说法作证：不能证明她能，也不能证明她作伪。">
<text x="20.0" y="24.0" font-size="14" class="gt">同一个结果，几种说法</text>
<rect class="wash" x="20.0" y="38.0" width="360.0" height="34.0" rx="3"/>
<rect class="l thin" x="20.0" y="38.0" width="360.0" height="34.0" rx="3" fill="none"/>
<text x="200.0" y="60.0" font-size="13" text-anchor="middle">结果：她说的三个字 = 管子里的三个字</text>
<rect class="l thin" x="20.0" y="88.0" width="360.0" height="74.0" rx="3" fill="none"/>
<text x="30.0" y="109.0" font-size="13">有透视的能力</text>
<text x="30.0" y="130.0" font-size="12">支持</text>
<text x="70.0" y="130.0" font-size="12">字相符；她自述“看见了”</text>
<text x="30.0" y="150.0" font-size="12">不足</text>
<text x="70.0" y="150.0" font-size="12">管子不是指定的；手不在人眼前</text>
<rect class="l thin" x="20.0" y="170.0" width="360.0" height="74.0" rx="3" fill="none"/>
<text x="30.0" y="191.0" font-size="13">调换</text>
<text x="30.0" y="212.0" font-size="12">支持</text>
<text x="70.0" y="212.0" font-size="12">交回的不是山川的管子；她当夜自认</text>
<text x="30.0" y="232.0" font-size="12">不足</text>
<text x="70.0" y="232.0" font-size="12">自认是从字推出来的，不是认出了管子</text>
<rect class="l thin" x="20.0" y="252.0" width="360.0" height="74.0" rx="3" fill="none"/>
<text x="30.0" y="273.0" font-size="13">实验物混杂</text>
<text x="30.0" y="294.0" font-size="12">支持</text>
<text x="70.0" y="294.0" font-size="12">福来确曾交出一根样品</text>
<text x="30.0" y="314.0" font-size="12">不足</text>
<text x="70.0" y="314.0" font-size="12">样品里的字、样品的去向都没有记录</text>
<rect class="l thin" x="20.0" y="334.0" width="360.0" height="74.0" rx="3" fill="none"/>
<text x="30.0" y="355.0" font-size="13">事先已知内容</text>
<text x="30.0" y="376.0" font-size="12">支持</text>
<text x="70.0" y="376.0" font-size="12">练习管在她手里放了一夜</text>
<text x="30.0" y="396.0" font-size="12">不足</text>
<text x="70.0" y="396.0" font-size="12">没有人见过她打开；铅管割开就合不上</text>
<rect class="l thin" x="20.0" y="416.0" width="360.0" height="74.0" rx="3" fill="none"/>
<text x="30.0" y="437.0" font-size="13">无意的提示</text>
<text x="30.0" y="458.0" font-size="12">支持</text>
<text x="70.0" y="458.0" font-size="12">福来知道练习管里的字</text>
<text x="30.0" y="478.0" font-size="12">不足</text>
<text x="70.0" y="478.0" font-size="12">9 月 14 日他不在二楼</text>
<text x="20.0" y="508.0" font-size="12">过程有了缺口，结果就不能替任何一种说法作证：</text>
<text x="20.0" y="528.0" font-size="13">不能证明她能，也不能证明她作伪。</text>
</svg>
