<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" role="img" aria-label="铭文末字对照：拓片与原镜作阑，仿镜作然">
<text x="20.0" y="24.0" font-size="14" class="gt">同一圈铭文的最后一个字</text>
<rect class="l" x="20.0" y="40.0" width="100.0" height="132.0" rx="3" fill="none"/>
<text x="70.0" y="58.0" font-size="12" text-anchor="middle">1979 年简报拓片</text>
<text x="70.0" y="130.0" font-size="52" text-anchor="middle">阑</text>
<text x="70.0" y="192.0" font-size="12" text-anchor="middle">释文作“澜”</text>
<rect class="l" x="150.0" y="40.0" width="100.0" height="132.0" rx="3" fill="none"/>
<text x="200.0" y="58.0" font-size="12" text-anchor="middle">1983 年仿镜</text>
<text x="200.0" y="130.0" font-size="52" text-anchor="middle">然</text>
<text x="200.0" y="192.0" font-size="12" text-anchor="middle">四点是錾的</text>
<rect class="l" x="280.0" y="40.0" width="100.0" height="132.0" rx="3" fill="none"/>
<text x="330.0" y="58.0" font-size="12" text-anchor="middle">出土原镜</text>
<text x="330.0" y="130.0" font-size="52" text-anchor="middle">阑</text>
<text x="330.0" y="192.0" font-size="12" text-anchor="middle">铸出来就是阑</text>
<path class="gl" fill="none" d="M168 142h64" stroke-width="2"/>
<text x="200.0" y="162.0" font-size="12" text-anchor="middle">葛守业的记号</text>
<path class="l thin" fill="none" d="M20 210H380"/>
<text x="20.0" y="234.0" font-size="12">整圈八个字：见日之光，见者安□</text>
<text x="20.0" y="256.0" font-size="12">汉镜常省偏旁、借字：铸的是“阑”，读作“澜”。</text>
<text x="20.0" y="278.0" font-size="12">拓片就从这面镜子上拓下，两者本该一字不差。</text>
<text x="20.0" y="300.0" font-size="12">光凭字不同定不了真假，还要看重量、工艺和来历。</text>
</svg>
