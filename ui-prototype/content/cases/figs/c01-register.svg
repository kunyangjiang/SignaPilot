<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="用印登记簿 6 月 12 日那一页：上午两笔，第二笔底下画了一道线，线尾写着一个周字，紧接着就是 6 月 13 日，中间没有空行">
  <rect class="wash" x="60" y="150" width="600" height="14"/>
  <g class="l" filter="url(#wob2)">
