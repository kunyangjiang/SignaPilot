<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 515" role="img" aria-label="两条时间线。1612 年：3 月艾莉森（Alizon Device）与货郎约翰·劳的冲突；4 月初德姆迪克、艾莉森等收押；4 月 10 日耶稣受难日马尔金塔聚餐；4 月 27 日在威尔西家问话；8 月 17 日起兰开斯特巡回审判；8 月 18 日伊丽莎白、詹姆斯受审，女孩被放到桌上；8 月 19 日爱丽丝·纳特等人受审，女孩列队辨认被告，宣判；8 月 20 日十人处决；1613 年波茨的书出版。1633 至 1636 年：11 月 1 日万圣节内德没赶回牛；2 月 10 日帕迪厄姆宣誓作证；开春父子带人巡游各教堂；春季巡回审判十七人定罪，法官暂缓行刑；6 月 13 至 15 日主教在兰开斯特审问；7 月 2 日外科医生会馆检查四名妇女；7 月 16 日内德在伦敦重审，承认编造；1636 年 7 月至少十人仍关在兰开斯特。">
<text x="20.0" y="24.0" font-size="14" class="gt">两条时间线</text>
<text x="20.0" y="54.0" font-size="14" class="gt">1612</text>
<circle class="l" cx="24" cy="91" r="3.5" fill="none"/>
<text x="34.0" y="95.0" font-size="12">3 月</text>
<text x="34.0" y="113.0" font-size="12">艾莉森与货郎约翰·劳的冲突</text>
<circle class="l" cx="24" cy="132" r="3.5" fill="none"/>
<text x="34.0" y="136.0" font-size="12">4 月初</text>
<text x="34.0" y="154.0" font-size="12">德姆迪克、艾莉森等收押</text>
<circle class="l" cx="24" cy="173" r="3.5" fill="none"/>
<text x="34.0" y="177.0" font-size="12">4 月 10 日</text>
<text x="34.0" y="195.0" font-size="12">耶稣受难日，马尔金塔聚餐</text>
<circle class="l" cx="24" cy="214" r="3.5" fill="none"/>
<text x="34.0" y="218.0" font-size="12">4 月 27 日</text>
<text x="34.0" y="236.0" font-size="12">威尔西家问话母亲和哥哥</text>
<circle class="l" cx="24" cy="255" r="3.5" fill="none"/>
<text x="34.0" y="259.0" font-size="12">8 月 17 日起</text>
<text x="34.0" y="277.0" font-size="12">兰开斯特巡回审判</text>
<circle class="l" cx="24" cy="296" r="3.5" fill="none"/>
<text x="34.0" y="300.0" font-size="12">8 月 18 日</text>
<text x="34.0" y="318.0" font-size="12">母亲、哥哥受审，女孩上桌</text>
<circle class="l" cx="24" cy="337" r="3.5" fill="none"/>
<text x="34.0" y="341.0" font-size="12">8 月 19 日</text>
<text x="34.0" y="359.0" font-size="12">纳特等人受审，列队辨认，宣判</text>
<circle class="l" cx="24" cy="378" r="3.5" fill="none"/>
<text x="34.0" y="382.0" font-size="12">8 月 20 日</text>
<text x="34.0" y="400.0" font-size="12">十人在兰开斯特处决</text>
<circle class="l" cx="24" cy="419" r="3.5" fill="none"/>
<text x="34.0" y="423.0" font-size="12">1613</text>
<text x="34.0" y="441.0" font-size="12">波茨的书在伦敦出版</text>
<path class="l thin" fill="none" d="M24 66V423"/>
<text x="210.0" y="54.0" font-size="14" class="gt">1633—1636</text>
<circle class="gdot" cx="214" cy="91" r="3.5"/>
<text x="224.0" y="95.0" font-size="12">11 月 1 日</text>
<text x="224.0" y="113.0" font-size="12">万圣节，内德没赶回牛</text>
<circle class="gdot" cx="214" cy="132" r="3.5"/>
<text x="224.0" y="136.0" font-size="12">2 月 10 日</text>
<text x="224.0" y="154.0" font-size="12">帕迪厄姆，内德和父亲宣誓作证</text>
<circle class="gdot" cx="214" cy="173" r="3.5"/>
<text x="224.0" y="177.0" font-size="12">开春</text>
<text x="224.0" y="195.0" font-size="12">父子带人巡游各教堂</text>
<circle class="gdot" cx="214" cy="214" r="3.5"/>
<text x="224.0" y="218.0" font-size="12">春季巡回审判</text>
<text x="224.0" y="236.0" font-size="12">十七人定罪，法官暂缓行刑</text>
<circle class="gdot" cx="214" cy="255" r="3.5"/>
<text x="224.0" y="259.0" font-size="12">6 月 13—15 日</text>
<text x="224.0" y="277.0" font-size="12">布里奇曼主教在兰开斯特审问</text>
<circle class="gdot" cx="214" cy="296" r="3.5"/>
<text x="224.0" y="300.0" font-size="12">7 月 2 日</text>
<text x="224.0" y="318.0" font-size="12">外科医生会馆检查四名妇女</text>
<circle class="gdot" cx="214" cy="337" r="3.5"/>
<text x="224.0" y="341.0" font-size="12">7 月 16 日</text>
<text x="224.0" y="359.0" font-size="12">内德在伦敦重审，承认编造</text>
<circle class="gdot" cx="214" cy="378" r="3.5"/>
<text x="224.0" y="382.0" font-size="12">1636 年 7 月</text>
<text x="224.0" y="400.0" font-size="12">至少十人仍关在兰开斯特</text>
<path class="l thin" fill="none" d="M214 66V382"/>
<path class="l thin" fill="none" d="M20 445H380"/>
<text x="20.0" y="467.0" font-size="12">右列 2 月 10 日的证词，原件写作 1633 年：</text>
<text x="20.0" y="485.0" font-size="12">当时英格兰以 3 月 25 日为新年，</text>
<text x="20.0" y="503.0" font-size="12">按今天的算法是 1634 年。</text>
</svg>
