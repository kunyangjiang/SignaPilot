<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 399" role="img" aria-label="马尔金塔一顿饭的几种说法。珍妮特：看见约二十人，只有两个男的，就她记得；看见牛肉、咸肉、烤羊肉，羊在她面前宰杀；听哥哥说羊是巴利那边一户人家的；听母亲说这些人都是女巫，来给艾莉森的精灵起名；认得六个人的名字。詹姆斯：听母亲说有三件事，起名、杀看守救人、炸掉城堡；说出一串名字。伊丽莎白：认了受难日请大家吃饭，不认商量杀看守、炸城堡。波茨的书：写成大集会、女巫大议会，并把女孩当庭认人解释为上帝亲手所为。">
<text x="20.0" y="24.0" font-size="14" class="gt">马尔金塔：一顿饭，几种说法</text>
<text x="20.0" y="52.0" font-size="13">珍妮特（9 岁）</text>
<text x="32.0" y="72.0" font-size="12">看见</text>
<text x="100.0" y="72.0" font-size="12">约 20 人，只有 2 个男的（“就她记得”）</text>
<text x="32.0" y="91.0" font-size="12">看见</text>
<text x="100.0" y="91.0" font-size="12">牛肉、咸肉、烤羊肉；羊在她面前宰杀</text>
<text x="32.0" y="110.0" font-size="12">听哥哥说</text>
<text x="100.0" y="110.0" font-size="12">羊是巴利那边一户人家的</text>
<text x="32.0" y="129.0" font-size="12">听母亲说</text>
<text x="100.0" y="129.0" font-size="12">这些人都是女巫，来给艾莉森的精灵起名</text>
<text x="32.0" y="148.0" font-size="12">认得</text>
<text x="100.0" y="148.0" font-size="12">六个人的名字，其余不认识</text>
<path class="l thin" fill="none" d="M20 161H380"/>
<text x="20.0" y="177.0" font-size="13">詹姆斯（她哥哥）</text>
<text x="32.0" y="197.0" font-size="12">听母亲说</text>
<text x="100.0" y="197.0" font-size="12">三件事：起名；杀看守救人；炸掉城堡</text>
<text x="32.0" y="216.0" font-size="12">说出</text>
<text x="100.0" y="216.0" font-size="12">一串名字，比妹妹多，彼此不全相同</text>
<path class="l thin" fill="none" d="M20 229H380"/>
<text x="20.0" y="245.0" font-size="13">伊丽莎白（母亲）</text>
<text x="32.0" y="265.0" font-size="12">认了</text>
<text x="100.0" y="265.0" font-size="12">受难日请大家吃饭</text>
<text x="32.0" y="284.0" font-size="12">不认</text>
<text x="100.0" y="284.0" font-size="12">商量杀看守、炸城堡</text>
<path class="l thin" fill="none" d="M20 297H380"/>
<text x="20.0" y="313.0" font-size="13">波茨的书</text>
<text x="32.0" y="333.0" font-size="12">写成</text>
<text x="100.0" y="333.0" font-size="12">“大集会”“女巫大议会”</text>
<text x="32.0" y="352.0" font-size="12">解释</text>
<text x="100.0" y="352.0" font-size="12">女孩当庭认人，是“上帝亲手所为”</text>
<text x="20.0" y="385.0" font-size="12">同一顿饭，从“吃了什么”一路写成了“谋反”。</text>
</svg>
