<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="三只手的比较。左：民国元年全家福里囡囡的右手，光从左边来，影子在右边。中：把那张底片翻过来翻拍，影子会换到左边，可是右手也变成了左手。右：民国七年三月十八底片上的小手，是右手，光却从右边来。手的样子像那年的，光是今年的，把底片翻过来翻拍做不出这样的组合；修版、另摆一只手等别的做法，这张图没有排除。">
<text x="70" y="30" font-size="15" text-anchor="middle">民国元年</text><text x="70" y="50" font-size="15" text-anchor="middle">全家福</text><path class="l" d="M12 82 l22 8 m-6 -7 l6 7 l-8 2"/><path class="l" d="M12 94 l22 8 m-6 -7 l6 7 l-8 2"/><path class="l" d="M12 106 l22 8 m-6 -7 l6 7 l-8 2"/><g transform="translate(70 140)"><path class="wash" style="opacity:.5" d="M27 -20 L35 -16 L35 18 L27 14 Z M23 14 L31 18 L31 42 L23 38 Z"/><path class="l" d="M-24 -16 Q-24 -26 -14 -26 L16 -26 Q26 -26 26 -16 L26 14 L-24 14 Z"/><rect class="l" x="-24" y="12" width="10" height="30" rx="5"/><rect class="l" x="-12" y="12" width="10" height="36" rx="5"/><rect class="l" x="0" y="12" width="10" height="34" rx="5"/><rect class="l" x="12" y="12" width="10" height="26" rx="5"/><path class="l" d="M-24 -6 L-38 -26 Q-42 -34 -35 -37 Q-29 -39 -26 -32 L-16 -14"/><g transform="rotate(-35 -36 -36)"><rect x="-43" y="-46" width="14" height="13" rx="3" class="l" style="fill:var(--bg,#f2efe7)"/><path class="l" d="M-37 -46 l3 4 l3 -4"/></g></g><text x="70" y="222" font-size="15" text-anchor="middle">右手</text><text x="70" y="244" font-size="14" text-anchor="middle">光从左边来</text><text x="200" y="30" font-size="15" text-anchor="middle">把底片</text><text x="200" y="50" font-size="15" text-anchor="middle">翻过来用</text><path class="l" d="M258 82 l-22 8 m6 -7 l-6 7 l8 2"/><path class="l" d="M258 94 l-22 8 m6 -7 l-6 7 l8 2"/><path class="l" d="M258 106 l-22 8 m6 -7 l-6 7 l8 2"/><g transform="translate(200 140) scale(-1 1)"><path class="wash" style="opacity:.5" d="M27 -20 L35 -16 L35 18 L27 14 Z M23 14 L31 18 L31 42 L23 38 Z"/><path class="l" d="M-24 -16 Q-24 -26 -14 -26 L16 -26 Q26 -26 26 -16 L26 14 L-24 14 Z"/><rect class="l" x="-24" y="12" width="10" height="30" rx="5"/><rect class="l" x="-12" y="12" width="10" height="36" rx="5"/><rect class="l" x="0" y="12" width="10" height="34" rx="5"/><rect class="l" x="12" y="12" width="10" height="26" rx="5"/><path class="l" d="M-24 -6 L-38 -26 Q-42 -34 -35 -37 Q-29 -39 -26 -32 L-16 -14"/><g transform="rotate(-35 -36 -36)"><rect x="-43" y="-46" width="14" height="13" rx="3" class="l" style="fill:var(--bg,#f2efe7)"/><path class="l" d="M-37 -46 l3 4 l3 -4"/></g></g><text x="200" y="222" font-size="15" text-anchor="middle">变成左手</text><text x="200" y="244" font-size="14" text-anchor="middle">光从右边来</text><text x="330" y="30" font-size="15" text-anchor="middle">民国七年</text><text x="330" y="50" font-size="15" text-anchor="middle">三月十八</text><path class="l" d="M388 82 l-22 8 m6 -7 l-6 7 l8 2"/><path class="l" d="M388 94 l-22 8 m6 -7 l-6 7 l8 2"/><path class="l" d="M388 106 l-22 8 m6 -7 l-6 7 l8 2"/><g transform="translate(330 140)"><path class="wash" style="opacity:.5" d="M-25 -2 L-33 2 L-33 18 L-25 14 Z M-25 14 L-33 18 L-33 46 L-25 42 Z"/><path class="l" d="M-24 -16 Q-24 -26 -14 -26 L16 -26 Q26 -26 26 -16 L26 14 L-24 14 Z"/><rect class="l" x="-24" y="12" width="10" height="30" rx="5"/><rect class="l" x="-12" y="12" width="10" height="36" rx="5"/><rect class="l" x="0" y="12" width="10" height="34" rx="5"/><rect class="l" x="12" y="12" width="10" height="26" rx="5"/><path class="l" d="M-24 -6 L-38 -26 Q-42 -34 -35 -37 Q-29 -39 -26 -32 L-16 -14"/><g transform="rotate(-35 -36 -36)"><rect x="-43" y="-46" width="14" height="13" rx="3" class="l" style="fill:var(--bg,#f2efe7)"/><path class="l" d="M-37 -46 l3 4 l3 -4"/></g></g><text x="330" y="222" font-size="15" text-anchor="middle">右手</text><text x="330" y="244" font-size="14" text-anchor="middle">光从右边来</text>
<path class="l" d="M135 100V200M265 100V200" style="stroke-width:.8;opacity:.6"/>
<text x="200" y="290" font-size="16" text-anchor="middle">手像那年的手，光是今年的光</text>
<text x="200" y="314" font-size="14" text-anchor="middle">翻过来翻拍只能二选一；别的做法没有排除</text>
</svg>
