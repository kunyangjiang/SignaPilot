<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 590" role="img" aria-label="两份记录里的相似名字对照。1612 年证人 Iennet Deuice，伊丽莎白之女，约九岁；1634 年被告 Jennet Davies 或 Devys，另有抄本作 Jane Davies。1612 年珍妮特的舅舅舅妈克里斯托弗·豪盖特夫妇，未被起诉；1634 年一个姓霍尔盖特的和他老婆，后注据他所信。1612 年 Dick Miles his wife，注者认为即爱丽丝·纳特；1634 年 Miles wife of Dicks。1612 年克里斯托弗·杰克斯和妻子；1634 年亨利·杰克斯之妻和儿子约翰。1612 年休·哈格里夫斯之妻；1634 年亨利·哈格里夫斯之妻珍妮特。1612 年死者约翰·罗宾逊、詹姆斯·罗宾逊；1634 年告发的孩子埃德蒙·罗宾逊。耶稣受难日马尔金塔对万圣节霍尔斯通斯；棕狗鲍尔、黑狗丹迪对一黑一棕两条灵缇；女孩被放到桌上对男孩站上教堂的凳子。名字相像只能说明名字相像。">
<text x="20.0" y="24.0" font-size="14" class="gt">两份记录里的相似名字</text>
<text x="20.0" y="48.0" font-size="12">1612（波茨，1613 年出版）</text>
<text x="214.0" y="48.0" font-size="12">1634（帕迪厄姆证词与伦敦重审）</text>
<path class="l thin" fill="none" d="M20 58H380"/>
<rect class="wash" x="16" y="65" width="368" height="44" rx="3"/>
<text x="20.0" y="82.0" font-size="13">Iennet Deuice</text>
<text x="214.0" y="82.0" font-size="13">Jennet Davies / Devys</text>
<text x="20.0" y="102.0" font-size="12">伊丽莎白之女，约 9 岁，证人</text>
<text x="214.0" y="102.0" font-size="12">被告；另有抄本作 Jane Davies</text>
<path class="gl" fill="none" d="M190 78h18"/>
<text x="20.0" y="132.0" font-size="13">克里斯托弗·豪盖特和妻子</text>
<text x="214.0" y="132.0" font-size="13">“一个姓霍尔盖特的和他老婆”</text>
<text x="20.0" y="152.0" font-size="12">珍妮特的舅舅舅妈，未被起诉</text>
<text x="214.0" y="152.0" font-size="12">后注 sicut credit，据他所信</text>
<path class="gl" fill="none" d="M190 128h18"/>
<text x="20.0" y="182.0" font-size="13">Dick Miles his wife</text>
<text x="214.0" y="182.0" font-size="13">Miles wife of Dicks</text>
<text x="20.0" y="202.0" font-size="12">注者认为即爱丽丝·纳特</text>
<text x="214.0" y="202.0" font-size="12">“迪克家的迈尔斯的老婆”</text>
<path class="gl" fill="none" d="M190 178h18"/>
<text x="20.0" y="232.0" font-size="13">克里斯托弗·杰克斯和妻子</text>
<text x="214.0" y="232.0" font-size="13">亨利·杰克斯之妻和儿子约翰</text>
<text x="20.0" y="252.0" font-size="12">索尼霍尔姆</text>
<path class="gl" fill="none" d="M190 228h18"/>
<text x="20.0" y="282.0" font-size="13">休·哈格里夫斯之妻</text>
<text x="214.0" y="282.0" font-size="13">亨利·哈格里夫斯之妻珍妮特</text>
<text x="20.0" y="302.0" font-size="12">彭德尔山下</text>
<text x="214.0" y="302.0" font-size="12">1634 年 7 月在伦敦受检</text>
<path class="gl" fill="none" d="M190 278h18"/>
<text x="20.0" y="332.0" font-size="13">约翰与詹姆斯·罗宾逊</text>
<text x="214.0" y="332.0" font-size="13">埃德蒙·罗宾逊</text>
<text x="20.0" y="352.0" font-size="12">死者，巴利；约翰别名斯怀尔</text>
<text x="214.0" y="352.0" font-size="12">告发的孩子</text>
<path class="gl" fill="none" d="M190 328h18"/>
<text x="20.0" y="382.0" font-size="13">耶稣受难日，马尔金塔</text>
<text x="214.0" y="382.0" font-size="13">万圣节，霍尔斯通斯</text>
<text x="20.0" y="402.0" font-size="12">偷来的羊</text>
<text x="214.0" y="402.0" font-size="12">房梁上淌下来的肉和奶</text>
<path class="gl" fill="none" d="M190 378h18"/>
<text x="20.0" y="432.0" font-size="13">棕狗鲍尔、黑狗丹迪</text>
<text x="214.0" y="432.0" font-size="13">一黑一棕两条灵缇</text>
<path class="gl" fill="none" d="M190 428h18"/>
<text x="20.0" y="482.0" font-size="13">女孩被放到桌上</text>
<text x="214.0" y="482.0" font-size="13">男孩站上教堂的凳子</text>
<text x="214.0" y="502.0" font-size="12">据韦伯斯特 1677 年的回忆</text>
<path class="gl" fill="none" d="M190 478h18"/>
<path class="l thin" fill="none" d="M20 520H380"/>
<text x="20.0" y="540.0" font-size="12">这些相像都是真的出现在记录里的。</text>
<text x="20.0" y="558.0" font-size="12">可是名字相像，只能说明名字相像：</text>
<text x="20.0" y="576.0" font-size="12">同一个山谷，同一个姓，可以是一个人，也可以是好几个人。</text>
</svg>
