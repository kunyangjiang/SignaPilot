<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-label="从出土到复核的档案时间线">
<text x="20.0" y="24.0" font-size="14" class="gt">每次核对，都是拿上一次的记录对</text>
<path class="l thin" fill="none" d="M84 44V326"/>
<text x="74.0" y="54.0" font-size="12" text-anchor="end">1978</text>
<circle class="l" cx="84" cy="50" r="3.5" fill="none"/>
<text x="96.0" y="54.0" font-size="12">安澜江畔砖室墓出土，归文化馆</text>
<text x="74.0" y="78.0" font-size="12" text-anchor="end">1979</text>
<circle class="l" cx="84" cy="74" r="3.5" fill="none"/>
<text x="96.0" y="78.0" font-size="12">简报：589 克，拓片作“阑”</text>
<text x="74.0" y="102.0" font-size="12" text-anchor="end">1983.4</text>
<circle class="l" cx="84" cy="98" r="3.5" fill="none"/>
<text x="96.0" y="102.0" font-size="12">开裂，凭借条带回家修，期限三个月</text>
<text x="74.0" y="126.0" font-size="12" text-anchor="end">1983.5</text>
<circle class="l" cx="84" cy="122" r="3.5" fill="none"/>
<text x="96.0" y="126.0" font-size="12">所长同意，仿镜先上展</text>
<text x="74.0" y="150.0" font-size="12" text-anchor="end">1983.9</text>
<circle class="l" cx="84" cy="146" r="3.5" fill="none"/>
<text x="96.0" y="150.0" font-size="12">文管所建卡，拍的是仿镜：“然”</text>
<text x="74.0" y="174.0" font-size="12" text-anchor="end">1998</text>
<circle class="gdot" cx="84" cy="170" r="3.5"/>
<text x="96.0" y="174.0" font-size="12">定二级：“铭文有省改”</text>
<text x="74.0" y="198.0" font-size="12" text-anchor="end">2009</text>
<circle class="gdot" cx="84" cy="194" r="3.5"/>
<text x="96.0" y="198.0" font-size="12">展柜称重报警，基准 612 克</text>
<text x="74.0" y="222.0" font-size="12" text-anchor="end">2011</text>
<circle class="gdot" cx="84" cy="218" r="3.5"/>
<text x="96.0" y="222.0" font-size="12">换绒布误报，重新称 612.3 克</text>
<text x="74.0" y="246.0" font-size="12" text-anchor="end">2014</text>
<circle class="gdot" cx="84" cy="242" r="3.5"/>
<text x="96.0" y="246.0" font-size="12">普查 612 克；便签“以实物为准”</text>
<text x="74.0" y="270.0" font-size="12" text-anchor="end">2019</text>
<circle class="gdot" cx="84" cy="266" r="3.5"/>
<text x="96.0" y="270.0" font-size="12">程素文去信，回的是复印件</text>
<text x="74.0" y="294.0" font-size="12" text-anchor="end">2023.5</text>
<circle class="l" cx="84" cy="290" r="3.5" fill="none"/>
<text x="96.0" y="294.0" font-size="12">馆里申报复核，扫描 600 dpi</text>
<text x="74.0" y="318.0" font-size="12" text-anchor="end">2023.6.1</text>
<circle class="l" cx="84" cy="314" r="3.5" fill="none"/>
<text x="96.0" y="318.0" font-size="12">县档案馆找到借条，归还栏空</text>
<text x="20.0" y="346.0" font-size="12">实心点：看见了，又被一个合理的理由放过去。</text>
</svg>
