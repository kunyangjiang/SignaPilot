<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 644" role="img" aria-label="1924 到 1996 年的时间线。1924 年 1 月 21 日列宁去世，解剖后做了只管几天的临时防腐；3 月底开始长期保存的试验，7 月底做成；葬礼委员会和遗体保存委员会是两个机构，后者 7 月改称永久纪念列宁委员会。1939 年设立专门的实验室。1941 到 1945 年遗体疏散到秋明，1945 年 2 月右脚少了一块皮，此后新办法先在实验对象上试。1953 到 1961 年斯大林的遗体并排陈列，1961 年移出。1960 到 1980 年代研究所最盛时约两百人。1991 年苏联解体，此后国家经费大减。1993 到 1995 年研究所对外报价，长期保存无人订购；同一时期另外的私人公司在做几天的临时防腐，主顾里常有帮派中人，两者不是一回事。1996 年遗体仍在陵墓，每 18 个月照旧做一次大程序。">
<text x="20.0" y="24.0" font-size="14" class="gt">1924—1996：一具身体和管它的机构</text>
<circle class="gdot" cx="26" cy="46" r="3.5"/>
<text x="38.0" y="50.0" font-size="13">1924</text>
<text x="38.0" y="70.0" font-size="12">1 月 21 日去世。解剖，做了只管几天的临时防腐。</text>
<text x="38.0" y="90.0" font-size="12">3 月底开始长期保存的试验，7 月底做成。</text>
<text x="38.0" y="110.0" font-size="12">葬礼委员会、遗体保存委员会是两个机构；</text>
<text x="38.0" y="130.0" font-size="12">后者 7 月改称“永久纪念列宁委员会”。</text>
<circle class="gdot" cx="26" cy="160" r="3.5"/>
<text x="38.0" y="164.0" font-size="13">1939</text>
<text x="38.0" y="184.0" font-size="12">设立专门的实验室。</text>
<circle class="gdot" cx="26" cy="214" r="3.5"/>
<text x="38.0" y="218.0" font-size="13">1941—45</text>
<text x="38.0" y="238.0" font-size="12">遗体疏散到秋明。1945 年 2 月右脚少了一块皮，</text>
<text x="38.0" y="258.0" font-size="12">此后新办法先在“实验对象”上试。</text>
<circle class="gdot" cx="26" cy="288" r="3.5"/>
<text x="38.0" y="292.0" font-size="13">1953—61</text>
<text x="38.0" y="312.0" font-size="12">斯大林的遗体并排陈列，1961 年移出。</text>
<circle class="gdot" cx="26" cy="342" r="3.5"/>
<text x="38.0" y="346.0" font-size="13">1960—80 年代</text>
<text x="38.0" y="366.0" font-size="12">研究所最盛时约两百人。</text>
<circle class="gdot" cx="26" cy="396" r="3.5"/>
<text x="38.0" y="400.0" font-size="13">1991</text>
<text x="38.0" y="420.0" font-size="12">苏联解体。此后国家经费大减。</text>
<circle class="gdot" cx="26" cy="450" r="3.5"/>
<text x="38.0" y="454.0" font-size="13">1993—95</text>
<text x="38.0" y="474.0" font-size="12">研究所对外报价，长期保存无人订购。</text>
<text x="38.0" y="494.0" font-size="12">同一时期，另外的私人公司在做几天的临时防腐，</text>
<text x="38.0" y="514.0" font-size="12">主顾里常有帮派中人。两者不是一回事。</text>
<circle class="gdot" cx="26" cy="544" r="3.5"/>
<text x="38.0" y="548.0" font-size="13">1996</text>
<text x="38.0" y="568.0" font-size="12">遗体仍在陵墓，每 18 个月照旧做一次“大程序”。</text>
<path class="l thin" fill="none" d="M20 588H380"/>
<text x="20.0" y="610.0" font-size="12">据 Yurchak 2015 及当年报道；</text>
<text x="20.0" y="630.0" font-size="12">1953—61 一行凭通行说法，未另核。</text>
</svg>
