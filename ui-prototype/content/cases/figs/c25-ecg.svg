<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 326" role="img" aria-label="示意图：两条心电图。上面一条是课本上常见的样子：一个小包，一个又高又尖的峰，落回平线，平一小段，再鼓一个圆包，这样重复三次。下面一条是小说里涛胸前导联上的样子：尖峰落下来以后没有回到平线，悬在高处，拖着一道斜坡慢慢滑到平线底下，勾一个小弯才回来，后面没有圆包，每一跳都一样。图只画出大概的样子，不能用来对照诊断。">
