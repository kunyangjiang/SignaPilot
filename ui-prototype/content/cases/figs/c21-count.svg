<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" role="img" aria-label="小说虚构的设计：匣子里该剩几根。甲，她换了：匣中原有 20 根，取走 1 根，她交回的是怀里那根练习管，该剩 19。乙，样品混入：匣中原有 21 根，即 20 根加样品，取走的恰是样品，她没有换，该剩 20。丙，她分不出：两根在膝上并排，无号无记，她自己不知道交回的是哪根，剩 19 或 20。濑川数到的是 20，他的手在抖，只数了一遍。三种情形都答不了她是否隔着铅看见了字。真实的记录里没有匣中余数这一项。">
