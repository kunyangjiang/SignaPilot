<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 384" role="img" aria-label="哀章铜匮的两道检：天帝行玺金匮图；赤帝行玺某传予黄帝金策书，某是高皇帝名讳。按金匮封拜的十一人：四辅太师王舜、太傅平晏、国师刘歆、国将哀章；三公大司马甄邯、大司徒王寻、大司空王邑；四将更始将军甄丰、卫将军王兴、立国将军孙建、前将军王盛。其中哀章、王兴、王盛不是王莽旧臣。">
<text x="20.0" y="24.0" font-size="14" class="gt">哀章铜匮：两道检，十一个名字</text>
<rect class="l" x="20" y="42" width="360" height="28" rx="2" fill="none"/>
<text x="32.0" y="61.0" font-size="12">检一</text>
<text x="70.0" y="61.0" font-size="14">天帝行玺金匮图</text>
<rect class="l" x="20" y="82" width="360" height="28" rx="2" fill="none"/>
<text x="32.0" y="101.0" font-size="12">检二</text>
<text x="70.0" y="101.0" font-size="14">赤帝行玺某传予黄帝金策书</text>
<text x="20.0" y="136.0" font-size="12">“某”是高皇帝的名讳，《汉书》写作“某”。</text>
<path class="l thin" fill="none" d="M20 152H380"/>
<text x="20.0" y="172.0" font-size="13">按金匮封拜的十一人（据《汉书·王莽传中》）</text>
<text x="20.0" y="198.0" font-size="13">四辅</text>
<text x="20.0" y="222.0" font-size="12">太师</text>
<text x="54.0" y="222.0" font-size="13">王舜</text>
<text x="20.0" y="246.0" font-size="12">太傅</text>
<text x="54.0" y="246.0" font-size="13">平晏</text>
<text x="20.0" y="270.0" font-size="12">国师</text>
<text x="54.0" y="270.0" font-size="13">刘歆</text>
<text x="20.0" y="294.0" font-size="12">国将</text>
<text x="54.0" y="294.0" font-size="13">哀章</text>
<path class="gl" fill="none" d="M54 299h27"/>
<text x="150.0" y="198.0" font-size="13">三公</text>
<text x="150.0" y="222.0" font-size="12">大司马</text>
<text x="198.0" y="222.0" font-size="13">甄邯</text>
<text x="150.0" y="246.0" font-size="12">大司徒</text>
<text x="198.0" y="246.0" font-size="13">王寻</text>
<text x="150.0" y="270.0" font-size="12">大司空</text>
<text x="198.0" y="270.0" font-size="13">王邑</text>
<text x="268.0" y="198.0" font-size="13">四将</text>
<text x="268.0" y="222.0" font-size="12">更始将军</text>
<text x="330.0" y="222.0" font-size="13">甄丰</text>
<text x="268.0" y="246.0" font-size="12">卫将军</text>
<text x="316.0" y="246.0" font-size="13">王兴</text>
<path class="gl" fill="none" d="M316 251h27"/>
<text x="268.0" y="270.0" font-size="12">立国将军</text>
<text x="330.0" y="270.0" font-size="13">孙建</text>
<text x="268.0" y="294.0" font-size="12">前将军</text>
<text x="316.0" y="294.0" font-size="13">王盛</text>
<path class="gl" fill="none" d="M316 299h27"/>
<text x="20.0" y="336.0" font-size="12">画线三人不是王莽旧臣：哀章把自己写了进去；</text>
<text x="20.0" y="354.0" font-size="12">王兴、王盛是“取令名”，事后按名字在长安找人。</text>
<text x="20.0" y="372.0" font-size="12">国师刘歆此时已改名刘秀（建平元年）。</text>
</svg>
